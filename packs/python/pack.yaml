id: python
description: Python projects, type-checked with ty.
level: project
detect:
  # a packaging file; else, a plain-scripts project: a .py file of its own (not vendored, generated or in a virtual environment)
  files_any: [pyproject.toml, setup.py, setup.cfg, "requirements*.txt", Pipfile]
  sources_any: ["**/*.py"]
context:
  - text: |
      Parameters and return types are annotated.
  - text: |
      Inside `async def`, no blocking calls: sync HTTP clients, `time.sleep`, `open()` and `pathlib` I/O, blocking `subprocess`, `input()`. A caught `asyncio.CancelledError` is re-raised, and a `try` around a task group catches with `except*`.
  - text: |
      Ignore comments name their rule (`# ty: ignore[rule-name]`), and a changed file does not gain suppression comments.
  - text: |
      A change leaves no code unused: when it removes the last use of a function, class, import or private name, it removes that too, in whichever file it is. Code that a framework calls by name and nothing imports is whitelisted in `[tool.condor]` (`ignore_names`), with the user's agreement.
  - text: |
      This project declares no dependencies yet: a third-party package is declared before it is installed, either as `name==version` in requirements.txt (then `pip install -r requirements.txt`) or in a project created with `uv init --bare` (then `uv add name`).
    when: {facts: {python.pm: none}}
  - text: |
      Dependencies are declared in pyproject.toml (`[project] dependencies`, tooling in `[dependency-groups]`): a new one goes there first, then the project is installed again.
    when: {facts: {python.pm: pyproject}}
