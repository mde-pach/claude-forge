id: python
description: Python projects, type-checked with ty.
level: project
detect:
  # a packaging file; else, a plain-scripts project: a .py file of its own (not vendored, generated or in a virtual environment)
  files_any: [pyproject.toml, setup.py, setup.cfg, "requirements*.txt", Pipfile]
  sources_any: ["**/*.py"]
context:
  - text: |
      Parameters and return types are annotated.
  - text: |
      Inside `async def`, no blocking calls: sync HTTP clients, `time.sleep`, `open()` and `pathlib` I/O, blocking `subprocess`, `input()`. A caught `asyncio.CancelledError` is re-raised, and a `try` around a task group catches with `except*`.
  - text: |
      Ignore comments name their rule (`# ty: ignore[rule-name]`), and a changed file does not gain suppression comments.
  - text: |
      This project has no Python packaging file: when a third-party package is needed, create the project with `uv init --bare`, then `uv add <pkg>`.
    when: {facts: {python.pm: none}}
