id: python/uv
description: uv is the Python package manager.
level: project
detect:
  facts_any: {python.pm: uv}
context:
  - text: |
      The project is managed with uv: dependencies are added with `uv add` (`uv add --dev` for tooling), and tools run through the project's environment (`uv run <tool>`).
  - text: |
      A `pyproject.toml` you create gets `[tool.uv]` with `exclude-newer = "7 days"` and `required-version = ">=0.9.17"`, so freshly published versions are not resolved; one you edit keeps the `[tool.uv]` settings it has.
