id: python/fastapi/cors-credentials-wildcard
description: CORS never combines allow_origins=["*"] with allow_credentials=True. List the allowed origins.
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      pattern: "$APP.add_middleware(CORSMiddleware, $$$)"
      all:
        - has: {stopBy: end, kind: keyword_argument, regex: "^allow_origins[[:space:]]*=[[:space:]]*\\[[[:space:]]*[\"']\\*[\"'][[:space:]]*,?[[:space:]]*\\]$"}
        - has: {stopBy: end, kind: keyword_argument, regex: "^allow_credentials[[:space:]]*=[[:space:]]*True$"}
examples:
  match: ["app.add_middleware(CORSMiddleware, allow_origins=[\"*\"], allow_credentials=True)\n", "app.add_middleware(\n    CORSMiddleware,\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_origins=['*'],\n)\n"]
  no_match: ["app.add_middleware(CORSMiddleware, allow_origins=settings.origins, allow_credentials=True)\n", "app.add_middleware(CORSMiddleware, allow_origins=[\"*\"])\n"]
