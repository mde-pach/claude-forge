id: python/fastapi/testclient-lifespan
description: "TestClient(app) is entered as a context manager (with TestClient(app) as client:, a fixture yielding inside the with): otherwise the app's lifespan never runs, and startup work such as opening the database pool is skipped."
scope: {language: python, files: ["@python-tests"]}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      kind: call
      pattern: $C
      not: {inside: {kind: with_item, stopBy: end}}
    where:
      C: {type: {package: starlette, name: TestClient}}
examples:
  deps: [{ecosystem: pypi, name: fastapi, version: "0.162.0"}, {ecosystem: pypi, name: httpx, version: "0.28.1"}]
  match:
    - "from fastapi import FastAPI\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\nclient = TestClient(app)\n\n\ndef test_root() -> None:\n    assert client.get(\"/\").status_code == 404\n"
  no_match:
    - "from collections.abc import Iterator\n\nimport pytest\nfrom fastapi import FastAPI\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\n\n\n@pytest.fixture\ndef client() -> Iterator[TestClient]:\n    with TestClient(app) as c:\n        yield c\n"
    - "import httpx\n\n\ndef test_ping() -> None:\n    client = httpx.Client(base_url=\"http://testserver\")\n    assert client is not None\n"
