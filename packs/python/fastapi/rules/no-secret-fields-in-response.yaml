id: python/fastapi/no-secret-fields-in-response
description: "A response model (a Pydantic model whose name ends in Out, Read, Response or Public) declares no password or password-hash field (password, hashed_password, password_hash, password_digest): every field it declares is serialized to the client. Leave the field out of the response model; keep it on the ORM model or an input model."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: assignment
      all:
        - has: {field: left, regex: "^(password|passwd|hashed_password|password_hash|password_digest|hashed_pw)$"}
        - inside:
            kind: expression_statement
            inside:
              kind: block
              inside:
                kind: class_definition
                all:
                  - has: {field: name, regex: "(Out|Read|Response|Public)$"}
                  - has: {field: superclasses, has: {pattern: $B}}
    # SQLModel and BaseSettings derive from BaseModel too; the name suffix is what marks a response
    where:
      B: {type: {package: pydantic, name: BaseModel}}
examples:
  deps: [{ecosystem: pypi, name: pydantic, version: "2.14.1"}]
  match:
    - |
      from pydantic import BaseModel, ConfigDict


      class UserOut(BaseModel):
          model_config = ConfigDict(from_attributes=True)

          id: int
          email: str
          hashed_password: str
    - |
      from pydantic import BaseModel


      class UserBase(BaseModel):
          email: str


      class UserPublic(UserBase):
          id: int
          password: str | None = None
  no_match:
    - |
      from pydantic import BaseModel


      class UserCreate(BaseModel):
          email: str
          password: str


      class UserInDB(BaseModel):
          id: int
          hashed_password: str


      class UserOut(BaseModel):
          id: int
          email: str
    # an OAuth token endpoint returns its token
    - |
      from pydantic import BaseModel


      class TokenResponse(BaseModel):
          access_token: str
          refresh_token: str
          token_type: str = "bearer"
    - |
      from dataclasses import dataclass


      @dataclass
      class LoginResponse:
          ok: bool
          password: str
