id: python/fastapi/no-testclient-in-async-test
description: "No TestClient inside an async def: it runs the app on another event loop in a thread, so async fixtures (database sessions, pools) cross loops and fail or hang. Use httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url=\"http://test\")."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call
      pattern: $C
      inside: {kind: function_definition, regex: "^async[[:space:]]", stopBy: end}
    where:
      C: {type: {package: starlette, name: TestClient}}
examples:
  deps: [{ecosystem: pypi, name: fastapi, version: "0.162.0"}, {ecosystem: pypi, name: httpx, version: "0.28.1"}]
  match:
    - "from fastapi import FastAPI\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\n\n\nasync def test_root() -> None:\n    with TestClient(app) as client:\n        assert client.get(\"/\").status_code == 404\n"
  no_match:
    - "from fastapi import FastAPI\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\n\n\ndef test_root() -> None:\n    with TestClient(app) as client:\n        assert client.get(\"/\").status_code == 404\n"
    - "import httpx\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n\nasync def test_root() -> None:\n    transport = httpx.ASGITransport(app=app)\n    async with httpx.AsyncClient(transport=transport, base_url=\"http://test\") as client:\n        assert (await client.get(\"/\")).status_code == 404\n"
