id: python/fastapi/basic-auth-compare-digest
description: "HTTP Basic credentials (HTTPBasicCredentials.username / .password) are compared with secrets.compare_digest, never == or !=, which leak through timing how much of the value matched."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: comparison_operator
      regex: "(==|!=)"
      has:
        any:
          - {pattern: "$C.password"}
          - {pattern: "$C.username"}
    # the credentials are FastAPI's by their type (§15.1), whatever the parameter is called
    where:
      C: {type: {package: fastapi, name: HTTPBasicCredentials}}
examples:
  deps: [{ecosystem: pypi, name: fastapi, version: "0.162.0"}]
  match:
    - "from typing import Annotated\n\nfrom fastapi import Depends, FastAPI, HTTPException\nfrom fastapi.security import HTTPBasic, HTTPBasicCredentials\n\napp = FastAPI()\nsecurity = HTTPBasic()\n\n\n@app.get(\"/me\")\ndef me(credentials: Annotated[HTTPBasicCredentials, Depends(security)]) -> str:\n    if credentials.username != \"admin\" or credentials.password != \"s3cret\":\n        raise HTTPException(status_code=401)\n    return credentials.username\n"
    - "from fastapi.security import HTTPBasicCredentials as Basic\n\n\ndef check(c: Basic, expected: str) -> bool:\n    return c.password == expected\n"
  no_match:
    - "import secrets\nfrom typing import Annotated\n\nfrom fastapi import Depends, FastAPI, HTTPException\nfrom fastapi.security import HTTPBasic, HTTPBasicCredentials\n\napp = FastAPI()\nsecurity = HTTPBasic()\n\n\n@app.get(\"/me\")\ndef me(credentials: Annotated[HTTPBasicCredentials, Depends(security)]) -> str:\n    ok_user = secrets.compare_digest(credentials.username.encode(), b\"admin\")\n    ok_pass = secrets.compare_digest(credentials.password.encode(), b\"s3cret\")\n    if not (ok_user and ok_pass):\n        raise HTTPException(status_code=401)\n    return credentials.username\n"
    - "from dataclasses import dataclass\n\n\n@dataclass\nclass Account:\n    username: str\n    password: str\n\n\ndef same_user(a: Account, b: Account) -> bool:\n    return a.username == b.username\n"
