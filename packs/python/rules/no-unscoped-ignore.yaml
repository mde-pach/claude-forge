id: python/no-unscoped-ignore
description: "Ignore comments name the rule they silence (# ty: ignore[rule]); no blanket ignores."
scope: {language: python}
enforce:
  - target: tool
    tool: ty
    expects: blanket-ignore-comment
    snippet: '[tool.ty.rules] blanket-ignore-comment = "error"'
  - target: tool
    tool: ruff
    expects: PGH003
    snippet: '[tool.ruff.lint] extend-select = ["PGH003"]'
examples:
  match: ["x: int = \"a\"  # ty: ignore\ny: int = \"b\"  # type: ignore\n"]
  no_match: ["x: int = \"a\"  # ty: ignore[invalid-assignment]\n", "x = int(\"1\")\n"]
