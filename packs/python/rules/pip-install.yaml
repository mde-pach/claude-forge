id: python/pip-install
description: Packages go into the project through its package manager, not with pip into its environment.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    check: python-pm
examples:
  match:
    - {command: "pip install requests", files: {pyproject.toml: "[project]\nname = \"x\"\n", uv.lock: ""}}
    - {command: "python3 -m pip install -r requirements.txt", files: {uv.lock: ""}}
    - {command: "uv pip install httpx", files: {pyproject.toml: "[project]\nname = \"x\"\n"}}
    - {command: "pip install requests", files: {main.py: "print(1)\n"}}
  no_match:
    - {command: "pip install --dry-run requests", files: {uv.lock: ""}}
    - {command: "pip show requests", files: {uv.lock: ""}}
    - {command: "pip install requests", files: {poetry.lock: ""}}
    - {command: "pip install -r requirements.txt", files: {requirements.txt: "requests==2.32.5\n"}}
    - {command: "pip install --target /tmp/vendor requests", files: {uv.lock: ""}}
