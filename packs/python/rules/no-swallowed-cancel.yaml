id: python/no-swallowed-cancel
description: "An except handler that catches asyncio.CancelledError (alone or in a tuple) re-raises it: swallowing it breaks cancellation, timeouts and task group shutdown."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: except_clause
      has:
        field: value
        any:
          - regex: "^asyncio\\.CancelledError(\\s+as\\s+\\w+)?$"
          - {kind: tuple, has: {regex: "^asyncio\\.CancelledError$"}}
          - {kind: as_pattern, has: {kind: tuple, has: {regex: "^asyncio\\.CancelledError$"}}}
          # CancelledError imported from asyncio by that name (asyncio's own API name)
          - all:
              - any:
                  - regex: "^CancelledError(\\s+as\\s+\\w+)?$"
                  - {kind: tuple, has: {regex: "^CancelledError$"}}
                  - {kind: as_pattern, has: {kind: tuple, has: {regex: "^CancelledError$"}}}
              - inside:
                  kind: module
                  stopBy: end
                  has: {kind: import_from_statement, regex: "^from\\s+asyncio\\s+import\\s[^;]*\\bCancelledError\\s*(,|\\)|$)"}
      not:
        has:
          kind: raise_statement
          stopBy: {any: [{kind: function_definition}, {kind: lambda}, {kind: class_definition}]}
examples:
  match:
    - "import asyncio\nimport logging\n\nlog = logging.getLogger(__name__)\n\n\nasync def worker(q: asyncio.Queue[int]) -> None:\n    try:\n        await q.get()\n    except asyncio.CancelledError:\n        log.info(\"worker stopped\")\n"
    - "import asyncio\n\n\nasync def worker(q: asyncio.Queue[int]) -> int | None:\n    try:\n        return await q.get()\n    except (asyncio.CancelledError, TimeoutError) as err:\n        print(err)\n        return None\n"
    - "from asyncio import CancelledError, Queue\n\n\nasync def worker(q: Queue[int]) -> None:\n    try:\n        await q.get()\n    except CancelledError:\n        def later() -> None:\n            raise RuntimeError\n        later()\n"
  no_match:
    - "import asyncio\nimport logging\n\nlog = logging.getLogger(__name__)\n\n\nasync def worker(q: asyncio.Queue[int]) -> None:\n    try:\n        await q.get()\n    except asyncio.CancelledError:\n        log.info(\"worker stopped\")\n        raise\n"
    - "import asyncio\n\n\nasync def worker(q: asyncio.Queue[int]) -> None:\n    try:\n        await q.get()\n    except (asyncio.CancelledError, TimeoutError) as err:\n        if isinstance(err, asyncio.CancelledError):\n            raise\n"
    - "import asyncio\n\n\nasync def worker(q: asyncio.Queue[int]) -> None:\n    try:\n        await q.get()\n    except asyncio.QueueEmpty:\n        pass\n"
    - "from concurrent.futures import CancelledError\n\n\ndef wait(f) -> None:\n    try:\n        f.result()\n    except CancelledError:\n        pass\n"
