id: python/no-useless-cast
description: No cast() that is unnecessary or between unrelated types. Narrow with isinstance or validate instead.
scope: {language: python}
enforce:
  - target: tool
    tool: ty
    expects: redundant-cast
    snippet: '[tool.ty.rules] redundant-cast = "error"'
  - target: tool
    tool: ty
    expects: disjoint-cast
    snippet: '[tool.ty.rules] disjoint-cast = "error"'
examples:
  match: ["from typing import cast\n\n\ndef f(n: int) -> str:\n    m = cast(int, n)\n    return cast(str, m)\n"]
  no_match: ["from typing import cast\n\n\ndef f(n: object) -> int:\n    return cast(int, n)\n"]
