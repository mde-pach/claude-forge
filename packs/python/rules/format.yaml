id: python/format
description: Python files are formatted with ruff.
scope: {language: python}
enforce:
  - target: check
    stage: format
    run: "forge_do ruff format-check ."
    changed_run: "forge_do ruff format {files}"
    # formats a file's base copy, so lines that only formatting changed are not counted as added
    format_stdin: "forge_do ruff format-stdin {file}"
examples:
  match: ["x=1\n"]
  no_match: ["x = 1\n"]
