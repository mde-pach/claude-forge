id: python/no-passlib
description: "No passlib, which is unmaintained; use pwdlib, argon2-cffi or bcrypt."
scope: {language: python}
enforce:
  - target: tool
    tool: ruff
    expects: TID251
    snippet: |
      [tool.ruff.lint]
      extend-select = ["TID251"]

      [tool.ruff.lint.flake8-tidy-imports.banned-api]
      "passlib".msg = "passlib is unmaintained; use pwdlib, argon2-cffi or bcrypt"
examples:
  match:
    - "from passlib.context import CryptContext\n\npwd = CryptContext(schemes=[\"bcrypt\"])\n"
  no_match:
    - "from pwdlib import PasswordHash\n\npwd = PasswordHash.recommended()\n"
