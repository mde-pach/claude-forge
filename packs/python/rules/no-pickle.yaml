id: python/no-pickle
description: "No pickle on data you did not write: unpickling runs code. Use JSON or a schema."
scope: {language: "python"}
enforce:
  - target: tool
    tool: ruff
    expects: "S301"
    snippet: "[tool.ruff.lint] extend-select = [\"S301\"]"
examples:
  match:
    - "import pickle\n\n\ndef load(data: bytes) -> object:\n    return pickle.loads(data)\n"
  no_match:
    - "import json\n\n\ndef load(data: bytes) -> object:\n    return json.loads(data)\n"
