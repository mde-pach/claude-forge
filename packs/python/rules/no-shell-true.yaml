id: python/no-shell-true
description: subprocess runs an argument list, never a shell string (shell=True).
scope: {language: python}
enforce:
  - target: tool
    tool: ruff
    expects: S602
    snippet: '[tool.ruff.lint] extend-select = ["S602"]'
examples:
  match: ["import subprocess\n\n\ndef f(cmd: str) -> None:\n    subprocess.run(cmd, shell=True)\n", "import subprocess\n\n\ndef ls(d: str) -> None:\n    subprocess.Popen(f\"ls {d}\", shell=True)\n"]
  no_match: ["import subprocess\n\n\ndef ls(d: str) -> None:\n    subprocess.run([\"ls\", d], check=True)\n", "import subprocess\n\nsubprocess.run([\"git\", \"status\"], check=True)\n"]
