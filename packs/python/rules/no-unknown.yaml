id: python/no-unknown
description: Parameters and return types are annotated, so no value is Unknown to the type checker (and type constraints of other rules see every receiver).
scope: {language: python}
enforce:
  - target: tool
    tool: ruff
    expects: ANN001
    snippet: '[tool.ruff.lint] extend-select = ["ANN001"]'
  - target: tool
    tool: ruff
    expects: ANN002
    snippet: '[tool.ruff.lint] extend-select = ["ANN002"]'
  - target: tool
    tool: ruff
    expects: ANN003
    snippet: '[tool.ruff.lint] extend-select = ["ANN003"]'
  - target: tool
    tool: ruff
    expects: ANN201
    snippet: '[tool.ruff.lint] extend-select = ["ANN201"]'
  - target: tool
    tool: ruff
    expects: ANN202
    snippet: '[tool.ruff.lint] extend-select = ["ANN202"]'
examples:
  match: ["def f(x, *args, **kwargs):\n    return x\n\n\ndef _g(y):\n    return y\n"]
  no_match: ["def f(x: int, *args: int, **kwargs: str) -> int:\n    return x\n\n\ndef _g(y: str) -> str:\n    return y\n"]
