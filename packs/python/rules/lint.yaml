id: python/lint
description: Python files pass ruff check.
scope: {language: python}
enforce:
  - target: check
    stage: lint
    # ruff's operations, as the installed release does them (§16: forge_do, src/adapters/ruff.ts)
    run: "forge_do ruff lint ."
    changed_run: "forge_do ruff lint {files}"
    # ruff also lints pyproject.toml (RUF200, python/valid-pyproject): a changed one is linted too
    config_files: ["**/pyproject.toml"]
    # after an edit: sorted imports and pyupgrade, when the project selects them; never F401/F841 (an import added now is used in the next edit)
    fix_run: "forge_do ruff fix {files}"
examples:
  match: ["import os\n"]
  no_match: ["X = 1\n"]
