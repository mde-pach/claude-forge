id: python/no-secret-logging
description: "No secret in a log line, print() or exception message: a variable, attribute or header named like a token, secret, password, API key, private or access key, authorization or credentials, passed to a logger call, print() or a raised exception (directly, in an f-string, with + or as a keyword value) is rejected. Log an id or a masked value instead; a name such as max_tokens, has_token, password_hash or next_page_token is not a secret."
scope: {language: python, files: ["!**/tests/**", "!**/test_*.py", "!**/conftest.py", "!**/management/commands/**", "!scripts/**", "!**/cli.py"]}
enforce:
  - target: ast-grep
    mode: forbid
    utils:
      secret-name:
        any:
          - {kind: identifier, regex: "(?i)(^|_)(token|secret|password|passwd|pwd|api_?key|apikey|secret_?key|private_?key|access_?key|authorization|credentials?)$"}
          - {kind: attribute, has: {field: attribute, regex: "(?i)(^|_)(token|secret|password|passwd|pwd|api_?key|apikey|secret_?key|private_?key|access_?key|authorization|credentials?)$"}}
          - kind: subscript
            has: {field: subscript, regex: "(?i)^[\"'](x-)?(authorization|api-?key|token|password|secret|cookie|x-api-key)[\"']$"}
        not: {regex: "(?i)(^|[._])(has|is|use|should|needs?|num|max|min|count|total|len|page|next|prev|continuation|pagination|cursor|sync|cancel|cancellation|csrf|xsrf)_[a-z_]*$"}
      sink:
        any:
          - kind: call
            has: {field: function, regex: "^print$|(?i)^([A-Za-z_][A-Za-z0-9_]*\\.)*_?(log|logger|logging)\\.(debug|info|warning|warn|error|exception|critical|fatal|log|msg)$"}
          - kind: call
            inside: {kind: raise_statement, stopBy: neighbor}
    rule:
      matches: secret-name
      any:
        - inside: {kind: argument_list, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}
        - inside: {kind: keyword_argument, field: value, stopBy: neighbor, inside: {kind: argument_list, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}
        - inside: {kind: interpolation, stopBy: neighbor, inside: {kind: string, stopBy: neighbor, inside: {stopBy: end, kind: argument_list, inside: {matches: sink, stopBy: neighbor}}}}
        - inside: {kind: binary_operator, stopBy: neighbor, inside: {kind: argument_list, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}
        - inside: {kind: pair, field: value, stopBy: neighbor, inside: {kind: dictionary, stopBy: neighbor, inside: {kind: keyword_argument, stopBy: neighbor, inside: {kind: argument_list, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}}}
examples:
  match:
    - "def refresh(token: str) -> None:\n    logger.info(f\"refreshing with token={token}\")\n"
    - "def call(api_key: str) -> None:\n    log.debug(\"calling with %s\", api_key)\n"
    - "def check(request) -> None:\n    logging.warning(\"header %s\", request.headers[\"Authorization\"])\n"
    - "def connect(password: str) -> None:\n    raise ConnectionError(\"login failed with \" + password)\n"
    - "def boot() -> None:\n    print(f\"key: {settings.SECRET_KEY}\")\n"
    - "def login(user, password: str) -> None:\n    log.info(\"login\", user=user.id, password=password)\n"
    - "def audit(self, access_token: str) -> None:\n    self.logger.error(\"refused\", extra={\"access_token\": access_token})\n"
  no_match:
    - "def usage(max_tokens: int, has_token: bool) -> None:\n    logger.info(\"budget %s, authenticated %s\", max_tokens, has_token)\n"
    - "def refresh(token: str) -> None:\n    logger.info(\"refreshing token ending %s\", token[-4:])\n"
    - "def page(next_page_token: str) -> None:\n    logger.debug(\"next page %s\", next_page_token)\n"
    - "def reset(user) -> None:\n    logger.info(\"password reset for %s\", user.id)\n    raise ValueError(\"password is too short\")\n"
    - "def store(password_hash: str) -> None:\n    logger.debug(\"stored hash %s\", password_hash)\n"
    - "def remember(token: str) -> None:\n    cache.set(\"token\", token)\n"
