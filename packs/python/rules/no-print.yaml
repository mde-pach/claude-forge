id: python/no-print
description: No print in application code. Use logging.
scope: {language: "python"}
enforce:
  - target: tool
    tool: ruff
    expects: "T201"
    snippet: "[tool.ruff.lint] extend-select = [\"T201\"]\n[tool.ruff.lint.per-file-ignores] \"scripts/**\" = [\"T201\"]  # and your CLI entry points"
examples:
  match:
    - "def handle() -> None:\n    print(\"handled\")\n"
  no_match:
    - "import logging\n\nlogger = logging.getLogger(__name__)\n\n\ndef handle() -> None:\n    logger.info(\"handled\")\n"
