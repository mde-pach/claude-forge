id: python/no-hardcoded-password
description: No password or secret literal in code. Read it from the environment or a secret store.
scope: {language: "python"}
enforce:
  - target: tool
    tool: ruff
    expects: "S105"
    snippet: "[tool.ruff.lint] extend-select = [\"S105\", \"S106\"]\n[tool.ruff.lint.per-file-ignores] \"tests/**\" = [\"S105\", \"S106\"]"
  - target: tool
    tool: ruff
    expects: "S106"
    snippet: "[tool.ruff.lint] extend-select = [\"S105\", \"S106\"]\n[tool.ruff.lint.per-file-ignores] \"tests/**\" = [\"S105\", \"S106\"]"
examples:
  match:
    - "PASSWORD = \"hunter2\"\nconnect(user=\"app\", password=\"hunter2\")\n"
  no_match:
    - "import os\n\nPASSWORD = os.environ[\"DB_PASSWORD\"]\nconnect(user=\"app\", password=PASSWORD)\n"
