id: python/no-silent-fallback
description: "An except clause for an I/O, network or database failure (OSError, ConnectionError, TimeoutError, requests' or httpx's errors, SQLAlchemyError, botocore's errors) does not just return None, an empty value or False: the caller then cannot tell \"nothing there\" from \"the service is down\". Let it propagate, raise a domain error from it (raise X from err), or log it before falling back."
scope: {language: python}
enforce:
  # Exception and BaseException are python/no-blind-except's (BLE001), pass and continue
  # python/no-silent-except's (S110/S112); a narrow lookup error (KeyError, ValueError,
  # FileNotFoundError) turned into None is ordinary code
  - target: ast-grep
    mode: advise
    rule:
      kind: except_clause
      regex: "^except\\*?[[:space:]]*\\(?[^:]*\\b(OSError|IOError|EnvironmentError|ConnectionError|TimeoutError|RequestException|HTTPError|HTTPStatusError|RequestError|TransportError|SQLAlchemyError|DBAPIError|DatabaseError|OperationalError|BotoCoreError|ClientError)\\b"
      has:
        kind: block
        all:
          - has: {nthChild: 1, kind: return_statement, matches: fallback}
          - not: {has: {nthChild: 2}}
    utils:
      fallback:
        any:
          - regex: "^return$"
          - has: {any: [{kind: none}, {kind: "false"}, {kind: list, regex: "^\\[\\]$"}, {kind: dictionary, regex: "^\\{\\}$"}, {kind: string, regex: "^(\"\"|'')$"}]}
examples:
  match:
    - "import requests\n\n\ndef fetch_rate(currency: str) -> float | None:\n    try:\n        resp = requests.get(f\"https://rates.example.com/{currency}\", timeout=5)\n        resp.raise_for_status()\n        return resp.json()[\"rate\"]\n    except requests.RequestException:\n        return None\n"
    - "from sqlalchemy.exc import SQLAlchemyError\nfrom sqlalchemy.orm import Session\n\nfrom app.models import Order\n\n\ndef open_orders(db: Session) -> list[Order]:\n    try:\n        return db.query(Order).filter(Order.open.is_(True)).all()\n    except SQLAlchemyError:\n        return []\n"
    - "import json\n\n\ndef load_config(path: str) -> dict[str, str]:\n    try:\n        with open(path) as f:\n            return json.load(f)\n    except (OSError, json.JSONDecodeError):\n        return {}\n"
    - "import httpx\n\n\nasync def is_up(client: httpx.AsyncClient, url: str) -> bool:\n    try:\n        await client.get(url)\n    except httpx.HTTPError as err:\n        return False\n    return True\n"
  no_match:
    - "def price(prices: dict[str, int], sku: str) -> int | None:\n    try:\n        return prices[sku]\n    except KeyError:\n        return None\n"
    - "from pathlib import Path\n\n\ndef read_token(path: Path) -> str:\n    try:\n        return path.read_text()\n    except FileNotFoundError:\n        return \"\"\n"
    - "import logging\n\nimport requests\n\nlogger = logging.getLogger(__name__)\n\n\ndef fetch_rate(currency: str) -> float | None:\n    try:\n        resp = requests.get(f\"https://rates.example.com/{currency}\", timeout=5)\n        return resp.json()[\"rate\"]\n    except requests.RequestException:\n        logger.warning(\"rate service unavailable\", exc_info=True)\n        return None\n"
    - "import requests\n\n\nclass RateUnavailable(Exception):\n    pass\n\n\ndef fetch_rate(currency: str) -> float:\n    try:\n        return requests.get(f\"https://rates.example.com/{currency}\", timeout=5).json()[\"rate\"]\n    except requests.RequestException as err:\n        raise RateUnavailable(currency) from err\n"
    - "import socket\n\n\ndef resolve(host: str) -> list[str]:\n    try:\n        return [socket.gethostbyname(host)]\n    except OSError:\n        return [\"127.0.0.1\"]\n"
