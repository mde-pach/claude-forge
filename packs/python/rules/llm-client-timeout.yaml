id: python/llm-client-timeout
description: "Anthropic and OpenAI SDK clients and calls never set timeout=None (the client constructor, with_options(), a request): a request could then wait forever, and is retried. Keep the SDK's default or pass a number of seconds. requests and httpx are python/http-timeout."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call
      pattern: $CALL
      has: {field: arguments, has: {kind: keyword_argument, regex: "^timeout[[:space:]]*=[[:space:]]*None$"}}
    # the call returns an object of the SDK (a client, a Message, a completion)
    where:
      CALL: {type: {package: [anthropic, openai]}}
examples:
  deps: [{ecosystem: pypi, name: anthropic, version: "2.3.0"}, {ecosystem: pypi, name: openai, version: "3.37.0"}]
  match:
    - "from anthropic import Anthropic\n\nclient = Anthropic(timeout=None)\n"
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nslow = client.with_options(timeout=None)\n"
    - "from openai import OpenAI\n\nclient = OpenAI(timeout=None)\n"
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nreply = client.messages.create(model=\"claude-opus-5-5\", max_tokens=1024, messages=[], timeout=None)\n"
  no_match:
    - "from anthropic import Anthropic\n\nclient = Anthropic(timeout=30.0)\n"
    - "def fetch(url: str, timeout: float | None = 5) -> str:\n    return url\n\n\nfetch(\"https://example.com\", timeout=None)\n"
