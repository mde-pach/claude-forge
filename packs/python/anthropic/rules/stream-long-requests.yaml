id: python/anthropic/stream-long-requests
description: "A messages.create() or messages.parse() call with max_tokens above 21,333 and no stream=True streams instead (client.messages.stream(...), then get_final_message()): the SDK refuses such a non-streaming request before sending it (expected to exceed 10 minutes), and with a custom timeout the HTTP request may time out."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      pattern: $C.$M($$$)
      all:
        - has:
            field: arguments
            has:
              kind: keyword_argument
              regex: "^max_tokens[[:space:]]*="
              has: {field: value, kind: integer, regex: "^(2133[4-9]|213[4-9][0-9]|21[4-9][0-9]{2}|2[2-9][0-9]{3}|[3-9][0-9]{4}|[1-9][0-9]{5,})$|^(21_33[4-9]|21_3[4-9][0-9]|21_[4-9][0-9]{2}|2[2-9]_[0-9]{3}|[3-9][0-9]_[0-9]{3}|[1-9][0-9]{2,}_[0-9]{3})$"}
        - not: {has: {field: arguments, has: {kind: keyword_argument, regex: "^stream[[:space:]]*=[[:space:]]*True$"}}}
    constraints: {M: {regex: "^(create|parse)$"}}
    where:
      C: {type: {package: anthropic, name: [Messages, AsyncMessages]}}
examples:
  deps: [{ecosystem: pypi, name: anthropic, version: "2.3.0"}, {ecosystem: pypi, name: openai, version: "3.37.0"}]
  match:
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nreply = client.messages.create(model=\"claude-opus-5-5\", max_tokens=64000, messages=[{\"role\": \"user\", \"content\": \"Hi\"}])\n"
    - "from anthropic import AsyncAnthropic\n\n\nasync def ask(client: AsyncAnthropic) -> None:\n    await client.messages.create(model=\"claude-opus-5-5\", max_tokens=32_000, messages=[])\n"
  no_match:
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nreply = client.messages.create(model=\"claude-opus-5-5\", max_tokens=16000, messages=[])\n"
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nwith client.messages.stream(model=\"claude-opus-5-5\", max_tokens=64000, messages=[]) as stream:\n    reply = stream.get_final_message()\n"
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nevents = client.messages.create(model=\"claude-opus-5-5\", max_tokens=64000, messages=[], stream=True)\n"
