id: python/anthropic/no-budget-tokens
description: "No thinking={\"type\": \"enabled\", \"budget_tokens\": N} in a messages call whose model= literal is one that rejects it with a 400 (Opus 4.7 and later, Sonnet 5 and 5.5, Fable 5 and 5.1, Mythos 5 and 5.1, Haiku 5.5; Bedrock's anthropic. prefix included): use thinking={\"type\": \"adaptive\"} and output_config={\"effort\": ...}."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      pattern: $C.$M($$$)
      all:
        - has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, regex: "^model$"}}, {has: {field: value, kind: string, pattern: $MODEL}}]}}
        - has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, regex: "^thinking$"}}, {has: {field: value, stopBy: end, kind: pair, has: {field: key, regex: "^[\"']budget_tokens[\"']$"}}}]}}
    constraints:
      M: {regex: "^(create|stream|parse|count_tokens)$"}
      MODEL:
        # models.tsv: rejects budget_tokens
        regex: '^["''](anthropic\.)?(claude-fable-5-1|claude-mythos-5-1|claude-fable-5|claude-mythos-5|claude-opus-5-5|claude-opus-5|claude-opus-4-8|claude-opus-4-7|claude-sonnet-5-5|claude-sonnet-5|claude-haiku-5-5)["'']$'
    where:
      C: {type: {package: anthropic, name: [Messages, AsyncMessages]}}
examples:
  deps: [{ecosystem: pypi, name: anthropic, version: "2.3.0"}]
  match:
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nreply = client.messages.create(\n    model=\"claude-opus-5-5\",\n    max_tokens=16000,\n    thinking={\"type\": \"enabled\", \"budget_tokens\": 8000},\n    messages=[{\"role\": \"user\", \"content\": \"Hi\"}],\n)\n"
    - "from anthropic import AsyncAnthropic\n\n\nasync def ask(client: AsyncAnthropic) -> None:\n    async with client.messages.stream(model=\"claude-sonnet-5-5\", max_tokens=64000, thinking={\"type\": \"enabled\", \"budget_tokens\": 32000}, messages=[]) as stream:\n        await stream.get_final_message()\n"
  no_match:
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nreply = client.messages.create(\n    model=\"claude-haiku-4-5\",\n    max_tokens=16000,\n    thinking={\"type\": \"enabled\", \"budget_tokens\": 8000},\n    messages=[],\n)\n"
    - "from anthropic import Anthropic\n\nclient = Anthropic()\nreply = client.messages.create(\n    model=\"claude-opus-5-5\",\n    max_tokens=16000,\n    thinking={\"type\": \"adaptive\"},\n    output_config={\"effort\": \"high\"},\n    messages=[],\n)\n"
    - "class Chat:\n    def create(self, **kwargs: object) -> None:\n        pass\n\n\nChat().create(model=\"claude-opus-5-5\", thinking={\"type\": \"enabled\", \"budget_tokens\": 8000})\n"
