id: python/pydantic/settings-no-secret-default
description: "A BaseSettings secret (password, secret, token, api_key, private_key, …) has no non-empty literal default, also not through Field(\"...\") or SecretStr(\"...\"): a deployment that forgets the variable then runs with a published value such as \"changeme\". Leave the field without a default so a missing value fails at startup; set development values in .env."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: assignment
      all:
        - inside:
            kind: expression_statement
            inside:
              kind: block
              inside:
                kind: class_definition
                has: {field: superclasses, has: {pattern: $B}}
        - any:
            # Field("x"), Field(default="x"), SecretStr("x"), Field(default=SecretStr("x"))
            - all:
                - has: {field: left, regex: "(?i)^([a-z0-9]+_)*(password|passwd|pwd|secret|secret_?key|token|api_?key|private_?key|access_?key|signing_?key|encryption_?key)$"}
                - has:
                    field: right
                    kind: call
                    any:
                      - regex: "^([A-Za-z_][A-Za-z0-9_]*\\.)*(Field|SecretStr)\\([[:space:]]*((default[[:space:]]*=[[:space:]]*)?([A-Za-z_][A-Za-z0-9_]*\\.)*SecretStr\\([[:space:]]*)?[rRuU]?[\"'][^\"']"
                      - all:
                          - regex: "^([A-Za-z_][A-Za-z0-9_]*\\.)*Field\\("
                          - has: {field: arguments, has: {kind: keyword_argument, regex: "^default[[:space:]]*=[[:space:]]*(([A-Za-z_][A-Za-z0-9_]*\\.)*SecretStr\\([[:space:]]*)?[rRuU]?[\"'][^\"']"}}
            # a plain literal for the names ruff's S105 does not cover (password, secret and token are)
            - all:
                - has: {field: left, regex: "(?i)^([a-z0-9]+_)*(api_?key|private_?key|access_?key|signing_?key|encryption_?key)$"}
                - has: {field: right, kind: string, regex: "^[rRuU]?[\"'][^\"']"}
    where:
      B: {type: {package: pydantic_settings, name: BaseSettings}}
examples:
  deps: [{ecosystem: pypi, name: pydantic, version: "2.14.1"}, {ecosystem: pypi, name: pydantic-settings, version: "2.16.1"}]
  match:
    - |
      from pydantic import Field, SecretStr
      from pydantic_settings import BaseSettings


      class Settings(BaseSettings):
          database_url: str = "postgresql://localhost/app"
          jwt_secret: SecretStr = SecretStr("dev-secret")
          admin_password: str = Field(default="changeme", min_length=8)
    - |
      from pydantic_settings import BaseSettings


      class Settings(BaseSettings):
          openai_api_key: str = "sk-test-123"
  no_match:
    - |
      from pydantic import Field, SecretStr
      from pydantic_settings import BaseSettings, SettingsConfigDict


      class Settings(BaseSettings):
          model_config = SettingsConfigDict(env_file=".env")

          database_url: str = "postgresql://localhost/app"
          jwt_secret: SecretStr
          admin_password: SecretStr = Field(min_length=8)
          openai_api_key: str = ""
          api_key_header: str = "X-API-Key"
          token_type: str = "bearer"
    # test fixtures and request models are not settings
    - |
      from pydantic import BaseModel, Field


      class LoginRequest(BaseModel):
          email: str = Field(examples=["a@example.com"])
          api_key: str = "public-demo"
