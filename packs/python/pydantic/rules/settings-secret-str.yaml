id: python/pydantic/settings-secret-str
description: "A BaseSettings field holding a secret (password, secret, secret_key, token, api_key, private_key, client_secret, …) is typed SecretStr, not str: a str value appears in repr(settings), logs and tracebacks. Declare it SecretStr and read it with .get_secret_value() where it is used."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      kind: assignment
      all:
        - has: {field: left, regex: "(?i)^([a-z0-9]+_)*(password|passwd|secret|secret_?key|token|api_?key|private_?key|access_?key|signing_?key|encryption_?key)$"}
        - has: {field: type, regex: "^(str|Optional\\[str\\]|str[[:space:]]*\\|[[:space:]]*None|None[[:space:]]*\\|[[:space:]]*str)$"}
        - inside:
            kind: expression_statement
            inside:
              kind: block
              inside:
                kind: class_definition
                has: {field: superclasses, has: {pattern: $B}}
    where:
      B: {type: {package: pydantic_settings, name: BaseSettings}}
examples:
  deps: [{ecosystem: pypi, name: pydantic, version: "2.14.1"}, {ecosystem: pypi, name: pydantic-settings, version: "2.16.1"}]
  match:
    - |
      from pydantic_settings import BaseSettings, SettingsConfigDict


      class Settings(BaseSettings):
          model_config = SettingsConfigDict(env_file=".env")

          database_url: str
          jwt_secret_key: str
          stripe_api_key: str | None = None
  no_match:
    - |
      from pydantic import SecretStr
      from pydantic_settings import BaseSettings


      class Settings(BaseSettings):
          database_url: str
          jwt_secret_key: SecretStr
          token_expire_minutes: int = 30
          api_key_header: str = "X-API-Key"
    # request and response models carry the plain value
    - |
      from pydantic import BaseModel


      class LoginRequest(BaseModel):
          email: str
          password: str


      class Token(BaseModel):
          access_token: str
          token_type: str = "bearer"
