id: python/django/no-raw-sql-format
description: "SQL passed to .raw(), cursor.execute(), executemany() or RawSQL() is a constant with %s placeholders and params, never built with an f-string, .format(), % or +; and no QuerySet.extra(select=/where=/tables=/order_by=), which Django documents as a last resort (use annotate(), filter() with expressions, or RawSQL with params)."
scope: {language: python, files: ["!**/migrations/**"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any:
        - kind: call
          all:
            - has: {field: function, regex: "(^|\\.)(raw|execute|executemany)$|(^|\\.)RawSQL$"}
            - has:
                field: arguments
                has:
                  nthChild: 1
                  any:
                    - {kind: string, has: {kind: interpolation}}
                    - {kind: call, has: {field: function, kind: attribute, has: {field: object, kind: string}, regex: "\\.format$"}}
                    - {kind: binary_operator, all: [{has: {field: operator, regex: "^%$"}}, {has: {field: left, kind: string}}]}
                    - kind: binary_operator
                      has: {field: operator, regex: "^\\+$"}
                      any: [{has: {field: left, kind: string}}, {has: {field: right, kind: string}}]
        - kind: call
          all:
            - has: {field: function, kind: attribute, regex: "\\.extra$"}
            - has: {field: arguments, has: {kind: keyword_argument, has: {field: name, regex: "^(select|where|tables|order_by)$"}}}
examples:
  match:
    - "def find(uid: int):\n    return User.objects.raw(f\"SELECT * FROM auth_user WHERE id = {uid}\")\n"
    - "def bump(cursor, col: str) -> None:\n    cursor.execute(\"UPDATE stats SET n = n + 1 WHERE name = '%s'\" % col)\n"
    - "def tagged(qs, tag: str):\n    return qs.extra(where=[\"tag = '\" + tag + \"'\"])\n"
    - "def ordered(qs):\n    return qs.extra(select={\"is_recent\": \"pub_date > '2006-01-01'\"})\n"
    - "def col(name: str):\n    return RawSQL(\"SELECT {} FROM t\".format(name), [])\n"
  no_match:
    - "def find(uid: int):\n    return User.objects.raw(\"SELECT * FROM auth_user WHERE id = %s\", [uid])\n"
    - "def bump(cursor, col: str) -> None:\n    cursor.execute(\"UPDATE stats SET n = n + 1 WHERE name = %s\", [col])\n"
    - "def run(cursor, sql: str, params: list[object]) -> None:\n    cursor.execute(sql, params)\n"
    - "logger.info(\"saved\", extra={\"id\": 1})\n"
    - "def recent(qs):\n    return qs.annotate(is_recent=RawSQL(\"pub_date > %s\", [CUTOFF]))\n"
