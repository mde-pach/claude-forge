id: python/sqlalchemy/alembic/concurrent-index-autocommit
description: "A concurrent index operation (op.create_index / op.drop_index with postgresql_concurrently=True, or CREATE / DROP INDEX CONCURRENTLY in op.execute) runs inside with op.get_context().autocommit_block(): Alembic runs each revision in a transaction, and PostgreSQL refuses CONCURRENTLY inside one, so the migration fails."
scope: {language: python, files: ["@alembic-migrations"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call
      all:
        - any:
            - all:
                - has: {field: function, regex: "^([A-Za-z_][A-Za-z0-9_]*\\.)*(op|batch_op)\\.(create_index|drop_index)$"}
                - has: {field: arguments, has: {kind: keyword_argument, regex: "^postgresql_concurrently[[:space:]]*=[[:space:]]*True$"}}
            - all:
                - has: {field: function, regex: "^([A-Za-z_][A-Za-z0-9_]*\\.)*op\\.execute$"}
                - has: {field: arguments, has: {stopBy: end, kind: string, regex: "(?i)\\b(create[[:space:]]+(unique[[:space:]]+)?index|drop[[:space:]]+index|reindex[[:space:]]+(index|table))[[:space:]]+concurrently\\b"}}
        - not: {inside: {kind: with_statement, stopBy: end, has: {kind: with_clause, regex: "autocommit_block\\("}}}
examples:
  match:
    - |
      import sqlalchemy as sa
      from alembic import op

      revision = "0007"
      down_revision = "0006"


      def upgrade() -> None:
          op.create_index("ix_orders_customer_id", "orders", ["customer_id"], postgresql_concurrently=True)


      def downgrade() -> None:
          op.drop_index("ix_orders_customer_id", table_name="orders", postgresql_concurrently=True)
    - |
      from alembic import op

      revision = "0008"
      down_revision = "0007"


      def upgrade() -> None:
          op.execute(
              """
              CREATE INDEX CONCURRENTLY IF NOT EXISTS ix_events_created_at
              ON events (created_at)
              """
          )
  no_match:
    - |
      from alembic import op

      revision = "0007"
      down_revision = "0006"


      def upgrade() -> None:
          with op.get_context().autocommit_block():
              op.create_index("ix_orders_customer_id", "orders", ["customer_id"], postgresql_concurrently=True)


      def downgrade() -> None:
          with op.get_context().autocommit_block():
              op.execute("DROP INDEX CONCURRENTLY IF EXISTS ix_orders_customer_id")
    - |
      from alembic import op

      revision = "0009"
      down_revision = "0008"


      def upgrade() -> None:
          op.create_index("ix_orders_status", "orders", ["status"])
          op.execute("CREATE INDEX ix_orders_paid ON orders (paid)")
