id: python/sqlalchemy/alembic/fk-index
description: "A revision that adds a foreign key also indexes its column (op.create_index, index=True, a primary key or unique constraint): PostgreSQL does not index referencing columns, so joins and deletes of the referenced rows scan the table."
scope: {language: python, files: ["alembic/versions/**"]}
enforce:
  - {target: check, stage: lint, run: "forge_alembic_fk_index"}
examples:
  match:
    - files: {alembic/versions/0002_posts.py: "revision = \"0002\"\ndown_revision = \"0001\"\n\n\ndef upgrade() -> None:\n    op.create_table(\n        \"posts\",\n        sa.Column(\"id\", sa.Integer(), nullable=False),\n        sa.Column(\"author_id\", sa.Integer(), nullable=False),\n        sa.ForeignKeyConstraint([\"author_id\"], [\"users.id\"]),\n        sa.PrimaryKeyConstraint(\"id\"),\n    )\n"}
    - files: {alembic/versions/0003_team.py: "revision = \"0003\"\ndown_revision = \"0002\"\n\n\ndef upgrade() -> None:\n    op.add_column(\"users\", sa.Column(\"team_id\", sa.Integer(), nullable=True))\n    op.create_foreign_key(\n        None, \"users\", \"teams\", [\"team_id\"], [\"id\"], ondelete=\"SET NULL\"\n    )\n\n\ndef downgrade() -> None:\n    op.create_index(\"ix_users_team_id\", \"users\", [\"team_id\"])\n"}
    - files: {alembic/versions/0004_org.py: "revision = \"0004\"\ndown_revision = \"0003\"\n\n\ndef upgrade() -> None:\n    op.add_column(\"users\", sa.Column(\"org_id\", sa.Integer(), sa.ForeignKey(\"orgs.id\"), nullable=True))\n"}
  no_match:
    - files: {alembic/versions/0002_posts.py: "revision = \"0002\"\ndown_revision = \"0001\"\n\n\ndef upgrade() -> None:\n    op.create_table(\n        \"posts\",\n        sa.Column(\"id\", sa.Integer(), nullable=False),\n        sa.Column(\"author_id\", sa.Integer(), nullable=False),\n        sa.ForeignKeyConstraint([\"author_id\"], [\"users.id\"]),\n        sa.PrimaryKeyConstraint(\"id\"),\n    )\n    op.create_index(op.f(\"ix_posts_author_id\"), \"posts\", [\"author_id\"], unique=False)\n"}
    - files: {alembic/versions/0003_team.py: "revision = \"0003\"\ndown_revision = \"0002\"\n\n\ndef upgrade() -> None:\n    op.add_column(\"users\", sa.Column(\"team_id\", sa.Integer(), sa.ForeignKey(\"teams.id\"), index=True))\n    op.create_table(\n        \"memberships\",\n        sa.Column(\"user_id\", sa.Integer(), sa.ForeignKey(\"users.id\"), primary_key=True),\n        sa.Column(\"group_id\", sa.Integer(), sa.ForeignKey(\"groups.id\"), primary_key=True),\n    )\n    op.add_column(\"users\", sa.Column(\"org_id\", sa.Integer()))\n    op.create_foreign_key(None, \"users\", \"orgs\", [\"org_id\"], [\"id\"])\n    op.execute(\"CREATE INDEX CONCURRENTLY ix_users_org_id ON users (org_id)\")\n"}
