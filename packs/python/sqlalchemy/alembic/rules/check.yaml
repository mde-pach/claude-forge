id: python/sqlalchemy/alembic/check
description: Model changes come with a migration (alembic check passes).
scope: {language: python}
enforce:
  - target: check
    stage: migration
    run: "forge_do alembic migrations-check"
    when_changed: ["**/models/**", "**/models.py", "@alembic-migrations"]
    requires_local_db: true
