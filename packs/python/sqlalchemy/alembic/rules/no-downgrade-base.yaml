id: python/sqlalchemy/alembic/no-downgrade-base
description: alembic downgrade base drops the whole schema.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command: {name: alembic, sub: [downgrade, base]}
examples:
  match: ["uv run alembic downgrade base", "alembic -c alembic.ini downgrade base"]
  no_match: ["alembic downgrade -1", "alembic upgrade head"]
