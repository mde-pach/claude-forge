id: python/sqlalchemy/no-query-api
description: No legacy session.query(). Use select() with session.execute() or session.scalars().
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule: {pattern: "$S.query($$$)"}
    # Only session-like receivers: other libraries also have .query().
    constraints: {S: {regex: "(^|\\.|_)([Ss]ession|db|sess|s)$"}}
examples:
  match: ["users = session.query(User).all()", "db.query(User).filter(User.id == 1)"]
  no_match: ["results = index.query(\"text\")", "users = (await session.scalars(select(User))).all()", "query = select(User)"]
