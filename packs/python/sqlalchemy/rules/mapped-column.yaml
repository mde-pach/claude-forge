id: python/sqlalchemy/mapped-column
description: Model attributes use Mapped[T] = mapped_column(), not Column().
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      pattern: "$N = Column($$$)"
      inside:
        kind: expression_statement
        inside: {kind: block, inside: {kind: class_definition}}
examples:
  match: ["class User(Base):\n    id = Column(Integer, primary_key=True)\n"]
  no_match: ["class User(Base):\n    id: Mapped[int] = mapped_column(primary_key=True)\n", "users = Table(\"users\", metadata, Column(\"id\", Integer))\n"]
