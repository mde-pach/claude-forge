id: python/library/no-python-cap
description: "requires-python has a lower bound only (>=3.12): an upper bound (<4, ~=, ==) makes resolvers pick old releases or fail for users on a newer Python."
scope: {language: any, files: ["**/pyproject.toml"]}
enforce:
  - target: grep
    mode: forbid
    pattern: "^[[:space:]]*requires-python[[:space:]]*=.*(<|~=|==)"
examples:
  match:
    - "[project]\nrequires-python = \">=3.10,<4\"\n"
    - "[project]\nrequires-python = \"~=3.12\"\n"
    - "[project]\nrequires-python = \"==3.12.*\"\n"
  no_match:
    - "[project]\nrequires-python = \">=3.10\"\n"
    - "[project]\nrequires-python = \">=3.10,!=3.11.0\"\n"
