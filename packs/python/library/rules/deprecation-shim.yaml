id: python/library/deprecation-shim
description: "A name that a module's __all__ listed in the base and no longer lists (removed or renamed), or a deleted module that had __all__, keeps working with a deprecation: a def, class or alias of that name that uses DeprecationWarning, FutureWarning or @deprecated, or a module __getattr__ that names it and warns. A major version bump of [project] version allows the removal; an accepted removal goes in forge.yaml (accept)."
scope: {language: python, files: ["!**/tests/**", "!**/test_*.py", "!**/conftest.py"]}
enforce:
  - target: check
    stage: lint
    run: "forge_helper python public_api.py"
    when_changed: ["**/*.py", "pyproject.toml"]
examples:
  match:
    - head: {src/acme/client.py: "__all__ = [\"connect\", \"Client\"]\n\n\nclass Client:\n    pass\n\n\ndef connect() -> Client:\n    return Client()\n"}
      files: {src/acme/client.py: "__all__ = [\"open_client\", \"Client\"]\n\n\nclass Client:\n    pass\n\n\ndef open_client() -> Client:\n    return Client()\n"}
  no_match:
    - head: {src/acme/client.py: "__all__ = [\"connect\", \"Client\"]\n\n\nclass Client:\n    pass\n\n\ndef connect() -> Client:\n    return Client()\n"}
      files: {src/acme/client.py: "import warnings\n\n__all__ = [\"open_client\", \"Client\"]\n\n\nclass Client:\n    pass\n\n\ndef open_client() -> Client:\n    return Client()\n\n\ndef __getattr__(name: str) -> object:\n    if name == \"connect\":\n        warnings.warn(\"connect() is deprecated, use open_client()\", DeprecationWarning, stacklevel=2)\n        return open_client\n    raise AttributeError(name)\n"}
    - head: {src/acme/client.py: "__all__ = [\"connect\"]\n\n\ndef connect() -> None:\n    pass\n"}
      files: {src/acme/client.py: "from typing_extensions import deprecated\n\n__all__ = [\"open_client\"]\n\n\ndef open_client() -> None:\n    pass\n\n\n@deprecated(\"Use open_client()\")\ndef connect() -> None:\n    open_client()\n"}
    - head: {pyproject.toml: "[project]\nname = \"acme\"\nversion = \"1.4.0\"\n", src/acme/client.py: "__all__ = [\"connect\"]\n\n\ndef connect() -> None:\n    pass\n"}
      files: {pyproject.toml: "[project]\nname = \"acme\"\nversion = \"2.0.0\"\n", src/acme/client.py: "__all__ = [\"open_client\"]\n\n\ndef open_client() -> None:\n    pass\n"}
