id: python/flask/no-template-string-injection
description: render_template_string() gets a constant template; values go in as context keyword arguments, never into the template through an f-string, +, % or .format() (server-side template injection runs code through Jinja).
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call
      pattern: "$F($$$)"
      has:
        field: arguments
        has:
          nthChild: 1
          any:
            - {kind: string, has: {kind: interpolation}}
            - {kind: binary_operator}
            - {kind: call, has: {field: function, regex: "\\.format$"}}
    # The function called is Flask's (§15.6), whatever the import calls it.
    where:
      F: {declared: {package: flask, name: render_template_string}}
examples:
  deps: [{ecosystem: pypi, name: flask, version: "3.1.3"}]
  match:
    - "from flask import render_template_string, request\n\n\ndef hello() -> str:\n    return render_template_string(f\"<p>Hello {request.args['name']}</p>\")\n"
    - "import flask\n\n\ndef page(title: str) -> str:\n    return flask.render_template_string(\"<h1>\" + title + \"</h1>\")\n"
    - "from flask import render_template_string as render\n\n\ndef page(title: str) -> str:\n    return render(\"<h1>%s</h1>\" % title)\n"
    - "from flask import render_template_string\n\n\ndef page(title: str) -> str:\n    return render_template_string(\"<h1>{}</h1>\".format(title))\n"
  no_match:
    - "from flask import render_template_string\n\n\ndef page(title: str) -> str:\n    return render_template_string(\"<h1>{{ title }}</h1>\", title=title)\n"
    - "from flask import render_template\n\n\ndef page(title: str) -> str:\n    return render_template(\"page.html\", title=title)\n"
    - "def render_template_string(source: str) -> str:\n    return source\n\n\ndef page(title: str) -> str:\n    return render_template_string(f\"<h1>{title}</h1>\")\n"
