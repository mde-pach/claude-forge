id: python/numpy/legacy-random
description: "Random numbers come from a Generator (rng = np.random.default_rng(seed); rng.random()), not the legacy global RandomState functions (np.random.seed, np.random.rand, ...; ruff NPY002): global state is shared by every library and thread, so results are not reproducible."
scope: {language: python}
enforce:
  - target: tool
    tool: ruff
    expects: NPY002
    snippet: '[tool.ruff.lint] extend-select = ["NPY002"]'
examples:
  match: ["import numpy as np\n\nnp.random.seed(42)\nsample = np.random.rand(3)\n"]
  no_match: ["import numpy as np\n\nrng = np.random.default_rng(42)\nsample = rng.random(3)\n"]
