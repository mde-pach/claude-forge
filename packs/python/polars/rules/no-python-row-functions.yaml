id: python/polars/no-python-row-functions
description: "No Python per row in Polars (Expr.map_elements, Series.map_elements, DataFrame.map_rows, DataFrame.iter_rows): it runs one Python call per value, without parallelism or the query optimizer. Write Polars expressions (pl.col(\"a\") + 1, pl.when()); map_batches is not concerned."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      any:
        - pattern: $E.map_elements($$$)
        - pattern: $E.map_rows($$$)
        - pattern: $E.iter_rows($$$)
    where:
      E: {type: {package: polars, name: [Expr, Series, DataFrame]}}
examples:
  deps: [{ecosystem: pypi, name: polars, version: "2.1.0"}]
  match:
    - "import polars as pl\n\ndf = pl.DataFrame({\"a\": [1, 2]})\nout = df.with_columns(pl.col(\"a\").map_elements(lambda x: x + 1))\n"
    - "import polars as pl\n\ndf = pl.DataFrame({\"a\": [1, 2]})\nout = df.map_rows(lambda r: (r[0] + 1,))\n"
    - "import polars as pl\n\ndf = pl.DataFrame({\"a\": [1, 2]})\nfor row in df.iter_rows():\n    print(row)\n"
  no_match:
    - "import polars as pl\n\ndf = pl.DataFrame({\"a\": [1, 2]})\nout = df.with_columns(pl.col(\"a\") + 1)\n"
    - "import polars as pl\n\ndf = pl.DataFrame({\"a\": [1, 2]})\nout = df.with_columns(pl.col(\"a\").map_batches(lambda s: s + 1))\n"
    - "class Table:\n    def iter_rows(self) -> list[int]:\n        return []\n\n\nfor r in Table().iter_rows():\n    pass\n"
