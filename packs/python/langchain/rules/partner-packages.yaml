id: python/langchain/partner-packages
description: "No langchain_community class that LangChain deprecated in favour of a partner package (ChatOpenAI, OpenAIEmbeddings, HuggingFaceEmbeddings, Chroma, Ollama, ...): import it from that package (langchain_openai, langchain_huggingface, langchain_chroma, langchain_ollama, ...). The list is langchain-community 0.4.2's @deprecated(alternative_import=...) classes, at their defining module and their package re-export."
scope: {language: python}
