id: python/celery/no-result-get-in-task
description: "A task does not wait for another task's result (.get(), .wait() or .join() on the AsyncResult of .delay(), .apply_async(), AsyncResult() or a called group/chord/chain): it holds a worker while waiting and can deadlock the pool; Celery refuses it unless disable_sync_subtasks=False, which is rejected too. Chain the tasks or use a chord callback."
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any:
        - kind: keyword_argument
          regex: "^disable_sync_subtasks[[:space:]]*=[[:space:]]*False$"
        - kind: call
          all:
            - has: {field: function, kind: attribute, regex: "\\.(get|wait|join)$"}
            - inside: {kind: function_definition, stopBy: end, inside: {kind: decorated_definition, stopBy: neighbor, has: {kind: decorator, regex: "^@([A-Za-z_][A-Za-z0-9_]*\\.)*(shared_task|task)\\b"}}}
            - has:
                field: function
                has:
                  field: object
                  any:
                    - {kind: call, has: {field: function, regex: "\\.(delay|apply_async)$|^(AsyncResult|([A-Za-z_][A-Za-z0-9_]*\\.)*AsyncResult|GroupResult\\.restore)$"}}
                    - {kind: call, has: {field: function, kind: call, has: {field: function, regex: "^(group|chord|chain|([A-Za-z_][A-Za-z0-9_]*\\.)*(group|chord|chain))$"}}}
                    - all:
                        - {kind: identifier, pattern: $R}
                        - inside:
                            kind: function_definition
                            stopBy: end
                            has:
                              stopBy: end
                              kind: assignment
                              all:
                                - has: {field: left, pattern: $R}
                                - has: {field: right, kind: call, has: {field: function, regex: "\\.(delay|apply_async)$|(^|\\.)AsyncResult$"}}
examples:
  match:
    - "@shared_task\ndef report(ids: list[int]) -> int:\n    result = count_rows.delay(ids)\n    return result.get(timeout=10)\n"
    - "@app.task\ndef report(ids: list[int]) -> list[int]:\n    return group(count_rows.s(i) for i in ids)().get()\n"
    - "def wait_for(task_id: str) -> object:\n    return AsyncResult(task_id).get(disable_sync_subtasks=False)\n"
  no_match:
    - "@shared_task\ndef report(ids: list[int]) -> None:\n    chord(count_rows.s(i) for i in ids)(summarize.s())\n"
    - "@shared_task\ndef report(options: dict[str, int]) -> int:\n    return options.get(\"limit\", 10)\n"
    - "def view(request, ids):\n    return count_rows.delay(ids).get(timeout=5)\n"
