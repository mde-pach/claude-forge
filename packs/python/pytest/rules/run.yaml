id: python/pytest/run
description: Tests pass.
scope: {language: python}
enforce:
  - target: check
    stage: test
    run: "forge_do pytest test"
    changed_run: 'if grep -qi "pytest-testmon" pyproject.toml uv.lock 2>/dev/null; then forge_do pytest test-changed; else set -- $(forge_related_py_tests {files}); [ "$#" -eq 0 ] || forge_do pytest test-files "$@"; fi'
    rerun: "forge_do pytest test-files {files}"
    timeout: 300
