id: python/pytest/no-tautological-assert
description: Assertions test something. No assert True, assert on a literal, or x == x.
scope: {language: python, files: ["@python-tests", "!**/conftest.py"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any:
        - {kind: assert_statement, has: {nthChild: 1, any: [{kind: "true"}, {kind: integer}, {kind: float}, {kind: string}]}}
        - {kind: assert_statement, has: {nthChild: 1, pattern: "$X == $X"}}
        - {kind: assert_statement, has: {nthChild: 1, pattern: "$X is $X"}}
examples:
  match: ["def test_a():\n    assert True\n", "def test_b():\n    assert 1\n", "def test_c():\n    total = f()\n    assert total == total\n"]
  no_match: ["def test_a():\n    assert f() == 2\n", "def test_b():\n    assert not False_positive()\n", "def test_c():\n    assert total == expected\n"]
