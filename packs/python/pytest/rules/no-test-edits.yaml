id: python/pytest/no-test-edits
description: Changing a test that existed at the start of the turn (anything in it, formatting aside, input data and control flow included), or removing it, needs approval; adding tests is fine. Edits ask when made, unapproved changes are blocked at Stop. Changed test support code (fakes, mocks, fixtures, helpers, conftest.py) is reported once.
review: "Is this change to existing tests required by the user's request (the request changes the behaviour these tests assert, so they must assert the new behaviour), or does it weaken or remove tests to make the code pass? Allow only the first."
scope: {language: python, files: ["**/test_*.py", "**/*_test.py", "**/conftest.py"]}
enforce:
  - {target: check, stage: lint, run: "forge_test_edits"}
examples:
  match:
    - head: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 100\n"}
      files: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 90\n"}
    - head: {tests/test_cart.py: "import pytest\n\n\n@pytest.mark.parametrize(\"items, want\", [([1], 1)])\ndef test_total(items, want):\n    assert total(items) == want\n"}
      files: {tests/test_cart.py: "import pytest\n\n\n@pytest.mark.parametrize(\"items, want\", [([1], 2)])\ndef test_total(items, want):\n    assert total(items) == want\n"}
    - head: {tests/test_cart.py: "class TestCart:\n    def test_empty(self):\n        assert total([]) == 0\n"}
      files: {tests/test_cart.py: "class TestCart:\n    pass\n"}
    - head: {tests/test_push.py: "class MockLogfire:\n    def __init__(self):\n        self._variables = {}\n\n\ndef test_push():\n    assert push(MockLogfire()) == 0\n"}
      files: {tests/test_push.py: "class MockLogfire:\n    def __init__(self):\n        self._config = {}\n\n\ndef test_push():\n    assert push(MockLogfire()) == 0\n"}
    - head: {tests/conftest.py: "import pytest\n\n\n@pytest.fixture\ndef user():\n    return {\"name\": \"ada\"}\n"}
      files: {tests/conftest.py: "import pytest\n"}
    - head: {tests/test_cart.py: "def test_total():\n    items = [40, 60]\n    assert total(items) == 100\n"}
      files: {tests/test_cart.py: "def test_total():\n    items = [50, 50]\n    assert total(items) == 100\n"}
    - head: {tests/test_cart.py: "def test_total():\n    items = [40, 60]\n    assert total(items) == 100\n"}
      files: {tests/test_cart.py: "def test_total():\n    items = [40, 60]\n    return\n    assert total(items) == 100\n"}
    - head: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 100\n"}
      files: {tests/test_cart.py: "def test_total():\n    if False:\n        assert total([40, 60]) == 100\n"}
  no_match:
    - head: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 100\n"}
      files: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 100\n\n\ndef test_empty():\n    assert total([]) == 0\n"}
    - head: {tests/test_cart.py: "def test_total():\n    assert total([40,60])==100\n"}
      files: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 100\n", app/cart.py: "def total(xs):\n    return sum(xs)\n"}
    - head: {tests/test_cart.py: "def test_total():\n    assert total([40, 60]) == 100\n"}
      files: {tests/test_cart.py: "def test_total():\n    assert total(\n        [40, 60],\n    ) == 100\n\n\ndef test_total_one():\n    assert total(['x']) == 0\n"}
