id: safety/ephemeral-exec
description: Claude asks before running a package fetched from a registry on the fly (pnpm dlx, pipx run, a launcher given --package or name@version, or npx / bunx / uvx on a command not installed in the project); a typo or a hijacked name runs someone else's code. Tools installed in the project (npx tsc, bunx prisma) run as usual.
scope: {language: any}
review: "This command would fetch a package from a registry and run it (the rule's finding names it): is that exact package a well-known, legitimate one that this work plausibly needs, spelled right? Deny a name you cannot place, a likely typo or a lookalike of a known package."
enforce:
  - target: guard
    decision: ask
    # a pre-filter: the check parses the command (launcher options, compound commands, cd, heredocs) and looks for the tool in node_modules/.bin or .venv/bin
    pattern: '(npx|pnpx|bunx|bun[[:space:]]+x|dlx|npm[[:space:]]+(exec|x)|uvx|uv[[:space:]]+tool|pipx)'
    check: ephemeral-exec
examples:
  match:
    - "npx -y create-next-app@latest shop"
    - "bunx shadcn@latest add button"
    - {command: "bun x prisma@7 generate", files: {node_modules/.bin/prisma: ""}}
    - "bunx @biomejs/biome@2.5.15 ci ."
    - {command: "npx --package=@biomejs/biome biome ci", files: {node_modules/.bin/biome: ""}}
    - {command: "npm exec biome ci --package=@biomejs/biome", files: {node_modules/.bin/biome: ""}}
    - "npx some-unknown-tool"
    - "npx tsc --noEmit -p tsconfig.json"
    - "uvx ruff check"
    - {command: "uvx --from ruff==0.9 ruff check", files: {.venv/bin/ruff: ""}}
    - "uv tool run httpie"
    - {command: "pnpm dlx tsx script.ts", files: {node_modules/.bin/tsx: ""}}
    - "pipx run cowsay hi"
    - "npm exec -- prettier --check ."
    - {command: "git stash && npx tsc --noEmit; git stash pop", files: {packages/app/node_modules/.bin/tsc: ""}}
    - "sh -c 'npx cowsay hi'"
    - "echo ok\nnpx some-unknown-tool"
  no_match:
    - {command: "bunx prisma generate", files: {node_modules/.bin/prisma: ""}}
    - {command: "bunx vitest run", files: {node_modules/.bin/vitest: ""}}
    - {command: "bun x biome ci .", files: {node_modules/.bin/biome: ""}}
    - {command: "npx tsc --noEmit -p tsconfig.json", files: {node_modules/.bin/tsc: ""}}
    - {command: "npx -y tsc --noEmit", files: {node_modules/.bin/tsc: ""}}
    - {command: "cd packages/app && npx vitest run src/a.test.ts", files: {node_modules/.bin/vitest: "", packages/app/src/a.test.ts: ""}}
    - {command: "cd packages/app && npx tsc --noEmit -p . 2>&1 | head", files: {packages/app/node_modules/.bin/tsc: ""}}
    - {command: "npx @biomejs/biome check src", files: {node_modules/@biomejs/biome/package.json: "{}"}}
    - {command: "uvx ruff check", files: {.venv/bin/ruff: ""}}
    - {command: "python3 - <<'EOF'\nimport subprocess\nsubprocess.run(['npx', 'cowsay'])\nnpx cowsay hi\nEOF\nnpx tsc --noEmit", files: {node_modules/.bin/tsc: ""}}
    - "bun run test"
    - "uv run pytest"
    - "bun add -d zod"
    - "git commit -m \"use bunx\""
    - "git commit -m \"try npx cowsay | pnpm dlx x\""
    - "grep -rn 'npx foo' docs/"
