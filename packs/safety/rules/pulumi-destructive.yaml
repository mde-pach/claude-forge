id: safety/pulumi-destructive
description: Unpreviewed or destructive Pulumi commands need confirmation - pulumi up / refresh with --yes, -y or --skip-preview, pulumi destroy, stack rm, state delete / unprotect, cancel.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    pattern: '(^|[^A-Za-z0-9_-])pulumi[[:space:]]+(destroy|stack[[:space:]]+rm|state[[:space:]]+(delete|unprotect)|cancel|(up|refresh)[^;&|]*[[:space:]](--yes|-y|--skip-preview))([[:space:];&|)=]|$)'
examples:
  match: ["pulumi up --yes", "pulumi up -s prod -y", "pulumi up --skip-preview", "pulumi refresh --yes", "pulumi destroy", "pulumi stack rm dev", "pulumi state delete 'urn:pulumi:dev::app::aws:s3/bucket:Bucket::b'", "pulumi state unprotect urn", "pulumi cancel"]
  no_match: ["pulumi preview", "pulumi up", "pulumi refresh", "pulumi stack ls", "pulumi state export", "pulumi up --diff"]
