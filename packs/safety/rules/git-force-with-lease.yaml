id: safety/git-force-with-lease
description: git push --force-with-lease still rewrites remote history; confirm it.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command: {name: git, sub: [push], flags_any: [--force-with-lease]}
examples:
  match: ["git push --force-with-lease", "git push origin feat --force-with-lease=feat"]
  no_match: ["git push", "git push origin feat"]
