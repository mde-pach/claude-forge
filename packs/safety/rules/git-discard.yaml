id: safety/git-discard
description: Discarding working-tree changes (git checkout -- / git checkout . / git restore) loses work.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command:
      - {name: git, sub: [checkout], args_any: ['.']}
      - {name: git, sub: [checkout], arg_regex: '^--$'}
      - {name: git, sub: [restore], flags_none: [--staged, -S]}
      - {name: git, sub: [restore], flags_any: [--worktree, -W]}
examples:
  match: ["git checkout -- .", "git checkout .", "git checkout HEAD -- src/app.py", "git restore src/app.py", "git restore .", "cd x && git restore --worktree a.py"]
  no_match: ["git checkout -b feat", "git checkout main", "git restore --staged src/app.py", "git restore -S a.py", "git checkout-index -a"]
