id: safety/git-reset-hard
description: git reset --hard discards uncommitted work.
scope: {language: any}
enforce:
  - {target: permission, decision: deny, rule: "Bash(git reset --hard:*)"}
examples:
  match: ["Bash(git reset --hard)", "Bash(git reset --hard HEAD~1)"]
  no_match: ["Bash(git reset --soft HEAD~1)", "Bash(git reset HEAD file.txt)"]
