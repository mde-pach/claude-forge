id: safety/rm-root
description: No recursive rm on /, ~, $HOME or the parent directory.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    pattern: '(^|[^A-Za-z0-9_-])rm([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(-[A-Za-z]*[rR][A-Za-z]*|--recursive)([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(\\"|'')?(/|~/?|\$HOME/?|\$\{HOME\}/?|\.\./?)\*?(\\"|'')?([[:space:];&|)]|$)'
examples:
  match: ["rm -rf /", "rm -rf ~", "sudo rm -rf /", "rm -fr ~/", "rm -rf $HOME", "rm -r ..", "rm -rf /*", "rm --recursive --force /", "rm -rf \"$HOME\""]
  no_match: ["rm -rf node_modules", "rm -rf /tmp/build", "rm -rf ~/projects/old", "rm file.txt", "rm -rf ./dist", "rm -rf ../sibling/dist"]
