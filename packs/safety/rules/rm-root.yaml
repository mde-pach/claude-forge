id: safety/rm-root
description: "No recursive rm on /, ~, $HOME or the parent directory, nor on a bare variable followed by / or /* ($DIR/, ${OUT}/*), which is / when the variable is empty; ${VAR:?}/ fails instead and is fine."
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command:
      - {name: rm, flags_any: [-r, -R, --recursive], args_any: ['/^(/|~|\$HOME|\$\{HOME\}|\.\.)/?\*?$/']}
      - {name: rm, flags_any: [-r, -R, --recursive], args_any: ['/^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?/\*?$/']}
examples:
  match: ["rm -rf /", "rm -rf ~", "sudo rm -rf /", "rm -fr ~/", "rm -rf $HOME", "rm -r ..", "rm -rf /*", "rm --recursive --force /", "rm -rf \"$HOME\"", "rm -rf $DIR/", "rm -rf \"$BUILD_DIR/\"*", "rm -rf ${OUT}/*", "rm -r $HOME_DIR/"]
  no_match: ["rm -rf node_modules", "rm -rf /tmp/build", "rm -rf ~/projects/old", "rm file.txt", "rm -rf ./dist", "rm -rf ../sibling/dist", "rm -rf \"$DIR/build\"", "rm -rf ${OUT:?}/", "rm -rf \"$tmp\"", "rm -f $X/", "rm -rf $DIR/dist/*", "rm -rf ./$X/"]
