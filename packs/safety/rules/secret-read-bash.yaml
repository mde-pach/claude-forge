id: safety/secret-read-bash
description: Secret files are not read or copied through Bash.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command:
      - {name: [cat, less, more, head, tail, cp, source, '.', grep, base64], arg_regex: '(^|[/=])\.env(\.(local|development|production|test|staging|dev|prod))?$'}
      - {name: [cat, less, more, head, tail, cp, source, '.', grep, base64], arg_regex: '^(~|\$HOME|\$\{HOME\})/(\.ssh/|\.pgpass|\.netrc)'}
examples:
  match: ["cat .env", "cp ~/.ssh/id_ed25519 /tmp", "grep KEY apps/api/.env.local", "source .env", "head -n 3 \"$HOME/.pgpass\"", "base64 ~/.netrc", "tail .env.production"]
  no_match: ["cat .env.example", "cat README.md", "cp .env.example .env.sample", "git log --stat", "grep -r environment src"]
