id: safety/prisma-ai-consent
description: Claude never sets PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION, the variable through which only the user consents to a destructive Prisma command.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    pattern: 'PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION'
examples:
  match: ["PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION=yes bunx prisma migrate reset --force", "export PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION=1"]
  no_match: ["bunx prisma migrate dev --create-only", "bunx prisma generate"]
