id: safety/secret-files
description: Secret files are never read or edited by Claude.
scope: {language: any}
enforce:
  - {target: permission, decision: deny, rule: "Read(**/.env)"}
  - {target: permission, decision: deny, rule: "Read(**/.env.local)"}
  - {target: permission, decision: deny, rule: "Read(**/.env.development)"}
  - {target: permission, decision: deny, rule: "Read(**/.env.production)"}
  - {target: permission, decision: deny, rule: "Read(**/.env.test)"}
  - {target: permission, decision: deny, rule: "Edit(**/.env)"}
  - {target: permission, decision: deny, rule: "Edit(**/.env.local)"}
  - {target: permission, decision: deny, rule: "Edit(**/.env.development)"}
  - {target: permission, decision: deny, rule: "Edit(**/.env.production)"}
  - {target: permission, decision: deny, rule: "Edit(**/.env.test)"}
  - {target: permission, decision: deny, rule: "Read(**/*.pem)"}
  - {target: permission, decision: deny, rule: "Read(**/*.key)"}
  - {target: permission, decision: deny, rule: "Read(~/.ssh/**)"}
  - {target: permission, decision: deny, rule: "Read(~/.netrc)"}
  - {target: permission, decision: deny, rule: "Read(~/.npmrc)"}
  - {target: permission, decision: deny, rule: "Read(~/.pypirc)"}
  - {target: permission, decision: deny, rule: "Read(~/.pgpass)"}
  - {target: permission, decision: deny, rule: "Read(~/.git-credentials)"}
  - {target: permission, decision: deny, rule: "Read(~/.config/gh/hosts.yml)"}
  - {target: permission, decision: deny, rule: "Read(~/.docker/config.json)"}
examples:
  match: ["Read(.env)", "Read(apps/api/.env.production)", "Edit(.env.local)", "Read(certs/server.pem)", "Read(~/.ssh/id_ed25519)", "Read(~/.config/gh/hosts.yml)", "Read(~/.docker/config.json)"]
  no_match: ["Read(.env.example)", "Edit(src/env.ts)", "Read(README.md)", "Read(~/.sshconfig)"]
