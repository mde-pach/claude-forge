id: safety/datastore-reset
description: Claude asks before wiping a local datastore (redis-cli FLUSHALL or FLUSHDB, supabase db reset, manage.py flush); the database it reaches may not be a disposable one.
review: "Does this command reach a local, disposable database (not a shared or production one), and does the user's request call for wiping it?"
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    pattern: '(^|[^A-Za-z0-9_-])redis-cli[[:space:]].*([Ff][Ll][Uu][Ss][Hh]([Aa][Ll][Ll]|[Dd][Bb]))'
  - target: guard
    decision: ask
    pattern: '(^|[^A-Za-z0-9_-])(supabase[[:space:]]+db[[:space:]]+reset|manage\.py[[:space:]]+flush)([[:space:];&|)]|$)'
examples:
  match: ["redis-cli FLUSHALL", "redis-cli -n 2 flushdb", "supabase db reset", "python manage.py flush --no-input", "uv run manage.py flush"]
  no_match: ["redis-cli get session:1", "supabase db push", "python manage.py migrate", "supabase db reset-password"]
