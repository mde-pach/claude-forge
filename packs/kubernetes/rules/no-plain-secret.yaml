id: kubernetes/no-plain-secret
description: "No committed v1 Secret with data or stringData (base64 is not encryption) unless the document is SOPS-encrypted (a top-level sops key); use SealedSecret, ExternalSecret or SOPS."
scope: {language: yaml, files: ["**/*.yaml", "**/*.yml", "!**/templates/**"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: block_mapping_pair
      has: {field: key, regex: "^[\"']?(data|stringData)[\"']?$"}
      inside:
        kind: block_mapping
        inside: {kind: block_node, inside: {kind: document}}
        all:
          - has: {kind: block_mapping_pair, all: [{has: {field: key, regex: "^[\"']?kind[\"']?$"}}, {has: {field: value, regex: "^[\"']?Secret[\"']?$"}}]}
          - has: {kind: block_mapping_pair, all: [{has: {field: key, regex: "^[\"']?apiVersion[\"']?$"}}, {has: {field: value, regex: "^[\"']?v1[\"']?$"}}]}
          - not: {has: {kind: block_mapping_pair, has: {field: key, regex: "^[\"']?sops[\"']?$"}}}
examples:
  match:
    - "apiVersion: v1\nkind: Secret\nmetadata:\n  name: db\ntype: Opaque\ndata:\n  password: aHVudGVyMg==\n"
    - "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\n---\napiVersion: v1\nkind: Secret\nmetadata:\n  name: api\nstringData:\n  token: abc123\n"
  no_match:
    - "apiVersion: v1\nkind: Secret\nmetadata:\n  name: db\ndata:\n  password: ENC[AES256_GCM,data:Tr7o=,type:str]\nsops:\n  version: 3.9.0\n"
    - "apiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n  name: db\nspec:\n  encryptedData:\n    password: AgBy3i4OJSWK\n"
    - "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app\ndata:\n  LOG_LEVEL: info\n"
