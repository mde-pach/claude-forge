id: kubernetes/kube-linter
description: "Changed workloads pass kube-linter's run-as-non-root, privilege-escalation-container, privileged-container, no-read-only-root-fs, unset-memory-requirements, latest-tag, host-network, host-pid, host-ipc, docker-sock, sensitive-host-mounts, drop-net-raw-capability, mismatching-selector, dangling-service, deprecated-service-account-field, invalid-target-ports, liveness-port, readiness-port, startup-port, unsafe-sysctls and duplicate-env-var checks (Forge's config: a project .kube-linter.yaml does not apply), and gain no ignore-check.kube-linter.io annotations."
scope: {language: any, files: ["**/*.yaml", "**/*.yml"]}
enforce:
  - target: check
    stage: lint
    run: "forge_kube_linter --no-new-ignores run-as-non-root privilege-escalation-container privileged-container no-read-only-root-fs unset-memory-requirements latest-tag host-network host-pid host-ipc docker-sock sensitive-host-mounts drop-net-raw-capability mismatching-selector dangling-service deprecated-service-account-field invalid-target-ports liveness-port readiness-port startup-port unsafe-sysctls duplicate-env-var"
examples:
  match:
    - files: {deploy/web.yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\nspec:\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {app: web}\n    spec:\n      containers:\n        - name: web\n          image: ghcr.io/acme/web:latest\n          securityContext:\n            privileged: true\n"}
    - head: {.kube-linter.yaml: "checks:\n  exclude: [run-as-non-root, no-read-only-root-fs, unset-memory-requirements]\n", deploy/svc.yaml: "apiVersion: v1\nkind: Service\nmetadata:\n  name: api\nspec:\n  selector: {app: api}\n  ports: [{port: 80, targetPort: 8080}]\n"}
      files: {deploy/svc.yaml: "apiVersion: v1\nkind: Service\nmetadata:\n  name: api\nspec:\n  selector: {app: apii}\n  ports: [{port: 80, targetPort: 8080}]\n"}
    - head: {deploy/job.yaml: "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: migrate\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: migrate\n          image: ghcr.io/acme/api:1.4.2\n          resources: {limits: {memory: 256Mi}}\n          securityContext: {runAsNonRoot: true, runAsUser: 1000, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [NET_RAW]}}\n"}
      files: {deploy/job.yaml: "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: migrate\n  annotations:\n    ignore-check.kube-linter.io/latest-tag: \"pinned by the release job\"\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: migrate\n          image: ghcr.io/acme/api:1.4.2\n          resources: {limits: {memory: 256Mi}}\n          securityContext: {runAsNonRoot: true, runAsUser: 1000, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [NET_RAW]}}\n"}
  no_match:
    - files: {deploy/web.yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\nspec:\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {app: web}\n    spec:\n      containers:\n        - name: web\n          image: ghcr.io/acme/web:2.3.1\n          resources: {limits: {memory: 512Mi}}\n          securityContext: {runAsNonRoot: true, runAsUser: 1000, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [NET_RAW]}}\n"}
    - files: {.github/workflows/ci.yml: "name: ci\non: push\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo ok\n"}
    - head: {deploy/legacy.yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: legacy\nspec:\n  selector:\n    matchLabels: {app: legacy}\n  template:\n    metadata:\n      labels: {app: legacy}\n    spec:\n      containers:\n        - name: legacy\n          image: nginx:latest\n"}
      files: {deploy/web.yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\nspec:\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {app: web}\n    spec:\n      containers:\n        - name: web\n          image: ghcr.io/acme/web:2.3.1\n          resources: {limits: {memory: 512Mi}}\n          securityContext: {runAsNonRoot: true, runAsUser: 1000, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [NET_RAW]}}\n"}
