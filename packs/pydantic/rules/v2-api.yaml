id: pydantic/v2-api
description: No Pydantic v1 APIs. Use model_dump, model_validate, field_validator and model_config.
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any:
        - {pattern: "$M.dict()"}
        - {pattern: "$M.json()"}
        - {pattern: "$M.parse_obj($$$)"}
        - {pattern: "$M.parse_raw($$$)"}
        - {kind: decorator, has: {pattern: "validator($$$)"}}
        - {kind: decorator, has: {pattern: "root_validator($$$)"}}
        - {kind: decorator, has: {kind: identifier, regex: "^root_validator$"}}
        - kind: class_definition
          has: {field: name, regex: "^Config$"}
          inside:
            kind: block
            inside: {kind: class_definition, has: {field: superclasses, has: {regex: "BaseModel"}}}
    # HTTP responses (httpx, requests, TestClient) also have .json(): not Pydantic.
    constraints: {M: {not: {regex: "^(r|res|resp|response|[A-Za-z_]*_(response|resp))$|\\.(response|resp)$"}}}
examples:
  match: ["data = user.dict()", "u = User.parse_obj(raw)", "@validator(\"name\")\ndef check(cls, v):\n    return v\n", "class User(BaseModel):\n    class Config:\n        orm_mode = True\n"]
  no_match: ["body = response.json()", "assert resp.json() == {}", "data = user.model_dump()", "u = User.model_validate(raw)", "@field_validator(\"name\")\ndef check(cls, v):\n    return v\n", "class User(BaseModel):\n    model_config = ConfigDict(from_attributes=True)\n"]
