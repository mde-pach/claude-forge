id: typescript/no-new-suppressions
description: No new suppression comments (biome-ignore in any form, @ts-expect-error); a changed file may not have more than it had. Fix the finding instead.
scope: {language: typescript}
enforce:
  - target: grep
    mode: no-increase
    pattern: "biome-ignore|@ts-expect-error"
examples:
  match:
    - "// biome-ignore lint/suspicious/noExplicitAny: legacy API\nexport const x: any = 1;"
    - "/** biome-ignore-all lint/style: generated */"
    - "// @ts-expect-error the module has no types\nimport legacy from \"legacy\";"
  no_match:
    - "export const x: unknown = 1;"
    - "// ignore the cache when the flag is set"
