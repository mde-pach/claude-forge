id: typescript/config-ratchet
description: "Biome, tsconfig and package.json test scripts are not loosened (rules lowered or turned off, strict flags removed, paths excluded, --passWithNoTests-like flags added); loosening one is the user's decision: ask them."
scope: {language: any, files: ["**/biome.json", "**/biome.jsonc", "**/tsconfig*.json", "**/package.json"]}
enforce:
  - target: check
    stage: lint
    run: "forge_ratchet bun ratchet.mjs"
    when_changed: ["**/biome.json", "**/biome.jsonc", "**/tsconfig*.json", "**/package.json"]
examples:
  match:
    - head: {biome.json: "{\"linter\": {\"rules\": {\"suspicious\": {\"noExplicitAny\": \"error\"}}}}\n"}
      files: {biome.json: "{\"linter\": {\"rules\": {\"suspicious\": {\"noExplicitAny\": \"warn\"}}}}\n"}
    - head: {tsconfig.json: "{\n  // strict everywhere\n  \"compilerOptions\": {\"strict\": true},\n}\n"}
      files: {tsconfig.json: "{\"compilerOptions\": {\"strict\": false}}\n"}
    - head: {tsconfig.json: "{\"compilerOptions\": {\"strict\": true}, \"include\": [\"src\"]}\n"}
      files: {tsconfig.json: "{\"compilerOptions\": {\"strict\": true}, \"include\": [\"src\"], \"exclude\": [\"src/legacy\"]}\n"}
    - head: {package.json: "{\"scripts\": {\"test\": \"vitest run\"}}\n"}
      files: {package.json: "{\"scripts\": {\"test\": \"vitest run --passWithNoTests\"}}\n"}
  no_match:
    - head: {package.json: "{\"scripts\": {\"test\": \"vitest run\"}, \"dependencies\": {\"zod\": \"4.1.0\"}}\n"}
      files: {package.json: "{\"scripts\": {\"test\": \"vitest run\", \"dev\": \"next dev\"}, \"dependencies\": {\"zod\": \"4.2.0\"}}\n"}
    - head: {biome.json: "{\"linter\": {\"rules\": {\"suspicious\": {\"noExplicitAny\": \"warn\"}}}}\n"}
      files: {biome.json: "{\"linter\": {\"rules\": {\"suspicious\": {\"noExplicitAny\": \"error\"}}}}\n"}
