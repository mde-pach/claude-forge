id: typescript/no-secrets
description: No API keys, tokens or private keys in code. Read them from the environment.
scope: {language: "typescript"}
enforce:
  - target: tool
    tool: biome
    expects: "lint/security/noSecrets"
    snippet: "\"linter\": {\"rules\": {\"security\": {\"noSecrets\": {\"level\": \"error\", \"options\": {\"entropyThreshold\": 50}}}}}, \"overrides\": [{\"includes\": [\"**/*.test.*\", \"**/*.spec.*\", \"**/generated/**\"], \"linter\": {\"rules\": {\"security\": {\"noSecrets\": \"off\"}}}}]"
examples:
  match:
    - "export const AWS_KEY = \"AKIAIOSFODNN7EXAMPLE\";\n"
  no_match:
    - "export const stripe = process.env.STRIPE_SECRET_KEY;\n"
    - "export const label = \"Add to cart\";\n"
