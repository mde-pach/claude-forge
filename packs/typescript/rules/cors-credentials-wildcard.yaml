id: typescript/cors-credentials-wildcard
description: CORS with credentials true names its allowed origins. origin "*" is refused by browsers with credentials; origin true, or a function that returns the origin it is given (alone or with a ?? / || fallback, as an expression or a return), lets any site make credentialed requests. Covers cors (Express), hono/cors, @fastify/cors and Nest's enableCors.
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    utils:
      # an options object with credentials: true and an origin that allows any site
      any-origin-with-credentials:
        kind: object
        all:
          - has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?credentials[\"']?$"}}, {has: {field: value, kind: "true"}}]}
          - has:
              kind: pair
              all:
                - has: {field: key, regex: "^[\"']?origin[\"']?$"}
                - has:
                    field: value
                    any:
                      - {regex: "^[\"']\\*[\"']$"}
                      - {kind: "true"}
                      # a function that returns the origin it is given (alone, or with a fallback)
                      - all:
                          - any: [{kind: arrow_function}, {kind: function_expression}]
                          - any:
                              - has: {field: parameter, pattern: $O}
                              - has: {field: parameters, has: {nthChild: 1, has: {field: pattern, pattern: $O}}}
                          - any:
                              - has: {field: body, any: [{pattern: $O}, {pattern: "$O ?? $D"}, {pattern: "$O || $D"}, {pattern: "($O)"}]}
                              - has: {field: body, kind: statement_block, has: {stopBy: end, kind: return_statement, has: {any: [{pattern: $O}, {pattern: "$O ?? $D"}, {pattern: "$O || $D"}]}}}
    rule:
      kind: call_expression
      # a match's metavariables are those of the first branch that matches: the most specific first
      any:
        # app.register(fastifyCors, {...})
        - all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: "^register$"}}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $PLUGIN}}, {has: {nthChild: 2, matches: any-origin-with-credentials}}]}
        # app.enableCors({...}) on a Nest application
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $APP}}, {has: {field: property, regex: "^enableCors$"}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: any-origin-with-credentials}}
        # NestFactory.create(AppModule, { cors: {...} })
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $NEST}}, {has: {field: property, regex: "^create$"}}]}
            - has: {field: arguments, has: {nthChild: 2, kind: object, has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?cors[\"']?$"}}, {has: {field: value, matches: any-origin-with-credentials}}]}}}
        # cors({...}) from cors or hono/cors
        - all:
            - has: {field: function, pattern: $CORS}
            - has: {field: arguments, has: {nthChild: 1, matches: any-origin-with-credentials}}
    # The libraries' own functions and classes (§15.6, §15.1), whatever the imports call them.
    where:
      CORS: {declared: [{package: cors}, {package: hono, name: cors}]}
      PLUGIN: {declared: {package: "@fastify/cors"}}
      APP: {type: {package: "@nestjs/common", name: INestApplication}}
      NEST: {declared: {package: "@nestjs/core", name: NestFactory}}
examples:
  deps:
    - {ecosystem: npm, name: cors, version: "2.8.5"}
    - {ecosystem: npm, name: "@types/cors", version: "2.8.19"}
    - {ecosystem: npm, name: hono, version: "4.10.4"}
    - {ecosystem: npm, name: fastify, version: "5.6.1"}
    - {ecosystem: npm, name: "@fastify/cors", version: "11.1.0"}
    - {ecosystem: npm, name: "@nestjs/common", version: "11.1.8"}
    - {ecosystem: npm, name: "@nestjs/core", version: "11.1.8"}
  match:
    - "import { Hono } from \"hono\";\nimport { cors } from \"hono/cors\";\n\nconst app = new Hono();\napp.use(\"/api/*\", cors({ origin: \"*\", credentials: true }));\n"
    - "import cors from \"cors\";\n\nexport const middleware = cors({ origin: true, credentials: true });\n"
    - "import { cors as allow } from \"hono/cors\";\n\nexport const middleware = allow({ origin: (origin) => origin ?? \"\", credentials: true });\n"
    - "import Fastify from \"fastify\";\nimport fastifyCors from \"@fastify/cors\";\n\nconst app = Fastify();\napp.register(fastifyCors, { origin: (o, cb) => cb(null, true), credentials: true, ...{} });\napp.register(fastifyCors, { origin: true, credentials: true });\n"
    - "import type { INestApplication } from \"@nestjs/common\";\n\nexport function setup(app: INestApplication) {\n  app.enableCors({ origin: true, credentials: true });\n}\n"
    - "import { NestFactory } from \"@nestjs/core\";\n\nclass AppModule {}\n\nexport const app = NestFactory.create(AppModule, { cors: { origin: true, credentials: true } });\n"
  no_match:
    - "import { cors } from \"hono/cors\";\n\nexport const middleware = cors({ origin: [\"https://app.example.com\"], credentials: true });\n"
    - "import cors from \"cors\";\n\nexport const middleware = cors({ origin: \"*\" });\n"
    - "import cors from \"cors\";\n\nconst ALLOWED = [\"https://app.example.com\"];\nexport const middleware = cors({ origin: (o: string) => (ALLOWED.includes(o) ? o : \"\"), credentials: true });\n"
    - "function cors(options: { origin: boolean; credentials: boolean }) {\n  return options;\n}\n\nexport const settings = cors({ origin: true, credentials: true });\n"
    - "const server = { enableCors: (o: object) => o };\nserver.enableCors({ origin: true, credentials: true });\n"
