id: typescript/config-files
description: Claude asks you before editing the Biome, TypeScript, ESLint, Oxlint, Deno, Prettier, package manager (pnpm-workspace.yaml, .npmrc, .yarnrc.yml, bunfig.toml) and Turborepo configs; package.json is covered by typescript/config-ratchet.
scope: {language: any}
enforce:
  - {target: permission, decision: ask, rule: "Edit(**/biome.json)"}
  - {target: permission, decision: ask, rule: "Edit(**/biome.jsonc)"}
  - {target: permission, decision: ask, rule: "Edit(**/tsconfig*.json)"}
  - {target: permission, decision: ask, rule: "Edit(**/eslint.config.*)"}
  - {target: permission, decision: ask, rule: "Edit(**/.oxlintrc.json)"}
  - {target: permission, decision: ask, rule: "Edit(**/deno.json)"}
  - {target: permission, decision: ask, rule: "Edit(**/deno.jsonc)"}
  - {target: permission, decision: ask, rule: "Edit(**/.prettierrc*)"}
  - {target: permission, decision: ask, rule: "Edit(**/prettier.config.*)"}
  - {target: permission, decision: ask, rule: "Edit(**/pnpm-workspace.yaml)"}
  - {target: permission, decision: ask, rule: "Edit(**/.npmrc)"}
  - {target: permission, decision: ask, rule: "Edit(**/.yarnrc.yml)"}
  - {target: permission, decision: ask, rule: "Edit(**/bunfig.toml)"}
  - {target: permission, decision: ask, rule: "Edit(**/turbo.json)"}
examples:
  match:
    - "Edit(biome.json)"
    - "Edit(biome.jsonc)"
    - "Edit(tsconfig.json)"
    - "Edit(apps/web/tsconfig.app.json)"
    - "Edit(eslint.config.mjs)"
    - "Edit(.oxlintrc.json)"
    - "Edit(deno.jsonc)"
    - "Edit(.prettierrc.json)"
    - "Edit(prettier.config.js)"
    - "Edit(pnpm-workspace.yaml)"
    - "Edit(.npmrc)"
    - "Edit(.yarnrc.yml)"
    - "Edit(bunfig.toml)"
    - "Edit(apps/web/turbo.json)"
  no_match: ["Edit(package.json)", "Edit(src/biome.ts)", "Edit(src/eslint-rules.ts)", "Edit(docs/prettier.md)"]
