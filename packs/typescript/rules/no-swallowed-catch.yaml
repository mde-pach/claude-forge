id: typescript/no-swallowed-catch
description: A catch block rethrows or uses the error it caught; .catch(() => {}) is not allowed either. Handle the error, log it, or let it propagate.
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any:
        - kind: catch_clause
          not: {has: {field: body, has: {stopBy: end, kind: throw_statement}}}
          any:
            - all: [{kind: catch_clause}, {not: {has: {field: parameter, regex: "."}}}]
            - all:
                - has: {field: parameter, pattern: $ERR}
                - not: {has: {field: body, has: {stopBy: end, pattern: $ERR}}}
        - pattern: "$P.catch(() => {})"
        - pattern: "$P.catch(() => undefined)"
        - pattern: "$P.catch(() => null)"
examples:
  match:
    - "export function load(): Config | null {\n  try {\n    return read();\n  } catch (e) {\n    return null;\n  }\n}\n"
    - "export function load(): Config | null {\n  try {\n    return read();\n  } catch {\n    return null;\n  }\n}\n"
    - "export async function sync() {\n  await push().catch(() => {});\n}\n"
  no_match:
    - "export function load(): Config {\n  try {\n    return read();\n  } catch (e) {\n    throw new ConfigError(\"cannot read config\", { cause: e });\n  }\n}\n"
    - "export function load(): Config | null {\n  try {\n    return read();\n  } catch (error) {\n    logger.error({ error }, \"config unreadable\");\n    return null;\n  }\n}\n"
    - "export async function sync() {\n  await push().catch((e) => report(e));\n}\n"
