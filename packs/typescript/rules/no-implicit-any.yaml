id: typescript/no-implicit-any
description: Implicit any is a type error (noImplicitAny, part of strict).
scope: {language: typescript}
enforce:
  - target: tool
    tool: tsc
    expects: TS7006
    snippet: '"compilerOptions": {"strict": true}'
examples:
  match: ["export function f(a) {\n  return a;\n}\n"]
  no_match: ["export function f(a: number) {\n  return a;\n}\n"]
