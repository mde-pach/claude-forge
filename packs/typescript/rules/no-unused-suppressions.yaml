id: typescript/no-unused-suppressions
description: No biome-ignore comment that suppresses nothing. Biome reports these as warnings only (no setting makes them errors), so this check fails on them.
scope: {language: typescript}
enforce:
  - target: check
    stage: lint
    run: "! forge_do biome lint . 2>&1 | grep -E '^[^[:space:]]+:[0-9]+:[0-9]+ suppressions/unused'"
    changed_run: "! forge_do biome lint {files} 2>&1 | grep -E '^[^[:space:]]+:[0-9]+:[0-9]+ suppressions/unused'"
examples:
  match:
    - "// biome-ignore lint/suspicious/noDoubleEquals: legacy comparison\nexport const same = (a: number, b: number) => a === b;\n"
  no_match:
    - "// biome-ignore lint/suspicious/noDoubleEquals: compares a number with its string form on purpose\nexport const same = (a: number, b: string) => a == b;\n"
    - "export const same = (a: number, b: number) => a === b;\n"
