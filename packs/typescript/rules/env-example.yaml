id: typescript/env-example
description: "A key added to a Zod env schema (t3-env createEnv, or z.object(...) parsed from process.env) is listed in the .env template next to it (.env.example, .env.template, .env.sample, .env.dist, .env.<name>.example): always when it has no .default() or .optional(), and also otherwise when the template already lists at least half of the schema's keys. Checked at Stop and pre-commit."
scope: {language: typescript}
enforce:
  - {target: check, stage: lint, run: "forge_env_example ts"}
examples:
  match:
    - head:
        .env.example: "DATABASE_URL=\"postgresql://app:app@localhost:5432/app\"\n"
        src/env.js: "import { createEnv } from \"@t3-oss/env-nextjs\";\nimport { z } from \"zod\";\n\nexport const env = createEnv({\n  server: {\n    DATABASE_URL: z.url(),\n  },\n  runtimeEnv: {\n    DATABASE_URL: process.env.DATABASE_URL,\n  },\n});\n"
      files:
        src/env.js: "import { createEnv } from \"@t3-oss/env-nextjs\";\nimport { z } from \"zod\";\n\nexport const env = createEnv({\n  server: {\n    DATABASE_URL: z.url(),\n    RESEND_API_KEY: z.string().min(1),\n  },\n  runtimeEnv: {\n    DATABASE_URL: process.env.DATABASE_URL,\n    RESEND_API_KEY: process.env.RESEND_API_KEY,\n  },\n});\n"
  no_match:
    - head:
        .env.example: "DATABASE_URL=\"postgresql://app:app@localhost:5432/app\"\n"
        src/env.ts: "import { z } from \"zod\";\n\nexport const env = z.object({\n  DATABASE_URL: z.url(),\n}).parse(process.env);\n"
      files:
        .env.example: "DATABASE_URL=\"postgresql://app:app@localhost:5432/app\"\nRESEND_API_KEY=\n"
        src/env.ts: "import { z } from \"zod\";\n\nexport const env = z.object({\n  DATABASE_URL: z.url(),\n  RESEND_API_KEY: z.string().min(1),\n}).parse(process.env);\n"
    # optional, and the template lists only the required keys
    - head:
        .env.example: "DATABASE_URL=\n"
        src/env.ts: "import { z } from \"zod\";\n\nexport const env = z.object({\n  DATABASE_URL: z.url(),\n  PORT: z.coerce.number().default(3000),\n  LOG_LEVEL: z.string().default(\"info\"),\n}).parse(process.env);\n"
      files:
        src/env.ts: "import { z } from \"zod\";\n\nexport const env = z.object({\n  DATABASE_URL: z.url(),\n  PORT: z.coerce.number().default(3000),\n  LOG_LEVEL: z.string().default(\"info\"),\n  SENTRY_DSN: z.url().optional(),\n}).parse(process.env);\n"
    # not an env schema
    - head:
        .env.example: "DATABASE_URL=\n"
      files:
        src/schema.ts: "import { z } from \"zod\";\n\nexport const Status = z.object({\n  ACTIVE: z.literal(1),\n});\n"
