id: typescript/no-secret-logging
description: "No secret in a log line or thrown error: a variable, property or header named like a token, secret, password, API key, private or access key, authorization or credentials, passed to console.*, a logger's methods or a thrown error (directly, in a template literal, with +, or as an object property) is rejected. Log an id or a masked value instead; a name such as maxTokens, hasToken, passwordHash or nextPageToken is not a secret."
scope: {language: typescript, files: ["!**/*.test.*", "!**/*.spec.*", "!**/__tests__/**", "!e2e/**", "!scripts/**"]}
enforce:
  - target: ast-grep
    mode: forbid
    utils:
      secret-name:
        any:
          - {kind: identifier, regex: "(?i)(^|_)(token|secret|password|passwd|pwd|api_?key|apikey|secret_?key|private_?key|access_?key|authorization|credentials?)$|(Token|Secret|Password|ApiKey|SecretKey|PrivateKey|AccessKey|Authorization|Credentials?)$"}
          - {kind: shorthand_property_identifier, regex: "(?i)(^|_)(token|secret|password|passwd|pwd|api_?key|apikey|secret_?key|private_?key|access_?key|authorization|credentials?)$|(Token|Secret|Password|ApiKey|SecretKey|PrivateKey|AccessKey|Authorization|Credentials?)$"}
          - {kind: member_expression, has: {field: property, regex: "(?i)(^|_)(token|secret|password|passwd|pwd|api_?key|apikey|secret_?key|private_?key|access_?key|authorization|credentials?)$|(Token|Secret|Password|ApiKey|SecretKey|PrivateKey|AccessKey|Authorization|Credentials?)$"}}
          - {kind: subscript_expression, has: {field: index, regex: "(?i)^[\"'`](x-)?(authorization|api-?key|token|password|secret|cookie)[\"'`]$"}}
        not: {regex: "(?i)(^|[._])(has|is|use|should|needs?|num|max|min|count|total|len|page|next|prev|continuation|pagination|cursor|sync|cancel|cancellation|csrf|xsrf)_?[A-Za-z_]*$|^(has|is|use|should|need|num|max|min|count|total|page|next|prev|cursor|csrf|xsrf)[A-Z]"}
      sink:
        any:
          - kind: call_expression
            has: {field: function, regex: "^console\\.(log|info|warn|error|debug|trace)$|(?i)^([A-Za-z_$][A-Za-z0-9_$]*\\.)*_?(log|logger)\\.(debug|info|warn|warning|error|fatal|trace|log)$"}
          - kind: new_expression
            inside: {kind: throw_statement, stopBy: neighbor}
    rule:
      matches: secret-name
      any:
        - inside: {kind: arguments, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}
        - inside: {kind: template_substitution, stopBy: neighbor, inside: {kind: template_string, stopBy: neighbor, inside: {kind: arguments, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}}
        - inside: {kind: binary_expression, stopBy: neighbor, inside: {kind: arguments, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}
        - inside: {kind: object, stopBy: neighbor, inside: {kind: arguments, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}
        - inside: {kind: pair, field: value, stopBy: neighbor, inside: {kind: object, stopBy: neighbor, inside: {kind: arguments, stopBy: neighbor, inside: {matches: sink, stopBy: neighbor}}}}
examples:
  match:
    - "export function refresh(token: string): void {\n  console.log(`refreshing with token=${token}`);\n}\n"
    - "export function call(apiKey: string): void {\n  logger.info({ apiKey }, \"calling the API\");\n}\n"
    - "export function check(req: Request): void {\n  log.warn(\"header \" + req.headers.get(\"x\") + req.headers.authorization);\n}\n"
    - "export function connect(accessToken: string): never {\n  throw new Error(`login failed with ${accessToken}`);\n}\n"
    - "console.log(process.env.STRIPE_SECRET_KEY);\n"
  no_match:
    - "export function usage(maxTokens: number, hasToken: boolean): void {\n  console.log(`budget ${maxTokens}, authenticated ${hasToken}`);\n}\n"
    - "export function refresh(token: string): void {\n  logger.info({ tokenLength: token.length }, \"refreshing\");\n}\n"
    - "export function page(nextPageToken: string): void {\n  logger.debug({ nextPageToken }, \"next page\");\n}\n"
    - "export function reset(userId: string): never {\n  console.info(\"password reset for\", userId);\n  throw new Error(\"password is too short\");\n}\n"
    - "export function store(passwordHash: string, cacheKey: string): void {\n  logger.debug({ passwordHash, cacheKey }, \"stored\");\n}\n"
