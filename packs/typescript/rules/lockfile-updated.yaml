id: typescript/lockfile-updated
description: "A package.json whose dependencies, devDependencies or optionalDependencies changed comes with a changed lock file (pnpm-lock.yaml, package-lock.json, yarn.lock or bun.lock, when the project has one): run the package manager to update it. At Stop each finding blocks once per turn, then is accepted."
scope: {language: any}
enforce:
  - {target: check, stage: lint, run: "forge_once forge_lockfile_updated", when_changed: ["**/package.json"]}
examples:
  match:
    - head: {package.json: "{\"name\": \"shop\", \"private\": true}\n", pnpm-lock.yaml: "lockfileVersion: '9.0'\n", packages/zod/package.json: "{\n  \"name\": \"zod\",\n  \"devDependencies\": {}\n}\n"}
      files: {packages/zod/package.json: "{\n  \"name\": \"zod\",\n  \"devDependencies\": {\n    \"esbuild\": \"^0.25.5\"\n  }\n}\n"}
    - head: {package.json: "{\"name\": \"shop\", \"dependencies\": {\"zod\": \"4.0.0\"}}\n", bun.lock: "{\"lockfileVersion\": 1}\n"}
      files: {package.json: "{\"name\": \"shop\", \"dependencies\": {\"zod\": \"4.1.0\"}}\n"}
  no_match:
    - head: {package.json: "{\"name\": \"shop\", \"dependencies\": {\"zod\": \"4.0.0\"}}\n", bun.lock: "{\"lockfileVersion\": 1, \"zod\": \"4.0.0\"}\n"}
      files: {package.json: "{\"name\": \"shop\", \"dependencies\": {\"zod\": \"4.1.0\"}}\n", bun.lock: "{\"lockfileVersion\": 1, \"zod\": \"4.1.0\"}\n"}
    - head: {package.json: "{\"name\": \"shop\", \"version\": \"1.0.0\", \"dependencies\": {\"zod\": \"4.0.0\"}}\n", bun.lock: "{\"lockfileVersion\": 1}\n"}
      files: {package.json: "{\n  \"name\": \"shop\",\n  \"version\": \"1.1.0\",\n  \"scripts\": {\"test\": \"vitest run\"},\n  \"dependencies\": {\n    \"zod\": \"4.0.0\"\n  }\n}\n"}
    - head: {package.json: "{\"name\": \"shop\", \"dependencies\": {}}\n"}
      files: {package.json: "{\"name\": \"shop\", \"dependencies\": {\"zod\": \"4.1.0\"}}\n"}
