id: typescript/no-permissive-trust-proxy
description: "Advice: app.set(\"trust proxy\", true) on an Express app and trustProxy: true in Fastify({...}) trust every X-Forwarded-For hop, so the client sets req.ip (IP rate limits and logs are spoofable); give the hop count, the proxy subnets or a function."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      any:
        # Express: app.set("trust proxy", true)
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $A}}, {has: {field: property, regex: "^set$"}}]}
            - has:
                field: arguments
                all:
                  - has: {nthChild: 1, kind: string, regex: "^[\"'`]trust proxy[\"'`]$"}
                  - has: {nthChild: 2, kind: "true"}
        # Fastify({ trustProxy: true }), Fastify the default or named import of fastify
        - kind: pair
          all:
            - has: {field: key, regex: "^[\"']?trustProxy[\"']?$"}
            - has: {field: value, kind: "true"}
            - inside:
                kind: object
                stopBy: neighbor
                inside:
                  kind: arguments
                  stopBy: neighbor
                  inside:
                    kind: call_expression
                    stopBy: neighbor
                    all:
                      - has: {field: function, kind: identifier, pattern: $F}
                      - inside:
                          kind: program
                          stopBy: end
                          has:
                            kind: import_statement
                            all:
                              - has: {field: source, regex: "^[\"']fastify[\"']$"}
                              - any:
                                  - has: {stopBy: end, kind: identifier, pattern: $F, inside: {kind: import_clause, stopBy: neighbor}}
                                  - has:
                                      stopBy: end
                                      kind: import_specifier
                                      any:
                                        - all: [{has: {field: name, regex: "^fastify$"}}, {has: {field: alias, pattern: $F}}]
                                        - all: [{has: {field: name, regex: "^fastify$", pattern: $F}}, {not: {has: {field: alias, kind: identifier}}}]
    where:
      A: {type: {package: express-serve-static-core, name: Application}}
examples:
  deps: [{ecosystem: npm, name: "@types/express", version: "5.0.6"}]
  match:
    - "import express from \"express\";\n\nconst app = express();\napp.set(\"trust proxy\", true);\n"
    - "import Fastify from \"fastify\";\n\nexport const app = Fastify({ logger: true, trustProxy: true });\n"
  no_match:
    - "import express from \"express\";\n\nconst app = express();\napp.set(\"trust proxy\", 1);\napp.set(\"etag\", true);\n"
    - "import Fastify from \"fastify\";\n\nexport const app = Fastify({ trustProxy: \"10.0.0.0/8\" });\n"
    - "const settings = new Map<string, unknown>();\nsettings.set(\"trust proxy\", true);\n"
