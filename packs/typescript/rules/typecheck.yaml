id: typescript/typecheck
description: The project passes tsc.
scope: {language: typescript}
enforce:
  # plain diagnostics (--pretty false); incremental, with the build info kept in the root's .forge/state/ (ignored; one file per workspace package), never next to the project's tsconfig or its composite build info
  - {target: check, stage: typecheck, run: "forge_do tsc typecheck-incremental \"$(forge_state_file tsc.tsbuildinfo)\""}
examples:
  match:
    - files:
        tsconfig.json: '{"compilerOptions": {"strict": true, "noEmit": true}, "include": ["src"]}'
        src/total.ts: "export const total: number = \"12\";\n"
  no_match:
    - files:
        tsconfig.json: '{"compilerOptions": {"strict": true, "noEmit": true}, "include": ["src"]}'
        src/total.ts: "export const total: number = 12;\n"
