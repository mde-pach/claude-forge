id: typescript/no-hardcoded-session-secret
description: No string literal as a signing secret (express-session, cookie-parser, better-auth, hono/jwt, jsonwebtoken sign/verify, @fastify/cookie, @fastify/session). Read it from the environment or a secret store; a secret in the code signs every session for whoever reads the repository.
scope: {language: typescript, files: ["!**/*.test.*", "!**/*.spec.*", "!**/__tests__/**", "!e2e/**"]}
enforce:
  - target: ast-grep
    mode: forbid
    utils:
      literal:
        any:
          - {kind: string}
          - {kind: template_string, not: {has: {kind: template_substitution}}}
          - {kind: array, has: {any: [{kind: string}, {kind: template_string, not: {has: {kind: template_substitution}}}]}}
      literal-secret-option:
        kind: object
        has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?secret[\"']?$"}}, {has: {field: value, matches: literal}}]}
    rule:
      kind: call_expression
      # a match's metavariables are those of the first branch that matches: the most specific first
      any:
        # session({ secret: "…" }), betterAuth({ secret: "…" }), jwt({ secret: "…" })
        - all:
            - has: {field: function, pattern: $OPTS}
            - has: {field: arguments, has: {nthChild: 1, matches: literal-secret-option}}
        # app.register(fastifyCookie, { secret: "…" })
        - all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: "^register$"}}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $PLUGIN}}, {has: {nthChild: 2, matches: literal-secret-option}}]}
        # jwt.sign(payload, "…"), verify(token, "…")
        - all:
            - has: {field: function, pattern: $JWT}
            - has: {field: arguments, has: {nthChild: 2, matches: literal}}
        # cookieParser("…")
        - all:
            - has: {field: function, pattern: $COOKIES}
            - has: {field: arguments, has: {nthChild: 1, matches: literal}}
    # The libraries' own functions (§15.6), whatever the imports call them.
    where:
      OPTS: {declared: [{package: express-session, name: session}, {package: better-auth, name: betterAuth}, {package: hono, name: jwt}]}
      PLUGIN: {declared: {package: ["@fastify/cookie", "@fastify/session"]}}
      JWT: {declared: [{package: jsonwebtoken, name: [sign, verify]}, {package: hono, name: [sign, verify]}]}
      COOKIES: {declared: {package: cookie-parser}}
examples:
  deps:
    - {ecosystem: npm, name: express-session, version: "1.18.2"}
    - {ecosystem: npm, name: "@types/express-session", version: "1.18.2"}
    - {ecosystem: npm, name: cookie-parser, version: "1.4.7"}
    - {ecosystem: npm, name: "@types/cookie-parser", version: "1.4.10"}
    - {ecosystem: npm, name: jsonwebtoken, version: "9.0.2"}
    - {ecosystem: npm, name: "@types/jsonwebtoken", version: "9.0.10"}
    - {ecosystem: npm, name: hono, version: "4.10.4"}
    - {ecosystem: npm, name: better-auth, version: "1.3.34"}
    - {ecosystem: npm, name: fastify, version: "5.6.1"}
    - {ecosystem: npm, name: "@fastify/cookie", version: "11.0.2"}
    - {ecosystem: npm, name: "@fastify/session", version: "11.1.0"}
  match:
    - "import session from \"express-session\";\n\nexport const sessions = session({ secret: \"keyboard cat\", resave: false, saveUninitialized: false });\n"
    - "import cookieParser from \"cookie-parser\";\n\nexport const cookies = cookieParser(`my-super-secret-session-key-2024`);\n"
    - "import jwt from \"jsonwebtoken\";\n\nexport const token = (id: string) => jwt.sign({ sub: id }, \"0123456789abcdef0123456789abcdef\");\n"
    - "import { sign as signJwt } from \"hono/jwt\";\n\nexport const token = (id: string) => signJwt({ sub: id }, \"dev-secret\");\n"
    - "import { betterAuth } from \"better-auth\";\n\nexport const auth = betterAuth({ secret: \"change-me\" });\n"
    - "import Fastify from \"fastify\";\nimport fastifyCookie from \"@fastify/cookie\";\n\nconst app = Fastify();\napp.register(fastifyCookie, { secret: \"cookie-secret\" });\n"
  no_match:
    - "import session from \"express-session\";\n\nexport const sessions = session({ secret: process.env.SESSION_SECRET ?? \"\", resave: false, saveUninitialized: false });\n"
    - "import jwt from \"jsonwebtoken\";\n\nexport const token = (id: string, key: string) => jwt.sign({ sub: id }, key);\n"
    - "import { verify } from \"hono/jwt\";\n\nexport const check = (t: string) => verify(t, `${process.env.JWT_SECRET}`);\n"
    - "function sign(payload: object, label: string): string {\n  return JSON.stringify(payload) + label;\n}\n\nexport const s = sign({ a: 1 }, \"name\");\n"
    - "const config = (o: { secret: string }) => o;\n\nexport const c = config({ secret: \"not a signing key\" });\n"
