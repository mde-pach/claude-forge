id: typescript/express/no-req-query-assign
description: "No assignment to req.query or to a property of it on an Express 5 request: req.query is a getter that parses the query string again on each read, so the assignment is lost (or throws). Keep parsed input in res.locals or a typed variable."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any: [{kind: assignment_expression}, {kind: augmented_assignment_expression}]
      has:
        field: left
        any:
          - {kind: member_expression, all: [{has: {field: object, pattern: $R}}, {has: {field: property, regex: "^query$"}}]}
          - any: [{kind: member_expression}, {kind: subscript_expression}]
            has: {field: object, kind: member_expression, all: [{has: {field: object, pattern: $R}}, {has: {field: property, regex: "^query$"}}]}
    where:
      R: {type: {package: express-serve-static-core, name: Request}}
when:
  deps: [{ecosystem: npm, name: express, version: ">=5.0.0"}]
examples:
  deps: [{ecosystem: npm, name: "@types/express", version: "5.0.6"}]
  match:
    - "import type { Request } from \"express\";\n\nexport function parse(req: Request) {\n  req.query = { page: \"1\" };\n}\n"
    - "import type { Request } from \"express\";\n\nexport function paginate(req: Request) {\n  req.query.page = \"1\";\n  req.query[\"size\"] = \"20\";\n}\n"
  no_match:
    - "import type { Request, Response } from \"express\";\n\nexport function parse(req: Request, res: Response) {\n  res.locals.page = Number(req.query.page ?? 1);\n  const query = { ...req.query, page: \"1\" };\n  return query;\n}\n"
    - "const req = { query: { page: \"1\" } };\nreq.query.page = \"2\";\n"
