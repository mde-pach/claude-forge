id: typescript/pulumi/config-secret
description: "A secret stored in stack config is set with --secret (pulumi config set --secret dbPassword ...), so it is encrypted in Pulumi.<stack>.yaml instead of committed as plain text."
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command:
      name: pulumi
      sub: [config, set]
      args_any: ["/(?i)(password|passwd|secret|token|api[-_]?key|private[-_]?key|credential)/"]
      flags_none: [--secret, --plaintext]
examples:
  match: ["pulumi config set dbPassword hunter2", "pulumi config set --stack dev stripe:apiKey sk_test_123"]
  no_match: ["pulumi config set --secret dbPassword hunter2", "pulumi config set aws:region eu-west-1", "pulumi config get dbPassword"]
