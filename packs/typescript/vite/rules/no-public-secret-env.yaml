id: typescript/vite/no-public-secret-env
description: Secrets are never VITE_ variables, which Vite inlines into the client bundle (import.meta.env.VITE_… named with SECRET, PRIVATE, PASSWORD, SERVICE_ROLE or DATABASE_URL).
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: member_expression
      has: {field: object, pattern: "import.meta.env"}
      regex: "^import\\.meta\\.env\\.VITE_[A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|SERVICE_ROLE|DATABASE_URL)"
examples:
  match: ["export const key = import.meta.env.VITE_STRIPE_SECRET_KEY;\n", "export const db = import.meta.env.VITE_DATABASE_URL;\n"]
  no_match: ["export const key = import.meta.env.VITE_STRIPE_PUBLISHABLE_KEY;\n", "export const secret = process.env.STRIPE_SECRET_KEY;\n"]
