id: typescript/vite/no-public-secret-env-file
description: No VITE_ variable named as a secret (SECRET, PRIVATE, PASSWORD, SERVICE_ROLE, DATABASE_URL) in .env files; Vite inlines VITE_ variables into the client bundle.
scope: {language: any, files: [".env", ".env.*", "**/.env", "**/.env.*"]}
enforce:
  - target: grep
    mode: forbid
    pattern: "^[[:space:]]*(export[[:space:]]+)?VITE_[A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|SERVICE_ROLE|DATABASE_URL)"
examples:
  match: ["VITE_API_URL=https://api.example.com\nVITE_SUPABASE_SERVICE_ROLE_KEY=\n", "export VITE_DB_PASSWORD=\n"]
  no_match: ["VITE_SUPABASE_ANON_KEY=\nSUPABASE_SERVICE_ROLE_KEY=\n", "# never VITE_STRIPE_SECRET_KEY: keep it server-side\n"]
