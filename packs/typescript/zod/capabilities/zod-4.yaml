id: typescript/zod/zod-4
description: Zod 4's API beyond the basics, what changed since Zod 3 and the schema types it added.
relevant:
  - The task writes or changes Zod schemas, or validates data with Zod.
  - The task upgrades Zod from version 3 to version 4.
when: {deps: [{ecosystem: npm, name: zod, version: ">=4.0.0"}]}
deliver: on-demand
text: |
  Zod 4, as installed in this project.

  Imports: `import { z } from "zod"`. A library supporting Zod 3 and 4 users imports `zod/v4`; `zod/mini` is the functional, tree-shakable API (checks through `.check(z.minLength(3))`).

  Changed from Zod 3:
  - Errors: one `error` parameter, a string or a function (`z.string({ error: "Required" })`), replaces `message`, `required_error`, `invalid_type_error` and `errorMap`. Read errors with `error.issues`, `z.treeifyError(error)`, `z.prettifyError(error)` or `z.flattenError(error)`; `error.format()` and `error.flatten()` are deprecated.
  - String formats are top-level: `z.email()`, `z.url()`, `z.uuid()` (stricter, RFC 9562), `z.uuidv4()`, `z.uuidv7()`, `z.ipv4()`, `z.cidrv4()`, and `z.iso.date()`, `z.iso.time()`, `z.iso.datetime()`, `z.iso.duration()`. The `z.string().email()` forms are deprecated.
  - Objects: `.merge(other)` is deprecated, use `.extend(other.shape)`; `.deepPartial()` is removed; `z.strictObject()` refuses unknown keys, `z.looseObject()` keeps them, `z.object()` strips them. A `.default()` applies inside an optional field too.
  - `z.record()` takes both the key and the value schema; with `z.enum` keys every key is required, and `z.partialRecord()` makes them optional.
  - A number schema fails on `Infinity` and on unsafe integers.
  - Functions: `z.function({ input: [z.number(), z.number()], output: z.number() })`, then `.implement(fn)` or `.implementAsync(fn)`; the `.args().returns()` chain is removed.

  Added in Zod 4:
  - `z.file()` (`.min()`, `.max()` in bytes, `.mime([...])`), `z.json()` (any JSON-serializable value), `z.stringbool()` ("true"/"yes"/"1" to `true`, configurable), `z.templateLiteral(["role-", z.string()])`.
  - `z.codec(input, output, { decode, encode })` for two-way transforms (Zod 4.1 and later): `z.codec(z.iso.datetime(), z.date(), { decode: (s) => new Date(s), encode: (d) => d.toISOString() })`.
  - `.check(...)` for several issues at once, composing check factories (`z.minLength(3)`, `z.startsWith("a")`) or pushing to `payload.issues`.
  - `.prefault(value)`: a default applied before parsing (where `.default()` short-circuits it); `.meta({...})` for metadata; `z.toJSONSchema(schema)` for JSON Schema.
examples:
  selected:
    - "Validate the signup form's body with a Zod schema."
    - "Migrate our schemas from Zod 3 to Zod 4."
  not_selected:
    - "Change the colour of the primary button."
    - "Add pagination to the users SQL query."
