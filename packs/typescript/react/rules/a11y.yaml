id: typescript/react/a11y
description: Biome's accessibility rules are errors (the European Accessibility Act applies to e-commerce since June 2025).
scope: {language: "tsx"}
enforce:
  - target: tool
    tool: biome
    expects: "lint/a11y/useAltText"
    snippet: "\"linter\": {\"rules\": {\"a11y\": \"error\"}}"
  - target: tool
    tool: biome
    expects: "lint/a11y/useButtonType"
    snippet: "\"linter\": {\"rules\": {\"a11y\": \"error\"}}"
examples:
  match:
    - "export function Hero() {\n  return (\n    <div>\n      <img src=\"/hero.png\" />\n      <button>Buy</button>\n    </div>\n  );\n}\n"
  no_match:
    - "export function Hero() {\n  return (\n    <div>\n      <img src=\"/hero.png\" alt=\"A pair of red sneakers\" />\n      <button type=\"button\">Buy</button>\n    </div>\n  );\n}\n"
