id: typescript/react-router/action-validate
description: A route action that reads request.formData() or request.json() validates it with a schema (.parse, .safeParse, parseWithZod, getValidatedFormData) before using it.
scope: {language: typescript, files: ["app/**", "src/app/**"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: export_statement
      any:
        - has: {kind: function_declaration, has: {field: name, regex: "^action$"}}
        - has: {kind: lexical_declaration, has: {kind: variable_declarator, has: {field: name, regex: "^action$"}}}
      has:
        stopBy: end
        kind: call_expression
        has: {field: function, kind: member_expression, has: {field: property, regex: "^(formData|json)$"}}
      not:
        has:
          stopBy: end
          kind: call_expression
          has: {field: function, regex: "(^|\\.)(parse|safeParse|parseAsync|safeParseAsync|parseWithZod|parseWithValibot|parseWithYup|getValidatedFormData)$"}
examples:
  match:
    - "import type { Route } from \"./+types/project\";\n\nexport async function action({ request, params }: Route.ActionArgs) {\n  const user = await requireUser(request);\n  const form = await request.formData();\n  await db.project.update({ where: { id: params.id, ownerId: user.id }, data: { name: String(form.get(\"name\")) } });\n  return redirect(\"/projects\");\n}\n"
    - "export const action = async ({ request }: Route.ActionArgs) => {\n  await requireUser(request);\n  const body = await request.json();\n  return data(await db.note.create({ data: body }));\n};\n"
  no_match:
    - "import { z } from \"zod\";\nimport type { Route } from \"./+types/project\";\n\nconst Rename = z.object({ name: z.string().min(1).max(100) });\n\nexport async function action({ request, params }: Route.ActionArgs) {\n  const user = await requireUser(request);\n  const { name } = Rename.parse(Object.fromEntries(await request.formData()));\n  await db.project.update({ where: { id: params.id, ownerId: user.id }, data: { name } });\n  return redirect(\"/projects\");\n}\n"
    - "export async function action({ request }: Route.ActionArgs) {\n  const submission = parseWithZod(await request.formData(), { schema: Rename });\n  if (submission.status !== \"success\") return submission.reply();\n  return redirect(\"/\");\n}\n"
    - "export async function loader({ request }: Route.LoaderArgs) {\n  return data(await fetch(\"https://api.example.com\").then((r) => r.json()));\n}\n"
