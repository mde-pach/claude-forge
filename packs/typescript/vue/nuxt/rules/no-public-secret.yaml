id: typescript/vue/nuxt/no-public-secret
description: runtimeConfig.public is sent to the browser; no key there names a secret, private key, password, service role or database URL.
scope: {language: typescript, files: ["nuxt.config.*"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: pair
      has: {field: key, regex: "(?i)(secret|private|password|service_?role|database_?url)"}
      inside:
        kind: object
        inside:
          kind: pair
          has: {field: key, regex: "^[\"']?public[\"']?$"}
          inside:
            kind: object
            inside: {kind: pair, has: {field: key, regex: "^[\"']?runtimeConfig[\"']?$"}}
examples:
  match:
    - "export default defineNuxtConfig({\n  runtimeConfig: {\n    public: { apiBase: \"/api\", stripeSecretKey: \"\" },\n  },\n});\n"
  no_match:
    - "export default defineNuxtConfig({\n  runtimeConfig: {\n    stripeSecretKey: \"\",\n    public: { apiBase: \"/api\", stripePublishableKey: \"\" },\n  },\n});\n"
