id: typescript/vue/nuxt/no-public-secret
description: "runtimeConfig.public is sent to the browser; no key there names a secret, private key, password, credential, token, API key, access key, service role, DSN or database URL (keys that say publishable, public, anon or site are allowed: those values are meant for the browser)."
scope: {language: typescript, files: ["nuxt.config.*"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: pair
      all:
        - has: {field: key, regex: "(?i)(secret|private|passw(or)?d|credential|token|api_?key|access_?key|auth_?key|service_?role|dsn|database_?url)"}
        - not: {has: {field: key, regex: "(?i)(publishable|public|anon|site_?key)"}}
      inside:
        kind: object
        inside:
          kind: pair
          has: {field: key, regex: "^[\"']?public[\"']?$"}
          inside:
            kind: object
            inside: {kind: pair, has: {field: key, regex: "^[\"']?runtimeConfig[\"']?$"}}
examples:
  match:
    - "export default defineNuxtConfig({\n  runtimeConfig: {\n    public: { apiBase: \"/api\", stripeSecretKey: \"\" },\n  },\n});\n"
    - "export default defineNuxtConfig({\n  runtimeConfig: {\n    public: { openaiApiKey: \"\", githubToken: \"\", sentryDsn: \"\" },\n  },\n});\n"
  no_match:
    - "export default defineNuxtConfig({\n  runtimeConfig: {\n    stripeSecretKey: \"\",\n    public: { apiBase: \"/api\", stripePublishableKey: \"\" },\n  },\n});\n"
    - "export default defineNuxtConfig({\n  runtimeConfig: {\n    openaiApiKey: \"\",\n    public: { supabaseAnonKey: \"\", recaptchaSiteKey: \"\", mapboxPublicToken: \"\" },\n  },\n});\n"
