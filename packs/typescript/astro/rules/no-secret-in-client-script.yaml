id: typescript/astro/no-secret-in-client-script
description: "A non-PUBLIC_ variable from import.meta.env is never passed to a client island's props (client:*) or into define:vars: both are written into the page's HTML, so the secret ships to every visitor. Use the secret on the server and pass only its result, or use a PUBLIC_ variable for values meant for the browser."
scope: {language: any, files: ["**/*.astro"]}
enforce:
  - target: grep
    mode: forbid
    # generated: a client:* directive or define:vars on the line, and import.meta.env.<NAME> where NAME
    # is neither PUBLIC_* nor one of Astro's built-ins (MODE, DEV, PROD, SSR, SITE, BASE_URL, ASSETS_PREFIX)
