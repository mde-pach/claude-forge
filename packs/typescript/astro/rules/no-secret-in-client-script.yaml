examples:
  match:
    - "---\nimport Checkout from \"../components/Checkout.tsx\";\n---\n<Checkout client:load stripeKey={import.meta.env.STRIPE_SECRET_KEY} />\n"
    - "---\nimport Map from \"../components/Map.tsx\";\n---\n<Map apiKey={import.meta.env.MAPS_KEY} client:visible />\n"
    - "---\n---\n<script define:vars={{ token: import.meta.env.API_TOKEN }}>\n  fetch(\"/api\", { headers: { authorization: token } });\n</script>\n"
  no_match:
    - "---\nimport Checkout from \"../components/Checkout.tsx\";\n---\n<Checkout client:load stripeKey={import.meta.env.PUBLIC_STRIPE_KEY} dev={import.meta.env.DEV} />\n"
    - "---\nimport Checkout from \"../components/Checkout.tsx\";\nconst session = await createSession(import.meta.env.STRIPE_SECRET_KEY);\n---\n<Checkout client:load sessionId={session.id} />\n"
    - "---\n---\n<script define:vars={{ base: import.meta.env.BASE_URL, site: import.meta.env.SITE }}>\n  console.log(base, site);\n</script>\n"
