id: typescript/astro/collection-schema
description: "A content collection loaded with glob(), file() or an inline loader declares a schema: without one, entry data is untyped and unvalidated at build time. Add schema: z.object({...})."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call_expression
      all:
        - has: {field: function, regex: "^defineCollection$"}
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: object
              all:
                - not: {has: {kind: pair, has: {field: key, regex: "^[\"']?schema[\"']?$"}}}
                - not: {has: {kind: shorthand_property_identifier, regex: "^schema$"}}
                - not: {has: {kind: method_definition, has: {field: name, regex: "^schema$"}}}
                - not: {has: {kind: spread_element}}
                # a third-party loader may bring its own schema
                - any:
                    - not: {has: {kind: pair, has: {field: key, regex: "^[\"']?loader[\"']?$"}}}
                    - has:
                        kind: pair
                        all:
                          - has: {field: key, regex: "^[\"']?loader[\"']?$"}
                          - has:
                              field: value
                              any:
                                - {kind: call_expression, has: {field: function, regex: "^(glob|file)$"}}
                                - {kind: arrow_function}
                                - {kind: function_expression}
      inside:
        kind: program
        stopBy: end
        has: {kind: import_statement, has: {field: source, regex: "^[\"']astro:content[\"']$"}}
examples:
  match:
    - "import { defineCollection } from \"astro:content\";\nimport { glob } from \"astro/loaders\";\n\nconst blog = defineCollection({\n  loader: glob({ pattern: \"**/*.md\", base: \"./src/content/blog\" }),\n});\n\nexport const collections = { blog };\n"
    - "import { defineCollection } from \"astro:content\";\n\nconst team = defineCollection({\n  loader: async () => [{ id: \"ada\", name: \"Ada\" }],\n});\n\nexport const collections = { team };\n"
  no_match:
    - "import { defineCollection, z } from \"astro:content\";\nimport { glob } from \"astro/loaders\";\n\nconst blog = defineCollection({\n  loader: glob({ pattern: \"**/*.md\", base: \"./src/content/blog\" }),\n  schema: z.object({ title: z.string(), pubDate: z.coerce.date() }),\n});\n\nexport const collections = { blog };\n"
    - "import { defineCollection } from \"astro:content\";\nimport { feedLoader } from \"@ascorbic/feed-loader\";\n\nconst releases = defineCollection({\n  loader: feedLoader({ url: \"https://github.com/withastro/astro/releases.atom\" }),\n});\n\nexport const collections = { releases };\n"
    - "import { defineCollection } from \"astro:content\";\nimport { docsLoader } from \"@astrojs/starlight/loaders\";\nimport { docsSchema } from \"@astrojs/starlight/schema\";\n\nconst schema = docsSchema();\n\nexport const collections = { docs: defineCollection({ loader: docsLoader(), schema }) };\n"
