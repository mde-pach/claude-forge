id: typescript/prisma/db-push
description: Commands that change a database outside migrations need confirmation.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command:
      - {name: prisma, sub: [db, 'push|execute']}
      - {name: prisma, sub: [migrate, deploy]}
examples:
  match: ["bunx prisma db push", "prisma migrate deploy", "prisma db execute --file x.sql"]
  no_match: ["prisma migrate dev", "prisma db pull"]
