id: typescript/prisma/no-raw-input-data
description: "A Prisma create / update / upsert writes the request body as it came (data: await req.json(), data: req.body, data: Object.fromEntries(formData), or a spread or variable of one): the client then chooses every column, including role, ownerId or price (mass assignment). Parse the input with a schema that lists the writable fields and write the parsed result, setting server-owned fields (owner, role, price) yourself."
scope: {language: typescript, files: ["**/*", "!@ts-tests", "!@e2e-tests"]}
enforce:
  - target: ast-grep
    mode: forbid
    utils:
      # the request's input as it came: await x.json(), x.body, Object.fromEntries(await x.formData()) or of a FormData
      raw-input:
        any:
          - kind: await_expression
            has: {kind: call_expression, all: [{has: {field: function, kind: member_expression, has: {field: property, regex: "^json$"}}}, {has: {field: arguments, regex: "^\\(\\s*\\)$"}}]}
          - kind: member_expression
            has: {field: property, regex: "^body$"}
          - kind: call_expression
            all:
              - has: {field: function, regex: "^Object\\.fromEntries$"}
              - has:
                  field: arguments
                  has:
                    nthChild: 1
                    any:
                      - kind: await_expression
                        has: {kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: "^formData$"}}}
                      - {kind: identifier, pattern: $FD}
      # raw input, or a variable declared from it in the same file
      raw-or-declared:
        any:
          - matches: raw-input
          - kind: identifier
            pattern: $V
            inside:
              stopBy: end
              kind: program
              has:
                stopBy: end
                kind: variable_declarator
                all:
                  - has: {field: name, kind: identifier, pattern: $V}
                  - has: {field: value, matches: raw-input}
    rule:
      kind: pair
      all:
        - has: {field: key, regex: "^[\"']?(data|create|update)[\"']?$"}
        - has:
            field: value
            any:
              - matches: raw-or-declared
              - kind: object
                has: {kind: spread_element, has: {matches: raw-or-declared}}
        - inside:
            kind: object
            inside:
              kind: arguments
              inside:
                kind: call_expression
                all:
                  - pattern: $CALL
                  - has: {field: function, kind: member_expression, has: {field: property, regex: "^(create|createMany|createManyAndReturn|update|updateMany|updateManyAndReturn|upsert)$"}}
    # a model delegate's call by what it returns (the runtime's PrismaPromise: generated
    # clients are project code); Object.fromEntries of a FormData, not of any iterable
    where:
      CALL: {type: {package: "@prisma/client", name: PrismaPromise}}
      FD: {type: {package: [typescript, undici-types], name: FormData}}
examples:
  deps: [{ecosystem: npm, name: "@prisma/client", version: "7.10.0"}, {ecosystem: npm, name: "@types/node", version: "24.10.1"}]
  match:
    - "import type { PrismaPromise } from \"@prisma/client/runtime/client\";\n\ninterface UserDelegate {\n  create(args: { data: Record<string, unknown> }): PrismaPromise<{ id: number }>;\n}\ndeclare const prisma: { user: UserDelegate };\n\nexport async function POST(req: Request) {\n  const body = await req.json();\n  const user = await prisma.user.create({ data: body });\n  return Response.json(user);\n}\n"
    - "import type { PrismaPromise } from \"@prisma/client/runtime/client\";\n\ninterface PostDelegate {\n  update(args: { where: { id: number }; data: Record<string, unknown> }): PrismaPromise<{ id: number }>;\n}\ndeclare const prisma: { post: PostDelegate };\n\nexport async function savePost(id: number, formData: FormData) {\n  await prisma.post.update({ where: { id }, data: { ...Object.fromEntries(formData), updatedAt: new Date() } });\n}\n"
    - "import type { PrismaPromise } from \"@prisma/client/runtime/client\";\n\ninterface UserDelegate {\n  upsert(args: { where: { email: string }; create: Record<string, unknown>; update: Record<string, unknown> }): PrismaPromise<{ id: number }>;\n}\ndeclare const prisma: { user: UserDelegate };\n\nexport async function PUT(req: Request) {\n  return Response.json(await prisma.user.upsert({ where: { email: \"a@b\" }, create: await req.json(), update: {} }));\n}\n"
  no_match:
    - "import type { PrismaPromise } from \"@prisma/client/runtime/client\";\n\ninterface UserDelegate {\n  create(args: { data: { name: string; email: string } }): PrismaPromise<{ id: number }>;\n}\ndeclare const prisma: { user: UserDelegate };\ndeclare function parseUser(input: unknown): { name: string; email: string };\n\nexport async function POST(req: Request) {\n  const input = parseUser(await req.json());\n  const user = await prisma.user.create({ data: input });\n  return Response.json(user);\n}\n"
    - "import type { PrismaPromise } from \"@prisma/client/runtime/client\";\n\ninterface PostDelegate {\n  create(args: { data: { title: string; authorId: number } }): PrismaPromise<{ id: number }>;\n}\ndeclare const prisma: { post: PostDelegate };\n\nexport async function createPost(authorId: number, formData: FormData) {\n  await prisma.post.create({ data: { title: String(formData.get(\"title\")), authorId } });\n}\n"
    - "export async function POST(req: Request) {\n  const body = await req.json();\n  const store = { create: (o: { data: unknown }) => o.data };\n  return Response.json(store.create({ data: body }));\n}\n"
    - "import type { PrismaPromise } from \"@prisma/client/runtime/client\";\n\ninterface SettingDelegate {\n  create(args: { data: Record<string, string> }): PrismaPromise<{ id: number }>;\n}\ndeclare const prisma: { setting: SettingDelegate };\n\nexport async function seed(defaults: Map<string, string>) {\n  await prisma.setting.create({ data: Object.fromEntries(defaults) });\n}\n"
