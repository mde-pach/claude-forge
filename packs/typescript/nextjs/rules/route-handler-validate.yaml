# Next.js: Route Handlers are public HTTP endpoints; validate their input before use
# (https://nextjs.org/docs/app/guides/data-security, https://nextjs.org/docs/app/getting-started/route-handlers).
# Path params are not covered: they are strings already. The raw body (req.text(),
# req.arrayBuffer()) is not covered: webhooks need it to verify a signature.
# Another validation helper name is a local rule with the same id (.forge/rules/).
id: typescript/nextjs/route-handler-validate
description: An App Router route handler (app/**/route.ts) that reads the request body (req.json(), req.formData()) or searchParams validates it with a schema (.parse, .safeParse, valibot's parse(), ...) in the same handler.
scope: {language: typescript, files: ["**/app/**/route.ts", "**/app/**/route.js"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      any:
        - kind: call_expression
          has: {field: function, kind: member_expression, all: [{has: {field: object, regex: "^(req|request)$"}}, {has: {field: property, regex: "^(json|formData)$"}}]}
        - kind: member_expression
          has: {field: property, regex: "^searchParams$"}
        - kind: shorthand_property_identifier_pattern
          regex: "^searchParams$"
      inside:
        stopBy: end
        matches: handler
        not: {has: {stopBy: end, matches: schema-call}}
    utils:
      handler:
        kind: export_statement
        any:
          - has: {kind: function_declaration, has: {field: name, regex: "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$"}}
          - has: {kind: lexical_declaration, has: {kind: variable_declarator, has: {field: name, regex: "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$"}}}
      schema-call:
        kind: call_expression
        any:
          - has:
              field: function
              kind: member_expression
              has: {field: property, regex: "^(parse|safeParse|parseAsync|safeParseAsync|validate|validateSync|decode|decodeUnknown)$"}
              not: {has: {field: object, regex: "^JSON$"}}
          - has: {field: function, kind: identifier, regex: "^(parse|safeParse|parseAsync|safeParseAsync)$"}
examples:
  match:
    - |
      export async function POST(request: Request) {
        const body = await request.json();
        await db.order.create({ data: body });
        return Response.json({ ok: true });
      }
    - |
      export const GET = async (req: NextRequest) => {
        const page = Number(req.nextUrl.searchParams.get("page"));
        return Response.json(await db.post.findMany({ skip: page * 10 }));
      };
    - |
      export const PATCH = withAuth(async (req: Request) => {
        const raw = JSON.parse(await req.text());
        const form = await req.formData();
        return Response.json({ raw, name: form.get("name") });
      });
  no_match:
    - |
      import { z } from "zod";

      const Order = z.object({ productId: z.string(), quantity: z.number().int().positive() });

      export async function POST(request: Request) {
        const order = Order.parse(await request.json());
        await db.order.create({ data: order });
        return Response.json({ ok: true });
      }
    - |
      export const GET = withWorkspace(async ({ searchParams }) => {
        const { domain } = getLinksQuerySchema.parse(searchParams);
        return Response.json(await getLinks(domain));
      });
    - |
      export async function DELETE(_req: Request, { params }: { params: Promise<{ id: string }> }) {
        const { id } = await params;
        await db.post.delete({ where: { id } });
        return new Response(null, { status: 204 });
      }
    - |
      import * as v from "valibot";

      export async function PUT(req: Request) {
        const result = v.safeParse(Profile, await req.json());
        if (!result.success) return Response.json(result.issues, { status: 400 });
        return Response.json(await save(result.output));
      }
