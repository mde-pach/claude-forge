id: typescript/nextjs/no-public-secret-env
description: Secrets are never NEXT_PUBLIC_ variables, which are inlined into the browser bundle.
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: member_expression
      has: {field: object, pattern: "process.env"}
      regex: "^process\\.env\\.NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|SERVICE_ROLE|DATABASE_URL)"
examples:
  match: ["const k = process.env.NEXT_PUBLIC_STRIPE_SECRET_KEY;", "const u = process.env.NEXT_PUBLIC_DATABASE_URL;"]
  no_match: ["const k = process.env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY;", "const s = process.env.STRIPE_SECRET_KEY;"]
