id: typescript/nextjs/server-action-auth
description: An exported Server Action (in a 'use server' file) checks who is calling (auth(), getSession(), currentUser(), requireUser(), verifySession(), ...). Route handlers are covered by route-handler-auth. Public actions are excluded through a local rule (see the pack page).
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: export_statement
      all:
        - inside: {kind: program, has: {kind: expression_statement, regex: "^[\"']use server[\"'];?$"}}
        - has: {kind: function_declaration, regex: "^async\\b"}
      not:
        has:
          stopBy: end
          kind: call_expression
          has: {field: function, regex: "(^|\\.)(auth|getSession|getServerSession|getCurrentUser|currentUser|getUser|requireUser|requireAuth|requireSession|verifySession|validateRequest|getAuth)$"}
examples:
  match:
    - "\"use server\";\n\nexport async function deleteOrder(id: string) {\n  await db.order.delete({ where: { id } });\n}\n"
  no_match:
    - "\"use server\";\n\nimport { auth } from \"@/auth\";\n\nexport async function deleteOrder(id: string) {\n  const session = await auth();\n  if (!session) throw new Error(\"Unauthorized\");\n  await db.order.delete({ where: { id, userId: session.user.id } });\n}\n"
    - "export async function PATCH(request: Request) {\n  await db.product.update({ where: { id: \"1\" }, data: Product.parse(await request.json()) });\n  return Response.json({ ok: true });\n}\n"
