id: typescript/nextjs/no-inline-action-secret-closure
description: "An inline 'use server' function does not use a token, secret, API key or password from the component around it: the values a Server Action closes over are sent to the browser (encrypted) and back with every call. Read the secret inside the action (from process.env or the server-side session) instead of closing over it."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      any:
        - {kind: identifier, pattern: $V}
        - {kind: shorthand_property_identifier, pattern: $V}
      all:
        - regex: "(?i)(token|secret|api_?key|password|passwd|private_?key|credential)"
        - inside:
            stopBy: end
            matches: inline-action
            # not declared in the action itself
            not: {has: {stopBy: end, matches: declares-v}}
            inside:
              stopBy: end
              any: [{kind: function_declaration}, {kind: arrow_function}, {kind: function_expression}, {kind: method_definition}]
              has: {field: body, has: {stopBy: end, matches: declares-v}}
    utils:
      inline-action:
        any: [{kind: function_declaration}, {kind: arrow_function}, {kind: function_expression}]
        has: {field: body, kind: statement_block, has: {kind: expression_statement, nthChild: 1, regex: "^[\"']use server[\"'];?$"}}
      declares-v:
        any:
          - {kind: variable_declarator, has: {field: name, kind: identifier, pattern: $V}}
          - {kind: shorthand_property_identifier_pattern, pattern: $V}
          - {kind: pair_pattern, has: {field: value, kind: identifier, pattern: $V}}
          - {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $V}}
examples:
  match:
    - "export default async function Page() {\n  const apiKey = await getApiKey();\n  async function sync() {\n    \"use server\";\n    await fetch(\"https://api.example.com/sync\", { headers: { authorization: `Bearer ${apiKey}` } });\n  }\n  return <form action={sync}><button>Sync</button></form>;\n}\n"
    - "export default async function Page() {\n  const { token } = await getIntegration();\n  const save = async () => {\n    \"use server\";\n    await push({ token });\n  };\n  return <form action={save} />;\n}\n"
  no_match:
    - "export default async function Page() {\n  async function sync() {\n    \"use server\";\n    const apiKey = process.env.SYNC_API_KEY;\n    await fetch(\"https://api.example.com/sync\", { headers: { authorization: `Bearer ${apiKey}` } });\n  }\n  return <form action={sync}><button>Sync</button></form>;\n}\n"
    - "const API_KEY = process.env.API_KEY;\n\nexport default async function Page() {\n  async function sync() {\n    \"use server\";\n    await fetch(\"https://api.example.com\", { headers: { key: API_KEY! } });\n  }\n  return <form action={sync} />;\n}\n"
    - "export default async function Page() {\n  const token = await getToken();\n  return <Widget token={token} />;\n}\n"
