id: typescript/yarn/lock-sync
description: "yarn.lock matches the package.json files; a stale lock is updated with yarn install --mode=update-lockfile, Yarn 3 and later (checked with yarn install --immutable --mode=skip-build, Yarn 2.4 and later; it fails instead of changing the lock file)."
scope: {language: any}
enforce:
  # Forge keeps the lock in sync (forge_js_lock relocks a stale one; §10.5), after the lint
  # stage's new-dependency checks
  - target: check
    stage: codegen
    run: forge_js_lock yarn
    when_changed: ["**/package.json", "yarn.lock", ".yarnrc.yml"]
examples:
  # a stale lock needs the package manager: crates/forge-cli/tests/check.rs::the_js_lock_is_kept_in_sync
  no_match:
    - head:
        package.json: "{\"name\": \"shop\", \"private\": true}\n"
        .yarnrc.yml: "nodeLinker: node-modules\n"
        yarn.lock: "# This file is generated by running \"yarn install\" inside your project.\n# Manual changes might be lost - proceed with caution!\n\n__metadata:\n  version: 8\n  cacheKey: 10c0\n\n\"shop@workspace:.\":\n  version: 0.0.0-use.local\n  resolution: \"shop@workspace:.\"\n  languageName: unknown\n  linkType: soft\n"
      files:
        src/index.ts: "export const x = 1;\n"
    # a lock the project never had is setup (forge apply), not the change's
    - head:
        package.json: "{\"name\": \"shop\", \"private\": true}\n"
        .yarnrc.yml: "nodeLinker: node-modules\n"
      files:
        package.json: "{\"name\": \"shop\", \"private\": true, \"dependencies\": {\"zod\": \"4.1.12\"}}\n"
