id: typescript/jest/no-exit-zero
description: "Test, setup and mock files never call process.exit(0): the run reports success whatever the tests did."
scope: {language: typescript, files: ["@ts-tests", "**/__mocks__/**", "**/test-utils.*", "**/test-helpers.*", "**/jest.setup.*", "!@e2e-tests"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule: {pattern: "process.exit(0)"}
examples:
  match: ["afterAll(() => {\n  process.exit(0);\n});\n"]
  no_match: ["afterAll(() => {\n  process.exitCode = process.exitCode ?? 0;\n});\n", "process.exit(1);\n"]
