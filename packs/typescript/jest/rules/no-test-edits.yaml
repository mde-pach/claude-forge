id: typescript/jest/no-test-edits
description: Changing a Jest test that existed at the start of the turn (anything in it, formatting aside, input data, .each tables and control flow included), or removing it, needs approval; adding tests is fine. Edits ask when made, unapproved changes are blocked at Stop. Changed test support code (helpers, jest.mock factories, __mocks__, test utils) is reported once.
review: "Is this change to existing tests required by the user's request (the request changes the behaviour these tests assert, so they must assert the new behaviour), or does it weaken or remove tests to make the code pass? Allow only the first."
scope: {language: typescript, files: ["@ts-tests", "**/__mocks__/**", "**/test-utils.*", "**/test-helpers.*", "**/jest.setup.*", "!@e2e-tests"]}
enforce:
  - {target: check, stage: lint, run: "forge_test_edits"}
examples:
  match:
    - head: {src/cart.test.ts: "it(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "it(\"totals\", () => {\n  expect(total([40, 60])).toBe(90);\n});\n"}
    - head: {src/cart.test.ts: "describe(\"cart\", () => {\n  it(\"is empty\", () => {\n    expect(total([])).toBe(0);\n  });\n});\n"}
      files: {src/cart.test.ts: "describe(\"cart\", () => {});\n"}
    - head: {src/cart.test.ts: "jest.mock(\"./db\", () => ({ load: () => [40, 60] }));\n\nit(\"totals\", () => {\n  expect(total()).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "jest.mock(\"./db\", () => ({ fetchAll: () => [40, 60] }));\n\nit(\"totals\", () => {\n  expect(total()).toBe(100);\n});\n"}
  no_match:
    - head: {src/cart.test.ts: "it(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "it(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n\nit(\"is empty\", () => {\n  expect(total([])).toBe(0);\n});\n"}
