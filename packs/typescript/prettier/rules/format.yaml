id: typescript/prettier/format
description: Files are formatted with the project's Prettier (prettier --check; a changed file is written with prettier --write).
scope: {language: any}
enforce:
  - target: check
    stage: format
    run: "forge_do prettier format-check ."
    changed_run: "forge_do prettier format {files}"
    # formats a file's base copy, so lines that only formatting changed are not counted as added
    format_stdin: "forge_do prettier format-stdin {file}"
examples:
  match:
    - files: {src/cart.ts: "export const total = (items: {price:number}[]) => items.reduce((s, i) => s + i.price, 0)\n"}
    - files: {README.md: "# Shop\n\n* first\n* second\n"}
  no_match:
    - files: {src/cart.ts: "export const total = (items: { price: number }[]) =>\n  items.reduce((s, i) => s + i.price, 0);\n"}
    - files: {README.md: "# Shop\n\n- first\n- second\n"}
