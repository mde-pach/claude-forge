id: typescript/mikro-orm/schema-guard
description: No mikro-orm schema:drop --run or schema:fresh --run (also -r, and the mikro-orm-esm bin); they wipe the database schema.
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command: {name: [mikro-orm, mikro-orm-esm], sub: ['schema:drop|schema:fresh'], flags_any: [--run, -r]}
examples:
  match: ["npx mikro-orm schema:drop --run", "npx mikro-orm-esm schema:fresh -r --seed", "bunx mikro-orm schema:fresh --run && bun dev"]
  no_match: ["npx mikro-orm schema:drop --dump", "npx mikro-orm schema:update --run", "npx mikro-orm migration:up", "npx mikro-orm schema:fresh --dump; echo --run"]
