id: typescript/mikro-orm/schema-guard
description: Claude asks before mikro-orm schema:drop --run or schema:fresh --run (also -r, and the mikro-orm-esm bin); they wipe the database schema, and the database they reach may not be a disposable one.
review: "Does this command reach a local, disposable development database (not a shared, staging or production one), and does the user's request call for wiping its schema?"
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command: {name: [mikro-orm, mikro-orm-esm], sub: ['schema:drop|schema:fresh'], flags_any: [--run, -r]}
examples:
  match: ["npx mikro-orm schema:drop --run", "npx mikro-orm-esm schema:fresh -r --seed", "bunx mikro-orm schema:fresh --run && bun dev"]
  no_match: ["npx mikro-orm schema:drop --dump", "npx mikro-orm schema:update --run", "npx mikro-orm migration:up", "npx mikro-orm schema:fresh --dump; echo --run"]
