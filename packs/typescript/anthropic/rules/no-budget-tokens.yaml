id: typescript/anthropic/no-budget-tokens
description: "No thinking: { type: 'enabled', budget_tokens } in a messages call whose model is a literal that rejects it with a 400 (Opus 4.7 and later, Sonnet 5 and 5.5, Fable 5 and 5.1, Mythos 5 and 5.1, Haiku 5.5; Bedrock's anthropic. prefix included): use thinking: { type: 'adaptive' } and output_config: { effort }."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      # the beta form first: ast-grep binds the first branch that matches
      any: [{pattern: "$C.beta.messages.$M($$$)"}, {pattern: "$C.messages.$M($$$)"}]
      has:
        field: arguments
        has:
          kind: object
          all:
            - has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?model[\"']?$"}}, {has: {field: value, kind: string, pattern: $MODEL}}]}
            - has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?thinking[\"']?$"}}, {has: {field: value, kind: object, has: {kind: pair, has: {field: key, regex: "^[\"']?budget_tokens[\"']?$"}}}}]}
    constraints:
      M: {regex: "^(create|stream|parse|countTokens)$"}
      MODEL:
        # models.tsv: rejects budget_tokens
        regex: '^["''](anthropic\.)?(claude-fable-5-1|claude-mythos-5-1|claude-fable-5|claude-mythos-5|claude-opus-5-5|claude-opus-5|claude-opus-4-8|claude-opus-4-7|claude-sonnet-5-5|claude-sonnet-5|claude-haiku-5-5)["'']$'
    where:
      C: {type: {package: "@anthropic-ai/sdk", name: [Anthropic, BaseAnthropic]}}
examples:
  deps: [{ecosystem: npm, name: "@anthropic-ai/sdk", version: "1.3.0"}]
  match:
    - "import Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();\nexport const reply = await client.messages.create({\n  model: \"claude-opus-5-5\",\n  max_tokens: 16000,\n  thinking: { type: \"enabled\", budget_tokens: 8000 },\n  messages: [{ role: \"user\", content: \"Hi\" }],\n});\n"
    - "import Anthropic from \"@anthropic-ai/sdk\";\n\nexport async function ask(client: Anthropic) {\n  return client.beta.messages.countTokens({ model: \"claude-sonnet-5-5\", thinking: { type: \"enabled\", budget_tokens: 4000 }, messages: [] });\n}\n"
  no_match:
    - "import Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();\nexport const reply = await client.messages.create({\n  model: \"claude-haiku-4-5\",\n  max_tokens: 16000,\n  thinking: { type: \"enabled\", budget_tokens: 8000 },\n  messages: [],\n});\n"
    - "import Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();\nexport const reply = await client.messages.create({\n  model: \"claude-opus-5-5\",\n  max_tokens: 16000,\n  thinking: { type: \"adaptive\" },\n  output_config: { effort: \"high\" },\n  messages: [],\n});\n"
    - "const client = { messages: { create: (o: object) => o } };\nexport const reply = client.messages.create({ model: \"claude-opus-5-5\", thinking: { type: \"enabled\", budget_tokens: 8000 } });\n"
