id: typescript/elysia/body-schema
description: "An Elysia post / put / patch handler that destructures body passes a body schema in its options argument (t.Object(…), a Standard Schema); otherwise body is unvalidated input."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call_expression
      all:
        - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $APP}}, {has: {field: property, regex: "^(post|put|patch)$"}}]}
        - has:
            field: arguments
            all:
              - has:
                  nthChild: 2
                  any: [{kind: arrow_function}, {kind: function_expression}]
                  has:
                    field: parameters
                    has:
                      nthChild: 1
                      has: {kind: object_pattern, has: {any: [{kind: shorthand_property_identifier_pattern, regex: "^body$"}, {kind: pair_pattern, has: {field: key, regex: "^body$"}}]}}
              - not:
                  has:
                    nthChild: 3
                    kind: object
                    has: {any: [{kind: pair, has: {field: key, regex: "^[\"']?body[\"']?$"}}, {kind: shorthand_property_identifier, regex: "^body$"}]}
    where:
      APP: {type: {package: elysia, name: Elysia}}
examples:
  deps: [{ecosystem: npm, name: elysia, version: "1.4.30"}]
  match:
    - "import { Elysia } from \"elysia\";\n\nexport const app = new Elysia().post(\"/users\", ({ body }) => body);\n"
    - "import { Elysia, t } from \"elysia\";\n\nconst app = new Elysia();\napp.put(\"/users/:id\", ({ body: payload, params }) => ({ payload, params }), { params: t.Object({ id: t.String() }) });\n"
  no_match:
    - "import { Elysia, t } from \"elysia\";\n\nexport const app = new Elysia().post(\"/users\", ({ body }) => body, { body: t.Object({ name: t.String() }) });\n"
    - "import { Elysia } from \"elysia\";\n\nexport const app = new Elysia().post(\"/ping\", ({ set }) => { set.status = 204; });\n"
    - "const router = { post: (p: string, h: (c: { body: unknown }) => unknown) => h({ body: p }) };\n\nexport const r = router.post(\"/x\", ({ body }) => body);\n"
