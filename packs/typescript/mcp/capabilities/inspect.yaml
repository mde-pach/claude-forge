id: typescript/mcp/inspect
description: Calling a TypeScript MCP server's tools the way a client would, with the MCP Inspector's command-line mode.
relevant:
  - The task adds, changes or debugs the tools, resources or prompts of an MCP server written in TypeScript or JavaScript.
deliver: on-demand
text: |
  Talk to the server over MCP instead of calling its functions directly:

  1. Build it if it needs a build (`npm run build`), then list what it exposes: `npx @modelcontextprotocol/inspector --cli node build/index.js --method tools/list` (the command after `--cli` is how a client starts it; `npx tsx src/index.ts` for unbuilt sources; `--method resources/list`, `prompts/list` for the rest). Read each tool's name, description and input schema as a model will.
  2. Call a tool: `… --method tools/call --tool-name <name> --tool-arg <key>=<value>` (repeat `--tool-arg`; `--tool-args-json '{…}'` for nested input). Check the result's content and `isError`, and try one bad input.
  3. A server over HTTP: start it in the background, then `npx @modelcontextprotocol/inspector --cli http://localhost:<port>/mcp --method tools/list`; stop it afterwards.

  `--method tools/list --strict` reports input schemas that some clients cannot use.
examples:
  selected:
    - "Add a create_issue tool to our MCP server."
    - "Our MCP server's search tool returns nothing in Claude Desktop, debug it."
  not_selected:
    - "Add the Linear MCP server to our Claude Code settings."
    - "Write unit tests for the issue title formatter."
