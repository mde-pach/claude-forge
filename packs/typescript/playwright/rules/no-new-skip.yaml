id: typescript/playwright/no-new-skip
description: End-to-end tests are not skipped, marked fixme or fail, or focused.
scope: {language: typescript, files: ["e2e/**"]}
enforce:
  - target: ast-grep
    mode: no-increase
    rule:
      any:
        - {pattern: "test.skip"}
        - {pattern: "test.fixme"}
        - {pattern: "test.fail"}
        - {pattern: "test.only"}
        - {pattern: "test.describe.skip"}
        - {pattern: "test.describe.fixme"}
        - {pattern: "test.describe.only"}
examples:
  match: ["test.skip(\"login\", async ({ page }) => {});", "test.only(\"a\", async () => {});", "test.fail(\"b\", async () => {});", "test.describe.skip(\"c\", () => {});"]
  no_match: ["test(\"login\", async ({ page }) => { await page.goto(\"/\"); });"]
