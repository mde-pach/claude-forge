id: typescript/playwright/no-fewer-expects
description: Assertions are not removed from end-to-end tests.
scope: {language: typescript, files: ["@e2e-tests"]}
enforce:
  - target: ast-grep
    mode: no-decrease
    rule: {pattern: "expect($$$)"}
examples:
  match: ["import { expect, test } from \"@playwright/test\";\n\ntest(\"home\", async ({ page }) => {\n  await page.goto(\"/\");\n  await expect(page).toHaveTitle(/Shop/);\n});\n"]
  no_match: ["import { test } from \"@playwright/test\";\n\ntest(\"home\", async ({ page }) => {\n  await page.goto(\"/\");\n});\n"]
