id: typescript/playwright/axe
description: When @axe-core/playwright is a dependency, at least one end-to-end test scans pages with AxeBuilder.
scope: {language: any}
enforce:
  - target: check
    stage: lint
    run: "! grep -q '\"@axe-core/playwright\"' package.json 2>/dev/null || git ls-files -z -- 'e2e/*' '*.spec.*' | xargs -0 grep -l AxeBuilder /dev/null | grep -q . || { echo 'package.json depends on @axe-core/playwright but no e2e test uses AxeBuilder'; false; }"
    when_changed: [package.json, "e2e/**", "**/*.spec.*"]
examples:
  match:
    - files:
        package.json: "{\"devDependencies\": {\"@playwright/test\": \"1.56.0\", \"@axe-core/playwright\": \"4.11.0\"}}\n"
        e2e/home.spec.ts: "import { expect, test } from \"@playwright/test\";\n\ntest(\"home\", async ({ page }) => {\n  await page.goto(\"/\");\n  await expect(page).toHaveTitle(/Shop/);\n});\n"
  no_match:
    - files:
        package.json: "{\"devDependencies\": {\"@playwright/test\": \"1.56.0\", \"@axe-core/playwright\": \"4.11.0\"}}\n"
        e2e/a11y.spec.ts: "import AxeBuilder from \"@axe-core/playwright\";\nimport { expect, test } from \"@playwright/test\";\n\ntest(\"home has no a11y violations\", async ({ page }) => {\n  await page.goto(\"/\");\n  const results = await new AxeBuilder({ page }).analyze();\n  expect(results.violations).toEqual([]);\n});\n"
    - files: {package.json: "{\"devDependencies\": {\"@playwright/test\": \"1.56.0\"}}\n"}
