id: typescript/knip/unused
description: "Nothing the change touches or leaves behind is unused, as the project's knip reports it with its own config (unused files, exports, types and dependencies; unlisted or unresolved imports): use it where the request needs it, otherwise remove it. An issue type the project's knip `rules` set to `warn` is advice."
scope: {language: any, files: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.vue", "**/*.svelte", "**/*.astro", "**/package.json", "knip.json", "knip.jsonc", ".knip.json", ".knip.jsonc", "knip.config.*", "knip.ts", "knip.js"]}
enforce:
  - {target: check, stage: lint, run: "forge_knip"}
examples:
  match:
    # a new export nothing imports
    - head:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
        knip.json: "{\"entry\": [\"src/index.ts\"], \"project\": [\"src/**/*.ts\"]}\n"
        tsconfig.json: "{\"compilerOptions\": {\"strict\": true, \"module\": \"esnext\", \"moduleResolution\": \"bundler\", \"target\": \"es2022\"}, \"include\": [\"src\"]}\n"
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(1, 2));\n"
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n"
      files:
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n\nexport function sub(a: number, b: number): number {\n  return a - b;\n}\n"
    # the change removed the last import of a file it did not touch: that file is now unused
    - head:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
        knip.json: "{\"entry\": [\"src/index.ts\"], \"project\": [\"src/**/*.ts\"]}\n"
        tsconfig.json: "{\"compilerOptions\": {\"strict\": true, \"module\": \"esnext\", \"moduleResolution\": \"bundler\", \"target\": \"es2022\"}, \"include\": [\"src\"]}\n"
        src/index.ts: "import { add } from \"./math\";\nimport { label } from \"./format\";\n\nconsole.log(label(add(1, 2)));\n"
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n"
        src/format.ts: "export function label(n: number): string {\n  return `total: ${n}`;\n}\n"
      files:
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(1, 2));\n"
    # a new dependency nothing imports
    - head:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
        knip.json: "{\"entry\": [\"src/index.ts\"], \"project\": [\"src/**/*.ts\"]}\n"
        tsconfig.json: "{\"compilerOptions\": {\"strict\": true, \"module\": \"esnext\", \"moduleResolution\": \"bundler\", \"target\": \"es2022\"}, \"include\": [\"src\"]}\n"
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(1, 2));\n"
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n"
      files:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"dependencies\": {\n    \"lodash\": \"4.17.21\"\n  },\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
  no_match:
    # an unused export the base already had, in a file the change did not touch
    - head:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
        knip.json: "{\"entry\": [\"src/index.ts\"], \"project\": [\"src/**/*.ts\"]}\n"
        tsconfig.json: "{\"compilerOptions\": {\"strict\": true, \"module\": \"esnext\", \"moduleResolution\": \"bundler\", \"target\": \"es2022\"}, \"include\": [\"src\"]}\n"
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(1, 2));\n"
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n\nexport function sub(a: number, b: number): number {\n  return a - b;\n}\n"
      files:
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(2, 3));\n"
    # the new export is used
    - head:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
        knip.json: "{\"entry\": [\"src/index.ts\"], \"project\": [\"src/**/*.ts\"]}\n"
        tsconfig.json: "{\"compilerOptions\": {\"strict\": true, \"module\": \"esnext\", \"moduleResolution\": \"bundler\", \"target\": \"es2022\"}, \"include\": [\"src\"]}\n"
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(1, 2));\n"
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n"
      files:
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n\nexport function sub(a: number, b: number): number {\n  return a - b;\n}\n"
        src/index.ts: "import { add, sub } from \"./math\";\n\nconsole.log(add(1, 2), sub(3, 1));\n"
    # the project's knip config turns unused exports off
    - head:
        package.json: "{\n  \"name\": \"app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"devDependencies\": {\n    \"knip\": \"6.45.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n"
        knip.json: "{\"entry\": [\"src/index.ts\"], \"project\": [\"src/**/*.ts\"], \"rules\": {\"exports\": \"off\"}}\n"
        tsconfig.json: "{\"compilerOptions\": {\"strict\": true, \"module\": \"esnext\", \"moduleResolution\": \"bundler\", \"target\": \"es2022\"}, \"include\": [\"src\"]}\n"
        src/index.ts: "import { add } from \"./math\";\n\nconsole.log(add(1, 2));\n"
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n"
      files:
        src/math.ts: "export function add(a: number, b: number): number {\n  return a + b;\n}\n\nexport function sub(a: number, b: number): number {\n  return a - b;\n}\n"
