id: typescript/tailwind/no-removed-utilities
description: "No Tailwind 3 utilities removed in v4, which generate nothing: *-opacity-N (bg-black/50), flex-shrink-* and flex-grow-* (shrink-*, grow-*), overflow-ellipsis (text-ellipsis), decoration-slice and decoration-clone (box-decoration-*)."
scope: {language: any, files: ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.svelte", "**/*.astro", "**/*.html", "**/*.css"]}
enforce:
  - {target: grep, mode: forbid, pattern: "(^|[^a-zA-Z0-9-])((bg|text|border|divide|ring|placeholder)-opacity-[0-9]+|flex-(shrink|grow)(-[0-9]+)?|overflow-ellipsis|decoration-(slice|clone))([^a-zA-Z0-9:-]|$)"}
examples:
  match: ["export const C = () => <div className=\"bg-black bg-opacity-50\" />;\n", "<p class=\"overflow-ellipsis\">x</p>\n", "<div class=\"flex-shrink-0\"></div>\n", "<div class=\"md:flex-grow\"></div>\n", ".card {\n  @apply flex-grow;\n}\n"]
  no_match: ["export const C = () => <div className=\"bg-black/50 shrink-0 grow text-ellipsis box-decoration-slice\" />;\n", "const s = { flexShrink: 0 };\n", ".card {\n  flex-grow: 1;\n  flex-shrink: 0;\n}\n"]
