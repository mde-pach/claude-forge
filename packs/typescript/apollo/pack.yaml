id: typescript/apollo
description: Apollo Server and Apollo Client (CSRF prevention, error responses, imports, client lifetime).
level: project
detect:
  deps_any: [{ecosystem: npm, name: "@apollo/server"}, {ecosystem: npm, name: "@apollo/client"}]
context:
  - text: |
      Apollo Server: `csrfPrevention` stays on (no `csrfPrevention: false`), and `includeStacktraceInErrorResponses` is never set to a literal `true`.
    when: {deps: [{ecosystem: npm, name: "@apollo/server", version: "*"}]}
