id: typescript/apollo/csrf-prevention
description: "No csrfPrevention: false in new ApolloServer({...}): it re-opens CSRF through simple GET and POST requests that browsers send cross-site without a preflight."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: new_expression
      all:
        - pattern: $N
        - has: {field: arguments, has: {kind: object, has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?csrfPrevention[\"']?$"}}, {has: {field: value, kind: "false"}}]}}}
    where:
      N: {type: {package: "@apollo/server", name: ApolloServer}}
examples:
  deps: [{ecosystem: npm, name: "@apollo/server", version: "5.5.1"}, {ecosystem: npm, name: graphql, version: "16.14.2"}]
  match:
    - "import { ApolloServer } from \"@apollo/server\";\n\nexport const server = new ApolloServer({ typeDefs: \"type Query { ok: Boolean }\", resolvers: {}, csrfPrevention: false });\n"
  no_match:
    - "import { ApolloServer } from \"@apollo/server\";\n\nexport const server = new ApolloServer({ typeDefs: \"type Query { ok: Boolean }\", resolvers: {}, csrfPrevention: { requestHeaders: [\"x-apollo-operation-name\"] } });\n"
    - "class ApolloServer {\n  constructor(readonly o: object) {}\n}\n\nexport const s = new ApolloServer({ csrfPrevention: false });\n"
