id: typescript/drizzle/migration-present
description: A change to the Drizzle schema files (drizzle.config schema) that reaches the database comes with a generated migration in the out folder, with its meta/_journal.json and snapshot (drizzle-kit 1.x, <name>/migration.sql with snapshot.json). Relations, types, imports and comments do not count.
scope: {language: any}
enforce:
  - {target: check, stage: migration, run: forge_drizzle_migration_present}
examples:
  match:
    - head: {drizzle.config.ts: "import { defineConfig } from \"drizzle-kit\";\n\nexport default defineConfig({\n  dialect: \"postgresql\",\n  schema: \"./src/db/schema.ts\",\n  out: \"./drizzle\",\n  dbCredentials: { url: process.env.DATABASE_URL! },\n});\n", src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n});\n", drizzle/meta/_journal.json: "{\"version\": \"7\", \"dialect\": \"postgresql\", \"entries\": [{\"idx\": 0, \"tag\": \"0000_init\"}]}\n", drizzle/0000_init.sql: "CREATE TABLE \"users\" (\n\t\"id\" serial PRIMARY KEY NOT NULL,\n\t\"email\" text NOT NULL\n);\n"}
      files: {src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n  phone: text(\"phone\"),\n});\n"}
    - head: {drizzle.config.ts: "import { defineConfig } from \"drizzle-kit\";\n\nexport default defineConfig({\n  dialect: \"postgresql\",\n  schema: \"./src/db/schema.ts\",\n  out: \"./drizzle\",\n  dbCredentials: { url: process.env.DATABASE_URL! },\n});\n", src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n});\n", drizzle/meta/_journal.json: "{\"version\": \"7\", \"dialect\": \"postgresql\", \"entries\": [{\"idx\": 0, \"tag\": \"0000_init\"}]}\n", drizzle/0000_init.sql: "CREATE TABLE \"users\" (\n\t\"id\" serial PRIMARY KEY NOT NULL,\n\t\"email\" text NOT NULL\n);\n"}
      files: {src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n  phone: text(\"phone\"),\n});\n", drizzle/0001_phone.sql: "ALTER TABLE \"users\" ADD COLUMN \"phone\" text;\n"}
  no_match:
    - head: {drizzle.config.ts: "import { defineConfig } from \"drizzle-kit\";\n\nexport default defineConfig({\n  dialect: \"postgresql\",\n  schema: \"./src/db/schema.ts\",\n  out: \"./drizzle\",\n  dbCredentials: { url: process.env.DATABASE_URL! },\n});\n", src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n});\n", drizzle/meta/_journal.json: "{\"version\": \"7\", \"dialect\": \"postgresql\", \"entries\": [{\"idx\": 0, \"tag\": \"0000_init\"}]}\n", drizzle/0000_init.sql: "CREATE TABLE \"users\" (\n\t\"id\" serial PRIMARY KEY NOT NULL,\n\t\"email\" text NOT NULL\n);\n"}
      files: {src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n  phone: text(\"phone\"),\n});\n", drizzle/0001_phone.sql: "ALTER TABLE \"users\" ADD COLUMN \"phone\" text;\n", drizzle/meta/_journal.json: "{\"version\": \"7\", \"dialect\": \"postgresql\", \"entries\": [{\"idx\": 0, \"tag\": \"0000_init\"}, {\"idx\": 1, \"tag\": \"0001_phone\"}]}\n", drizzle/meta/0001_snapshot.json: "{\"id\": \"b\", \"prevId\": \"a\"}\n"}
    - head: {drizzle.config.ts: "import { defineConfig } from \"drizzle-kit\";\n\nexport default defineConfig({\n  dialect: \"postgresql\",\n  schema: \"./src/db/schema.ts\",\n  out: \"./drizzle\",\n  dbCredentials: { url: process.env.DATABASE_URL! },\n});\n", src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n});\n", drizzle/meta/_journal.json: "{\"version\": \"7\", \"dialect\": \"postgresql\", \"entries\": [{\"idx\": 0, \"tag\": \"0000_init\"}]}\n", drizzle/0000_init.sql: "CREATE TABLE \"users\" (\n\t\"id\" serial PRIMARY KEY NOT NULL,\n\t\"email\" text NOT NULL\n);\n"}
      files: {src/db/schema.ts: "import { relations } from \"drizzle-orm\";\nimport { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n});\n\n// a user has many posts\nexport const usersRelations = relations(users, ({ many }) => ({\n  posts: many(posts),\n}));\n\nexport type User = typeof users.$inferSelect;\n"}
    - head: {drizzle.config.ts: "import { defineConfig } from \"drizzle-kit\";\n\nexport default defineConfig({\n  dialect: \"postgresql\",\n  schema: \"./src/db/schema.ts\",\n  out: \"./drizzle\",\n  dbCredentials: { url: process.env.DATABASE_URL! },\n});\n", src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n});\n"}
      files: {src/db/schema.ts: "import { pgTable, serial, text } from \"drizzle-orm/pg-core\";\n\nexport const users = pgTable(\"users\", {\n  id: serial(\"id\").primaryKey(),\n  email: text(\"email\").notNull(),\n  phone: text(\"phone\"),\n});\n", drizzle/20261025120000_phone/migration.sql: "ALTER TABLE \"users\" ADD COLUMN \"phone\" text;\n", drizzle/20261025120000_phone/snapshot.json: "{\"id\": \"b\"}\n"}
