id: typescript/npm/no-other-pm
description: Dependencies are managed with npm; installing with pnpm, yarn or bun asks.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command:
      - {name: pnpm, sub: ['add|install|i|update|up|remove|rm']}
      - {name: yarn, sub: ['add|install|up|upgrade|remove']}
      - {name: yarn, words: '^yarn( --(immutable|frozen-lockfile))?$'}
      - {name: bun, sub: ['install|i|add']}
examples:
  match: ["pnpm add zod", "pnpm install", "yarn", "yarn add zod", "bun add zod", "bun install"]
  no_match: ["which pnpm", "yarn --version", "pnpm --version", "npm install zod", "npm ci", "bun run build", "bunx tsc", "npx pnpm-lock-check"]
