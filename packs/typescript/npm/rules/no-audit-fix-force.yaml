id: typescript/npm/no-audit-fix-force
description: npm audit fix --force asks; it installs versions outside the declared ranges, major upgrades included.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command: {name: npm, sub: [audit, fix], flags_any: [--force]}
examples:
  match: ["npm audit fix --force", "npm audit fix --omit=dev --force"]
  no_match: ["npm audit fix", "npm audit", "npm audit fix && git push --force"]
