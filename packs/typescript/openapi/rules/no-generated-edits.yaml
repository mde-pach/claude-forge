id: typescript/openapi/no-generated-edits
description: "Generated client files (their header names openapi-typescript, orval or @hey-api/openapi-ts) change only with the OpenAPI document or the generator config (orval.config.*, openapi-ts.config.*, redocly.*, or a package.json line naming the generator: its script or dependency version; any other package.json change does not count), never by hand; checked at Stop when the repository tracks the document."
scope: {language: any}
enforce:
  - {target: check, stage: lint, run: forge_openapi_sync hand-edits}
examples:
  match:
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n}\n"}
      files: {src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n  \"/refunds\": { post: operations[\"createRefund\"] };\n}\n"}
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n}\n"}
      files: {package.json: "{\"name\": \"web\", \"version\": \"1.0.1\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n  \"/refunds\": { post: operations[\"createRefund\"] };\n}\n"}
  no_match:
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n}\n"}
      files: {openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n  /refunds:\n    post:\n      responses:\n        \"201\": {description: Created}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n  \"/refunds\": { post: operations[\"createRefund\"] };\n}\n"}
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n}\n"}
      files: {src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n  \"/refunds\": { post: operations[\"createRefund\"] };\n}\n"}
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n", src/routeTree.gen.ts: "// This file was automatically generated by TanStack Router.\n// You should NOT make any changes in this file as it will be overwritten.\nexport const routeTree = 1;\n"}
