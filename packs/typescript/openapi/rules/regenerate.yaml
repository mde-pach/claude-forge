id: typescript/openapi/regenerate
description: A change to a tracked OpenAPI document comes with the regenerated client (a file whose header names openapi-typescript, orval or @hey-api/openapi-ts), when a package.json script runs one of them; checked at Stop.
scope: {language: any}
enforce:
  - {target: check, stage: lint, run: forge_openapi_sync regenerate}
examples:
  match:
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n}\n"}
      files: {openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n  /refunds:\n    post:\n      responses:\n        \"201\": {description: Created}\n"}
  no_match:
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"gen:api\": \"openapi-typescript ./openapi.yaml -o ./src/api/schema.d.ts\"}, \"devDependencies\": {\"openapi-typescript\": \"7.13.0\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n}\n"}
      files: {openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n  /refunds:\n    post:\n      responses:\n        \"201\": {description: Created}\n", src/api/schema.d.ts: "/**\n * This file was auto-generated by openapi-typescript.\n * Do not make direct changes to the file.\n */\n\nexport interface paths {\n  \"/orders\": { get: operations[\"listOrders\"] };\n  \"/refunds\": { post: operations[\"createRefund\"] };\n}\n"}
    - head: {package.json: "{\"name\": \"web\", \"scripts\": {\"build\": \"tsc\"}}\n", openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n"}
      files: {openapi.yaml: "openapi: 3.1.0\ninfo: {title: Shop, version: 1.0.0}\npaths:\n  /orders:\n    get:\n      responses:\n        \"200\": {description: OK}\n  /refunds:\n    post:\n      responses:\n        \"201\": {description: Created}\n"}
