id: typescript/vitest/no-test-edits
description: Tests that existed at the start of the turn are not changed or removed by Claude (new tests are fine); checked at Stop.
scope: {language: typescript, files: ["**/*.test.*", "**/*.spec.*", "**/__tests__/**", "!e2e/**"]}
enforce:
  - {target: check, stage: lint, run: "forge_test_edits"}
examples:
  match:
    - head: {src/cart.test.ts: "import { expect, it } from \"vitest\";\n\nit(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "import { expect, it } from \"vitest\";\n\nit(\"totals\", () => {\n  expect(total([40, 60])).toBe(90);\n});\n"}
    - head: {src/cart.test.ts: "import { describe, expect, it } from \"vitest\";\n\ndescribe(\"cart\", () => {\n  it(\"is empty\", () => {\n    expect(total([])).toBe(0);\n  });\n});\n"}
      files: {src/cart.test.ts: "import { describe } from \"vitest\";\n\ndescribe(\"cart\", () => {});\n"}
  no_match:
    - head: {src/cart.test.ts: "import { expect, it } from \"vitest\";\n\nit(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "import { expect, it } from \"vitest\";\n\nit(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n\nit(\"is empty\", () => {\n  expect(total([])).toBe(0);\n});\n"}
