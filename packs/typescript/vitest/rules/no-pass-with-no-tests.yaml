id: typescript/vitest/no-pass-with-no-tests
description: Running Vitest with --passWithNoTests needs confirmation; it turns a missing or mistyped test file into a pass.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    pattern: '(^|[^A-Za-z0-9_-])vitest[[:space:]][^|;&]*--passWithNoTests([[:space:]=;&|)]|$)'
examples:
  match: ["bunx vitest run --passWithNoTests", "vitest run src/a.test.ts --passWithNoTests=true"]
  no_match: ["bunx vitest run", "bunx vitest run src/a.test.ts"]
