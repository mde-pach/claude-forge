id: typescript/vitest/no-snapshot-update
description: Updating Vitest snapshots needs confirmation; the snapshots are part of the reviewed expectations.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    pattern: '(^|[^A-Za-z0-9_-])vitest([[:space:]]+run)?[^|;&]*[[:space:]](-u|--update)([[:space:]=;&|)]|$)'
examples:
  match: ["bunx vitest run -u", "vitest --update", "bun run vitest run src/a.test.ts -u"]
  no_match: ["bunx vitest run", "bunx vitest run --changed", "vitest --ui"]
