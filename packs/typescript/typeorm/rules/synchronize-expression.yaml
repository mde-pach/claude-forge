id: typescript/typeorm/synchronize-expression
description: "Advice: synchronize or dropSchema set from an expression in new DataSource({...}), TypeOrmModule.forRoot({...}) or a forRootAsync useFactory result is on whenever that expression is true, possibly in production; prefer false and migrations everywhere."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: advise
    rule:
      kind: pair
      all:
        - has: {field: key, regex: "^[\"']?(synchronize|dropSchema)[\"']?$"}
        - has: {field: value, regex: ".", not: {any: [{kind: "true"}, {kind: "false"}]}}
        - any:
            # new DataSource({...})
            - inside:
                kind: object
                stopBy: neighbor
                inside: {kind: arguments, stopBy: neighbor, inside: {kind: new_expression, stopBy: neighbor, pattern: $D}}
            # TypeOrmModule.forRoot({...}), and the object a forRootAsync useFactory returns
            - inside:
                kind: object
                stopBy: neighbor
                all:
                  - any:
                      - inside: {kind: arguments, stopBy: neighbor, inside: {kind: call_expression, stopBy: neighbor, has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $M}}, {has: {field: property, regex: "^forRoot$"}}]}}}
                      - inside:
                          stopBy: end
                          any: [{kind: arrow_function}, {kind: function_expression}, {kind: method_definition}]
                          all:
                            - any:
                                - inside: {kind: pair, stopBy: neighbor, has: {field: key, regex: "^[\"']?useFactory[\"']?$"}}
                                - {kind: method_definition, has: {field: name, regex: "^useFactory$"}}
                            - inside:
                                kind: call_expression
                                stopBy: end
                                has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $M}}, {has: {field: property, regex: "^forRootAsync$"}}]}
                  - inside:
                      kind: program
                      stopBy: end
                      has:
                        kind: import_statement
                        all:
                          - has: {field: source, regex: "^[\"']@nestjs/typeorm[\"']$"}
                          - has:
                              stopBy: end
                              kind: import_specifier
                              any:
                                - all: [{has: {field: name, regex: "^TypeOrmModule$"}}, {has: {field: alias, pattern: $M}}]
                                - all: [{has: {field: name, regex: "^TypeOrmModule$", pattern: $M}}, {not: {has: {field: alias, kind: identifier}}}]
    where:
      D: {type: {package: typeorm, name: DataSource}}
examples:
  deps: [{ecosystem: npm, name: typeorm, version: "1.1.2"}, {ecosystem: npm, name: reflect-metadata, version: "0.2.2"}]
  match:
    - "import { DataSource } from \"typeorm\";\n\nexport const ds = new DataSource({ type: \"postgres\", synchronize: process.env.NODE_ENV !== \"production\" });\n"
    - "import { Module } from \"@nestjs/common\";\nimport { TypeOrmModule as Orm } from \"@nestjs/typeorm\";\n\n@Module({\n  imports: [\n    Orm.forRootAsync({\n      useFactory() {\n        return { type: \"postgres\", synchronize: isDev() };\n      },\n    }),\n  ],\n})\nexport class AppModule {}\n"
  no_match:
    - "import { DataSource } from \"typeorm\";\n\nexport const ds = new DataSource({ type: \"postgres\", synchronize: false });\n"
    - "class Store {\n  constructor(readonly opts: { synchronize: boolean }) {}\n}\n\nexport const s = new Store({ synchronize: process.env.X === \"1\" });\n"
