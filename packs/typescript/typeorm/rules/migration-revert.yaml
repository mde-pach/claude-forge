id: typescript/typeorm/migration-revert
description: typeorm migration:revert runs the last migration's down() against the database; it needs confirmation.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    pattern: '(^|[^A-Za-z0-9_-])typeorm(-ts-node-(esm|commonjs))?[[:space:]]+migration:revert([[:space:];&|)]|$)'
examples:
  match: ["npx typeorm migration:revert -d src/data-source.ts", "npx typeorm-ts-node-commonjs migration:revert -d ./src/db.ts"]
  no_match: ["npx typeorm migration:run -d src/data-source.ts", "npx typeorm migration:show -d src/data-source.ts"]
