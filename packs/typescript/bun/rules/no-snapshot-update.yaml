id: typescript/bun/no-snapshot-update
description: Updating bun test snapshots (-u, --update-snapshots) needs confirmation; the snapshots are part of the reviewed expectations.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command: {name: bun, sub: [test], flags_any: [-u, --update-snapshots]}
examples:
  match: ["bun test -u", "bun test src/cart.test.ts --update-snapshots"]
  no_match: ["bun test", "bun test --bail", "bun run test -- --coverage"]
