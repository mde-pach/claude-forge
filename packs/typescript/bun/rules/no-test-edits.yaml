id: typescript/bun/no-test-edits
description: Tests in bun:test files that existed at the start of the turn are not changed or removed by Claude (new tests are fine); checked at Stop.
scope: {language: typescript, files: ["**/*.test.*", "**/*_test.*", "**/*.spec.*", "**/*_spec.*", "!e2e/**"]}
enforce:
  - target: check
    stage: lint
    run: |
      FORGE_FILES=$(grep -lE "from[[:space:]]*['\"]bun:test['\"]" $FORGE_FILES /dev/null 2>/dev/null)
      forge_test_edits
examples:
  match:
    - head: {src/cart.test.ts: "import { expect, test } from \"bun:test\";\n\ntest(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "import { expect, test } from \"bun:test\";\n\ntest(\"totals\", () => {\n  expect(total([40, 60])).toBe(90);\n});\n"}
    - head: {src/cart.test.ts: "import { describe, expect, it } from \"bun:test\";\n\ndescribe(\"cart\", () => {\n  it(\"is empty\", () => {\n    expect(total([])).toBe(0);\n  });\n});\n"}
      files: {src/cart.test.ts: "import { describe } from \"bun:test\";\n\ndescribe(\"cart\", () => {});\n"}
  no_match:
    - head: {src/cart.test.ts: "import { expect, test } from \"bun:test\";\n\ntest(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "import { expect, test } from \"bun:test\";\n\ntest(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n\ntest(\"is empty\", () => {\n  expect(total([])).toBe(0);\n});\n"}
    - head: {src/cart.test.ts: "import { expect, it } from \"vitest\";\n\nit(\"totals\", () => {\n  expect(total([40, 60])).toBe(100);\n});\n"}
      files: {src/cart.test.ts: "import { expect, it } from \"vitest\";\n\nit(\"totals\", () => {\n  expect(total([40, 60])).toBe(90);\n});\n"}
