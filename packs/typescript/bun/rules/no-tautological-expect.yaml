id: typescript/bun/no-tautological-expect
description: Assertions in tests that import from bun:test test something. No expect() on a literal, such as expect(true).toBe(true).
scope: {language: typescript, files: ["**/*.test.*", "**/*_test.*", "**/*.spec.*", "**/*_spec.*", "!@e2e-tests"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call_expression
      inside: {stopBy: end, kind: program, has: {kind: import_statement, has: {field: source, regex: "^[\"']bun:test[\"']$"}}}
      has:
        field: function
        kind: member_expression
        has:
          field: object
          kind: call_expression
          all:
            - has: {field: function, regex: "^expect$"}
            - has:
                field: arguments
                has: {nthChild: 1, any: [{kind: "true"}, {kind: "false"}, {kind: "null"}, {kind: undefined}, {kind: number}, {kind: string}]}
examples:
  match: ["import { expect, test } from \"bun:test\";\n\ntest(\"a\", () => {\n  expect(true).toBe(true);\n});\n", "import { expect, test } from \"bun:test\";\n\ntest(\"b\", () => {\n  expect(\"x\").toBeTruthy();\n});\n"]
  no_match: ["import { expect, test } from \"bun:test\";\n\ntest(\"a\", () => {\n  expect(sum(1, 1)).toBe(2);\n});\n", "import { expect, it } from \"vitest\";\n\nit(\"a\", () => {\n  expect(true).toBe(true);\n});\n"]
