id: typescript/bun/no-other-pm
description: Dependencies are managed with bun, not npm, pnpm or yarn.
scope: {language: any}
enforce:
  - target: guard
    decision: ask
    command:
      - {name: npm, sub: ['install|i|ci|add']}
      - {name: pnpm, sub: ['add|install|i|update|up|remove|rm']}
      - {name: yarn, sub: ['add|install|up|upgrade|remove']}
      - {name: yarn, words: '^yarn( --(immutable|frozen-lockfile))?$'}
examples:
  match: ["npm install lodash", "npm i", "npm ci", "pnpm add zod", "yarn"]
  no_match: ["which pnpm", "yarn --version", "pnpm --version", "bun add lodash", "npm view lodash version", "npm run build"]
