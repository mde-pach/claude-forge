id: typescript/hono/jwt-alg
description: "Hono's jwt() middleware names the algorithm it accepts, jwt({ secret, alg: \"HS256\" }): without alg, a token signed with another algorithm than the key is meant for may be accepted (algorithm confusion), and current Hono requires it."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call_expression
      all:
        - has: {field: function, pattern: $F}
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: object
              all:
                - not: {has: {kind: pair, has: {field: key, regex: "^[\"']?alg[\"']?$"}}}
                - not: {has: {kind: shorthand_property_identifier, regex: "^alg$"}}
                - not: {has: {kind: spread_element}}
    where:
      F: {declared: {package: hono, name: jwt}}
examples:
  deps: [{ecosystem: npm, name: hono, version: "4.13.22"}]
  match:
    - "import { Hono } from \"hono\";\nimport { jwt } from \"hono/jwt\";\n\nconst app = new Hono();\napp.use(\"/api/*\", jwt({ secret: \"s3cret\" }));\nexport default app;\n"
    - "import { Hono } from \"hono\";\nimport { jwt as auth } from \"hono/jwt\";\n\nexport const app = new Hono().use(\"/admin/*\", auth({ secret: process.env.JWT_SECRET ?? \"\", cookie: \"token\" }));\n"
  no_match:
    - "import { Hono } from \"hono\";\nimport { jwt } from \"hono/jwt\";\n\nconst app = new Hono();\napp.use(\"/api/*\", jwt({ secret: \"s3cret\", alg: \"HS256\" }));\nexport default app;\n"
    - "declare function jwt(o: { secret: string }): void;\n\njwt({ secret: \"x\" });\n"
