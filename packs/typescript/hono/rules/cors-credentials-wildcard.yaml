id: typescript/hono/cors-credentials-wildcard
description: cors() with credentials true names its allowed origins. A function that returns the origin it is given (alone or with a ?? / || fallback, as an expression or a return) lets any site make credentialed requests; origin "*" with credentials is refused by browsers.
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: call_expression
      all:
        - has: {field: function, regex: "^cors$"}
        - has:
            field: arguments
            has:
              kind: object
              all:
                - has: {kind: pair, all: [{has: {field: key, regex: "^[\"']?credentials[\"']?$"}}, {has: {field: value, kind: "true"}}]}
                - has:
                    kind: pair
                    all:
                      - has: {field: key, regex: "^[\"']?origin[\"']?$"}
                      - has:
                          field: value
                          any:
                            - {regex: "^[\"']\\*[\"']$"}
                            # a function that returns the origin it is given (alone, or with a fallback)
                            - all:
                                - any: [{kind: arrow_function}, {kind: function_expression}]
                                - any:
                                    - has: {field: parameter, pattern: $O}
                                    - has: {field: parameters, has: {nthChild: 1, has: {field: pattern, pattern: $O}}}
                                - any:
                                    - has: {field: body, any: [{pattern: $O}, {pattern: "$O ?? $D"}, {pattern: "$O || $D"}, {pattern: "($O)"}]}
                                    - has: {field: body, kind: statement_block, has: {stopBy: end, kind: return_statement, has: {any: [{pattern: $O}, {pattern: "$O ?? $D"}, {pattern: "$O || $D"}]}}}
examples:
  match:
    - "import { cors } from \"hono/cors\";\n\napp.use(\"/api/*\", cors({ origin: \"*\", credentials: true }));\n"
    - "app.use(cors({ origin: (origin) => origin, credentials: true }));\n"
    - "app.use(cors({ origin: (origin, c) => origin, credentials: true }));\n"
    - "app.use(cors({ origin: (o) => { return o; }, credentials: true }));\n"
    - "app.use(cors({ origin: (o) => o ?? \"\", credentials: true }));\n"
    - "app.use(cors({ origin: function (o) { return o || null; }, credentials: true }));\n"
  no_match:
    - "app.use(\"/api/*\", cors({ origin: [\"https://app.example.com\"], credentials: true }));\n"
    - "app.use(\"/public/*\", cors({ origin: \"*\" }));\n"
    - "app.use(cors({ origin: (origin) => allowed, credentials: true }));\n"
    - "app.use(cors({ origin: (o) => (ALLOWED.includes(o) ? o : null), credentials: true }));\n"
    - "app.use(cors({ origin: (o, c) => c.env.ORIGIN, credentials: true }));\n"
deprecated: {replaced_by: typescript/cors-credentials-wildcard}
