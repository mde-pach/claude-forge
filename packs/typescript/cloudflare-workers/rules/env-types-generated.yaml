id: typescript/cloudflare-workers/env-types-generated
description: "The wrangler types output (file role @wrangler-types) was generated from the current wrangler config: wrangler types <file> --check (wrangler 4.153.0 and later), which compares the config hash the file records. Regenerate with wrangler types after changing a binding."
scope: {language: any}
enforce:
  - target: check
    stage: codegen
    run: |
      _wt_files=$(forge_role_files @wrangler-types)
      if [ -z "$_wt_files" ]; then
        printf 'forge:%s skipped: no wrangler types output (file role @wrangler-types names no file of the repository)\n' "$c_id"
      else
        _wt_rc=0
        for _wt_f in $_wt_files; do forge_do wrangler codegen-check "$_wt_f" || _wt_rc=1; done
        [ "$_wt_rc" = 0 ]
      fi
    when_changed: ["@wrangler-config", "@wrangler-types"]
when:
  deps: [{ecosystem: npm, name: wrangler, version: ">=4.153.0"}]
examples:
  match:
    # a binding added to the config, the types not regenerated
    - head:
        wrangler.toml: "name = \"api\"\nmain = \"src/index.ts\"\ncompatibility_date = \"2026-10-01\"\n\n[[kv_namespaces]]\nbinding = \"CACHE\"\nid = \"abc\"\n"
        src/index.ts: "export default { fetch() { return new Response(\"ok\"); } };\n"
        worker-configuration.d.ts: "/* eslint-disable */\n// Generated by Wrangler by running `wrangler types --include-runtime=false` (hash: 87f6c5a76784686daef99aedabae953f)\ninterface __BaseEnv_Env {\n\tCACHE: KVNamespace;\n}\ndeclare namespace Cloudflare {\n\tinterface GlobalProps {\n\t\tmainModule: typeof import(\"./src/index\");\n\t}\n\tinterface Env extends __BaseEnv_Env {}\n}\ninterface Env extends __BaseEnv_Env {}\ndeclare module \"*.txt\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.html\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.sql\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.bin\" {\n\tconst value: ArrayBuffer;\n\texport default value;\n}\ndeclare module \"*.wasm\" {\n\tconst value: WebAssembly.Module;\n\texport default value;\n}\ndeclare module \"*.wasm?module\" {\n\tconst value: WebAssembly.Module;\n\texport default value;\n}"
      files:
        wrangler.toml: "name = \"api\"\nmain = \"src/index.ts\"\ncompatibility_date = \"2026-10-01\"\n\n[[kv_namespaces]]\nbinding = \"CACHE\"\nid = \"abc\"\n\n[[r2_buckets]]\nbinding = \"FILES\"\nbucket_name = \"files\"\n"
  no_match:
    - head:
        wrangler.toml: "name = \"api\"\nmain = \"src/index.ts\"\ncompatibility_date = \"2026-10-01\"\n\n[[kv_namespaces]]\nbinding = \"CACHE\"\nid = \"abc\"\n"
        src/index.ts: "export default { fetch() { return new Response(\"ok\"); } };\n"
        worker-configuration.d.ts: "/* eslint-disable */\n// Generated by Wrangler by running `wrangler types --include-runtime=false` (hash: 87f6c5a76784686daef99aedabae953f)\ninterface __BaseEnv_Env {\n\tCACHE: KVNamespace;\n}\ndeclare namespace Cloudflare {\n\tinterface GlobalProps {\n\t\tmainModule: typeof import(\"./src/index\");\n\t}\n\tinterface Env extends __BaseEnv_Env {}\n}\ninterface Env extends __BaseEnv_Env {}\ndeclare module \"*.txt\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.html\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.sql\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.bin\" {\n\tconst value: ArrayBuffer;\n\texport default value;\n}\ndeclare module \"*.wasm\" {\n\tconst value: WebAssembly.Module;\n\texport default value;\n}\ndeclare module \"*.wasm?module\" {\n\tconst value: WebAssembly.Module;\n\texport default value;\n}"
      files:
        wrangler.toml: "name = \"api\"\nmain = \"src/index.ts\"\ncompatibility_date = \"2026-10-01\"\n\n[[kv_namespaces]]\nbinding = \"CACHE\"\nid = \"abc\"\n\n[[r2_buckets]]\nbinding = \"FILES\"\nbucket_name = \"files\"\n"
        worker-configuration.d.ts: "/* eslint-disable */\n// Generated by Wrangler by running `wrangler types --include-runtime=false` (hash: 0984e14a954cbf768fbde13dd798c8e4)\ninterface __BaseEnv_Env {\n\tCACHE: KVNamespace;\n\tFILES: R2Bucket;\n}\ndeclare namespace Cloudflare {\n\tinterface GlobalProps {\n\t\tmainModule: typeof import(\"./src/index\");\n\t}\n\tinterface Env extends __BaseEnv_Env {}\n}\ninterface Env extends __BaseEnv_Env {}\ndeclare module \"*.txt\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.html\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.sql\" {\n\tconst value: string;\n\texport default value;\n}\ndeclare module \"*.bin\" {\n\tconst value: ArrayBuffer;\n\texport default value;\n}\ndeclare module \"*.wasm\" {\n\tconst value: WebAssembly.Module;\n\texport default value;\n}\ndeclare module \"*.wasm?module\" {\n\tconst value: WebAssembly.Module;\n\texport default value;\n}"
