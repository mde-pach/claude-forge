id: typescript/library/barrel-exports
description: "When a package entry point (package.json exports, main, module, types, mapped from dist/ to src/) re-exports a module's names by list (export { a, b } from \"./m\"), a new export of that module is added to the list, or is not exported. Modules re-exported with export * and modules the entry point does not name are not checked."
scope: {language: typescript, files: ["!**/*.test.*", "!**/*.spec.*", "!**/__tests__/**", "!e2e/**", "!**/*.d.ts"]}
enforce:
  - target: check
    stage: lint
    run: "forge_helper bun public_api.mjs barrel"
    changed_run: "forge_helper bun public_api.mjs barrel {files}"
examples:
  match:
    - head:
        package.json: "{\n  \"name\": \"acme\",\n  \"version\": \"1.2.0\",\n  \"exports\": { \".\": { \"types\": \"./dist/index.d.ts\", \"import\": \"./dist/index.js\" } }\n}\n"
        src/index.ts: "export { parse, type ParseOptions } from \"./parse.js\";\n"
        src/parse.ts: "export interface ParseOptions {\n  strict?: boolean;\n}\n\nexport function parse(text: string, options: ParseOptions = {}): unknown {\n  return JSON.parse(text);\n}\n"
      files:
        src/parse.ts: "export interface ParseOptions {\n  strict?: boolean;\n}\n\nexport function parse(text: string, options: ParseOptions = {}): unknown {\n  return JSON.parse(text);\n}\n\nexport function parseStream(chunks: string[]): unknown {\n  return parse(chunks.join(\"\"));\n}\n"
  no_match:
    - head:
        package.json: "{\n  \"name\": \"acme\",\n  \"version\": \"1.2.0\",\n  \"exports\": { \".\": { \"types\": \"./dist/index.d.ts\", \"import\": \"./dist/index.js\" } }\n}\n"
        src/index.ts: "export { parse, type ParseOptions } from \"./parse.js\";\n"
        src/parse.ts: "export interface ParseOptions {\n  strict?: boolean;\n}\n\nexport function parse(text: string, options: ParseOptions = {}): unknown {\n  return JSON.parse(text);\n}\n"
      files:
        src/index.ts: "export { parse, parseStream, type ParseOptions } from \"./parse.js\";\n"
        src/parse.ts: "export interface ParseOptions {\n  strict?: boolean;\n}\n\nexport function parse(text: string, options: ParseOptions = {}): unknown {\n  return JSON.parse(text);\n}\n\nexport function parseStream(chunks: string[]): unknown {\n  return parse(chunks.join(\"\"));\n}\n"
    - head:
        package.json: "{\n  \"name\": \"acme\",\n  \"version\": \"1.2.0\",\n  \"exports\": \"./dist/index.js\",\n  \"types\": \"./dist/index.d.ts\"\n}\n"
        src/index.ts: "export * from \"./parse.js\";\n"
        src/parse.ts: "export function parse(text: string): unknown {\n  return JSON.parse(text);\n}\n"
      files:
        src/parse.ts: "export function parse(text: string): unknown {\n  return JSON.parse(text);\n}\n\nexport function parseStream(chunks: string[]): unknown {\n  return parse(chunks.join(\"\"));\n}\n"
