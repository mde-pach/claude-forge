id: typescript/better-auth/no-csrf-disable
description: "No disableCSRFCheck: true and no useSecureCookies: false in betterAuth({...}) (also under an import alias): they turn off the CSRF / origin check and the Secure cookie flag."
scope: {language: typescript}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      kind: pair
      all:
        - any:
            - all:
                - has: {field: key, regex: "^[\"']?disableCSRFCheck[\"']?$"}
                - has: {field: value, kind: "true"}
            - all:
                - has: {field: key, regex: "^[\"']?useSecureCookies[\"']?$"}
                - has: {field: value, kind: "false"}
        - inside:
            kind: arguments
            stopBy: end
            inside:
              kind: call_expression
              stopBy: neighbor
              all:
                - has: {field: function, kind: identifier, pattern: $B}
                - inside:
                    kind: program
                    stopBy: end
                    has:
                      kind: import_statement
                      all:
                        - has: {field: source, regex: "^[\"']better-auth[\"']$"}
                        - has:
                            stopBy: end
                            kind: import_specifier
                            any:
                              - all: [{has: {field: name, regex: "^betterAuth$"}}, {has: {field: alias, pattern: $B}}]
                              - all: [{has: {field: name, regex: "^betterAuth$", pattern: $B}}, {not: {has: {field: alias, kind: identifier}}}]
examples:
  match:
    - "import { betterAuth } from \"better-auth\";\n\nexport const auth = betterAuth({ advanced: { disableCSRFCheck: true } });\n"
    - "import { betterAuth as createAuth } from \"better-auth\";\n\nexport const auth = createAuth({ baseURL: \"https://app.example.com\", advanced: { useSecureCookies: false } });\n"
  no_match:
    - "import { betterAuth } from \"better-auth\";\n\nexport const auth = betterAuth({ advanced: { useSecureCookies: true, disableCSRFCheck: false } });\n"
    - "import { betterAuth } from \"./auth-factory\";\n\nexport const auth = betterAuth({ advanced: { disableCSRFCheck: true } });\n"
