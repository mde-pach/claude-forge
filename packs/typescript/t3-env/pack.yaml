id: typescript/t3-env
description: Environment variables validated with t3-env (createEnv).
level: project
detect:
  deps_any:
    - {ecosystem: npm, name: "@t3-oss/env-core"}
    - {ecosystem: npm, name: "@t3-oss/env-nextjs"}
    - {ecosystem: npm, name: "@t3-oss/env-nuxt"}
context:
  - text: |
      Environment variables are read through the validated `env` object of the env module (`createEnv`), never `process.env` elsewhere; tool config files (`*.config.*`) are exempt.
