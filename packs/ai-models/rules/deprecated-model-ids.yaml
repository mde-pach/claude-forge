id: ai-models/deprecated-model-ids
description: "Advice, once per turn at Stop: a quoted model id on an added line that its provider deprecated (still served until its retirement date: claude-sonnet-4-5, gpt-5, o3, gpt-image-1.5, ...) is reported with its date and replacement, and a dated Claude id that is no published model (claude-opus-5-5-20260401) with the advice to use the alias. Ids as of 2026-10-26, from the providers' deprecation pages; an id published later than that is reported too, hence advice."
scope: {language: any, files: ["!.claude/skills/forge-project/**"]}
enforce:
  - target: check
    stage: lint
    # models.tsv: advise
    run: 'forge_advise forge_model_ids ''claude-sonnet-4-5|2026-11-30|claude-sonnet-5-5;claude-sonnet-4-5-20250929|2026-11-30|claude-sonnet-5-5;claude-mythos-preview|-|claude-mythos-5-1;gpt-image-1-mini|2026-12-01|gpt-image-2.5-sunburst or gpt-image-2.5-flare;gpt-image-1.5|2026-12-01|gpt-image-2.5-sunburst or gpt-image-2.5-flare;gpt-image-1.5-2025-12-16|2026-12-01|gpt-image-2.5-sunburst or gpt-image-2.5-flare;chatgpt-image-latest|2026-12-01|gpt-image-2.5-sunburst or gpt-image-2.5-flare;gpt-5|2026-12-11|gpt-5.6-sol;gpt-5-2025-08-07|2026-12-11|gpt-5.6-sol;gpt-5-pro|2026-12-11|gpt-5.6-sol;gpt-5-pro-2025-10-06|2026-12-11|gpt-5.6-sol;o3|2026-12-11|gpt-5.6-sol;o3-2025-04-16|2026-12-11|gpt-5.6-sol;o3-pro|2026-12-11|gpt-5.6-sol;o3-pro-2025-06-10|2026-12-11|gpt-5.6-sol;gpt-5-mini|2026-12-11|gpt-5.6-terra;gpt-5-mini-2025-08-07|2026-12-11|gpt-5.6-terra;gpt-5-nano|2026-12-11|gpt-5.6-luna;gpt-5-nano-2025-08-07|2026-12-11|gpt-5.6-luna;gpt-4o-2024-08-06|2027-01-14|gpt-6-luna;gpt-4o-2024-11-20|2027-01-14|gpt-6-luna;gpt-4o-mini-2024-07-18|2027-01-14|gpt-6-luna;gpt-4.1-2025-04-14|2027-01-14|gpt-6-luna;gpt-4.1-mini-2025-04-14|2027-01-14|gpt-6-luna;gpt-5.1|2027-04-01|gpt-6-sol;gpt-5.1-2025-11-13|2027-04-01|gpt-6-sol;gpt-5.3-codex|2027-04-01|gpt-6-sol;gpt-5.4-nano|2027-04-01|gpt-6-luna;gpt-5.4-nano-2026-03-17|2027-04-01|gpt-6-luna'' ''claude-fable-5-1 claude-mythos-5-1 claude-fable-5 claude-mythos-5 claude-opus-5-5 claude-opus-5 claude-opus-4-8 claude-opus-4-7 claude-opus-4-6 claude-sonnet-5-5 claude-sonnet-5 claude-sonnet-4-6 claude-haiku-5-5 claude-haiku-4-5 claude-haiku-4-5-20251001 claude-opus-4-5 claude-opus-4-5-20251101 claude-sonnet-4-5 claude-sonnet-4-5-20250929 claude-mythos-preview claude-opus-4-1-20250805 claude-opus-4-1 claude-opus-4-20250514 claude-opus-4-0 claude-sonnet-4-20250514 claude-sonnet-4-0 claude-3-7-sonnet-20250219 claude-3-7-sonnet-latest claude-3-5-haiku-20241022 claude-3-5-haiku-latest claude-3-haiku-20240307 claude-3-opus-20240229 claude-3-opus-latest claude-3-5-sonnet-20241022 claude-3-5-sonnet-20240620 claude-3-5-sonnet-latest claude-3-sonnet-20240229 claude-2.1 claude-2.0 claude-1.0 claude-1.1 claude-1.2 claude-1.3 claude-instant-1.0 claude-instant-1.1 claude-instant-1.2'''
examples:
  match:
    - files: {app/llm.py: "reply = client.messages.create(model=\"claude-sonnet-4-5-20250929\", max_tokens=1024, messages=msgs)\n"}
    - files: {src/agent.ts: "const agent = new Agent({ model: 'openai:gpt-5-mini' });\n"}
    - files: {app/llm.py: "MODEL = \"claude-opus-5-5-20260401\"\n"}
  no_match:
    - files: {app/llm.py: "reply = client.messages.create(model=\"claude-opus-5-5\", max_tokens=1024, messages=msgs)\n"}
    - files: {app/llm.py: "MODEL = \"claude-haiku-4-5-20251001\"\n"}
    - files: {app/llm.py: "BEDROCK_MODEL = \"anthropic.claude-sonnet-4-5-20250929-v1:0\"\n"}
    - head: {app/llm.py: "MODEL = \"claude-sonnet-4-5\"\n"}
      files: {app/llm.py: "MODEL = \"claude-sonnet-4-5\"\nTIMEOUT = 30\n"}
