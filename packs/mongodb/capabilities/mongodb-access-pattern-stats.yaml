# Procedure after mongodb-schema-design, https://github.com/mongodb/agent-skills
# (skills/mongodb-schema-design), Apache License 2.0: measuring the data and its workload
# before changing a schema.
id: mongodb/mongodb-access-pattern-stats
description: Measuring a MongoDB database's document sizes, array lengths and workload before changing its schema.
relevant:
  - The task chooses between embedding and referencing MongoDB data, or splits or merges collections.
  - The task investigates MongoDB documents that grow too large or queries that got slow as the data grew.
deliver: on-demand
text: |
  Base a schema change on measurements, read-only. With the MongoDB MCP server connected, use its tools (`collection-schema`, `aggregate`, `db-stats`, `find`, `count`); otherwise run the same in `mongosh "<connection string>"`.

  1. Current shape: `collection-schema` on each collection involved.
  2. Sizes: `db.<coll>.aggregate([{ $project: { size: { $bsonSize: "$$ROOT" }, n: { $size: { $ifNull: ["$<array>", []] } } } }, { $group: { _id: null, avg: { $avg: "$size" }, max: { $max: "$size" }, maxN: { $max: "$n" } } }])`: the largest documents and the longest arrays, compared to the 16 MB limit.
  3. Volume: `db-stats` (`db.stats()`) and `db.<coll>.countDocuments()` per collection.
  4. Workload: `db.serverStatus().opcounters` for the ratio of reads to writes; on Atlas, the Query Insights page or slow query logs (M10 and up) for the queries that run most often and slowest; else `db.setProfilingLevel(1, { slowms: 100 })` on a non-production database, then `db.system.profile.find().sort({ millis: -1 }).limit(10)`, and `db.setProfilingLevel(0)` after.
  5. Design for the queries that are both frequent and slow, then run steps 2 and 4 again after the change.
examples:
  selected:
    - "Should we embed order line items inside the order documents or keep a separate collection? Figure out what fits our data."
    - "Our user documents keep growing because of the activity array; redesign the schema."
  not_selected:
    - "Write a query that lists the ten newest orders."
    - "Add a createdAt field to the Mongoose user model."
