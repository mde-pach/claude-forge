id: fastapi/no-on-event
description: No @app.on_event. Use the lifespan context manager.
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule: {kind: decorator, has: {pattern: "$APP.on_event($$$)"}}
examples:
  match: ["@app.on_event(\"startup\")\nasync def start():\n    pass\n", "@router.on_event(\"shutdown\")\ndef stop():\n    pass\n"]
  no_match: ["app = FastAPI(lifespan=lifespan)\n", "@app.get(\"/\")\ndef root():\n    pass\n"]
