id: terraform/ephemeral-secret
description: "A secret read through data \"aws_secretsmanager_secret_version\" is stored in clear text in the state. Where the argument that consumes it has a write-only form (password_wo, secret_string_wo; Terraform 1.11+, OpenTofu 1.11+), read it with ephemeral \"aws_secretsmanager_secret_version\" instead, so it never reaches the state."
scope: {language: any, files: ["**/*.tf", "**/*.tofu"]}
enforce:
  - target: grep
    mode: advise
    pattern: "^[[:space:]]*data[[:space:]]+\"aws_secretsmanager_secret_version\""
examples:
  match:
    - "data \"aws_secretsmanager_secret_version\" \"db\" {\n  secret_id = aws_secretsmanager_secret.db.id\n}\n"
  no_match:
    - "ephemeral \"aws_secretsmanager_secret_version\" \"db\" {\n  secret_id = aws_secretsmanager_secret.db.id\n}\n"
    - "data \"aws_secretsmanager_secret\" \"db\" {\n  name = \"db\"\n}\n"
