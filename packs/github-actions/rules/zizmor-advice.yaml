id: github-actions/zizmor-advice
description: "zizmor's adhoc-packages (packages installed in run: steps outside a lock file), unpinned-tools and superfluous-actions (actions that duplicate what the runner image provides) audits."
scope: {language: any, files: [".github/workflows/*.yml", ".github/workflows/*.yaml", ".github/actions/**/action.yml", ".github/actions/**/action.yaml", "action.yml", "action.yaml"]}
enforce:
  - target: check
    stage: lint
    run: "forge_advise forge_zizmor adhoc-packages unpinned-tools superfluous-actions"
    when_changed: [".github/workflows/**", ".github/actions/**", "action.yml", "action.yaml"]
examples:
  match:
    - files: {.github/workflows/lint.yml: "name: lint\non: push\npermissions: {}\njobs:\n  lint:\n    runs-on: ubuntu-latest\n    permissions: {}\n    steps:\n      - run: npm install -g prettier\n"}
  no_match:
    - files: {.github/workflows/lint.yml: "name: lint\non: push\npermissions: {}\njobs:\n  lint:\n    runs-on: ubuntu-latest\n    permissions: {}\n    steps:\n      - run: npm ci\n"}
