id: secrets/no-credential-files
description: "No keystore, private key or auth file is committed (*.p12, *.pfx, *.jks, *.keystore, *.key, id_rsa, id_ecdsa, id_ed25519, .pypirc, .netrc, .git-credentials), and no .npmrc line sets _authToken, _auth or _password to a literal value (a ${VAR} reference is fine)."
scope: {language: any}
enforce:
  - target: check
    stage: lint
    run: forge_credential_files
    when_changed: ["**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/*.key", "**/id_rsa", "**/id_ecdsa", "**/id_ed25519", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/.npmrc"]
examples:
  match:
    - files: {certs/server.key: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7\n-----END PRIVATE KEY-----\n"}
    - files: {deploy/id_ed25519: "-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQ\n-----END OPENSSH PRIVATE KEY-----\n"}
    - files: {.pypirc: "[pypi]\nusername = __token__\npassword = pypi-AgEIcHlwaS5vcmc\n"}
    - files: {.npmrc: "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=npm_aB3dE5fG7hI9jK1lM3nO5pQ7rS9tU1vW3xY5\n"}
  no_match:
    - files: {deploy/id_ed25519.pub: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOq deploy@ci\n"}
    - files: {.npmrc: "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n"}
    - files: {src/keys.ts: "export const keys = [\"a\", \"b\"];\n"}
