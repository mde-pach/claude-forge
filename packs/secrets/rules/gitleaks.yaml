id: secrets/gitleaks
description: "Added lines hold no secret gitleaks recognises (its provider rules, without generic-api-key, plus LangSmith and Pinecone keys), in any file; inline gitleaks:allow, .gitleaksignore and a project .gitleaks.toml do not apply."
scope: {language: any}
enforce:
  - target: check
    stage: lint
    run: forge_gitleaks
examples:
  match:
    - files: {config/settings.yaml: "llm:\n  provider: anthropic\n  api_key: sk-ant-api03-u8jzPde0IgxLd6GncfBAepfJBd0Kh8oOOL8dKLzdocJ2isAjIhKtJ0RlgLKOmxgJTeKdNnFRIBXuDL7DxtpYlSXpfKtHFAA\n"}
    - files: {notebooks/eval.py: "import os\n\nos.environ[\"LANGSMITH_API_KEY\"] = \"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\"  # gitleaks:allow\n"}
    - head: {.gitleaksignore: "deploy/.envrc:aws-access-token:2\n"}
      files: {deploy/.envrc: "export AWS_REGION=eu-west-1\nexport AWS_ACCESS_KEY_ID=AKIAZ7QW3RTYUIOPLKJH\n"}
  no_match:
    - files: {config/settings.yaml: "llm:\n  provider: anthropic\n  api_key: ${ANTHROPIC_API_KEY}\n"}
    - files: {app/settings.py: "API_KEY = \"not-a-real-key-just-a-placeholder\"\npassword = \"correct horse battery staple\"\n"}
    - head: {old.env.example: "AWS_ACCESS_KEY_ID=AKIAZ7QW3RTYUIOPLKJH\n"}
      files: {old.env.example: "AWS_ACCESS_KEY_ID=AKIAZ7QW3RTYUIOPLKJH\nAWS_REGION=eu-west-1\n"}
