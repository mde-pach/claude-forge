id: secrets/env-not-committed
description: "No dotenv file (file role @env-files: .env, .env.*) is tracked or added; templates (@env-template: .env.example, .env.sample, .env.template, .env.dist) are fine, and the .env next to a template is git-ignored."
scope: {language: any}
enforce:
  - target: check
    stage: lint
    run: forge_env_files
    when_changed: ["@env-files", "@env-template", "**/.gitignore"]
examples:
  match:
    - files: {.env: "POSTGRES_PASSWORD=hunter2\n"}
    - files: {api/.env.local: "API_KEY=abc\n"}
    - files: {.env.example: "POSTGRES_PASSWORD=\n"}
    - head: {.env.example: "POSTGRES_PASSWORD=\n", .gitignore: ".env\n"}
      files: {.gitignore: "dist/\n"}
  no_match:
    - files: {.env.example: "POSTGRES_PASSWORD=\n", .gitignore: ".env\n"}
    - files: {api/.env.dist: "API_KEY=\n", .gitignore: ".env*\n!.env.dist\n"}
    - files: {docs/env.md: "Copy .env.example to .env\n"}
