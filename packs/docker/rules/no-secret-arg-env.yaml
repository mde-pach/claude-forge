id: docker/no-secret-arg-env
description: "No ARG or ENV named like a secret (PASSWORD, SECRET, TOKEN, API_KEY, PRIVATE_KEY, CREDENTIALS); they stay in the image history. *_FILE names are fine; use RUN --mount=type=secret."
scope: {language: any, files: ["@dockerfile"]}
enforce:
  - {target: check, stage: lint, run: "forge_docker_secrets", when_changed: ["@dockerfile"]}
examples:
  match:
    - files: {Dockerfile: "FROM node:24-slim\nARG NPM_TOKEN\nRUN npm ci\nUSER node\n", .dockerignore: ".env*\n.git\n"}
    - files: {Dockerfile: "FROM python:3.13-slim\nENV STRIPE_API_KEY=sk_test_x DEBUG=0\nUSER app\n", .dockerignore: ".env*\n.git\n"}
  no_match:
    - files: {Dockerfile: "FROM node:24-slim\nRUN --mount=type=secret,id=npm_token NPM_TOKEN=$(cat /run/secrets/npm_token) npm ci\nENV DB_PASSWORD_FILE=/run/secrets/db_password\nUSER node\n", .dockerignore: ".env*\n.git\n"}
