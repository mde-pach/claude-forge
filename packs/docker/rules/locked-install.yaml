id: docker/locked-install
description: "Images install dependencies from the lock file (npm ci, bun install --frozen-lockfile, uv sync --locked, pnpm install --frozen-lockfile, yarn --immutable) and never add packages."
scope: {language: any, files: ["@dockerfile"]}
enforce:
  - {target: check, stage: lint, run: "forge_docker_locked", when_changed: ["@dockerfile"]}
examples:
  match:
    - files: {Dockerfile: "FROM node:24-slim\nWORKDIR /app\nCOPY . .\nRUN npm install\nUSER node\n", .dockerignore: ".env*\n.git\n"}
    - files: {Dockerfile: "FROM oven/bun:1.3\nWORKDIR /app\nCOPY . .\nRUN bun install --production \\\n    && bun run build\nUSER bun\n", .dockerignore: ".env*\n.git\n"}
    - files: {Dockerfile: "FROM python:3.13-slim\nWORKDIR /app\nCOPY . .\nRUN pip install uv; uv sync --no-dev\nUSER app\n", .dockerignore: ".env*\n.git\n"}
  no_match:
    - files: {Dockerfile: "FROM oven/bun:1.3\nWORKDIR /app\nCOPY package.json bun.lock ./\nRUN --mount=type=cache,target=/root/.bun/install/cache bun install --frozen-lockfile --production\nUSER bun\n", .dockerignore: ".env*\n.git\n"}
    - files: {Dockerfile: "FROM node:24-slim\nRUN npm install -g pnpm@10 && pnpm install --frozen-lockfile\nUSER node\n", .dockerignore: ".env*\n.git\n"}
