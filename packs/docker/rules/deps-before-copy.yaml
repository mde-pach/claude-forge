id: docker/deps-before-copy
description: "Advice, once per turn at Stop: in a build stage, copy the manifest and lock file and install dependencies before COPY . ., so a code change does not rebuild the dependency layer."
scope: {language: any, files: ["@dockerfile"]}
enforce:
  - {target: check, stage: lint, run: "forge_advise forge_docker_copy_order", when_changed: ["@dockerfile"]}
examples:
  match:
    - files: {Dockerfile: "FROM node:24-slim\nWORKDIR /app\nCOPY . .\nRUN npm ci\nUSER node\n"}
    - files: {Dockerfile: "FROM python:3.13-slim\nWORKDIR /app\nCOPY --chown=app:app ./ /app/\nRUN pip install --no-cache-dir -r requirements.txt\nUSER app\n"}
  no_match:
    - files: {Dockerfile: "FROM node:24-slim\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\nUSER node\n"}
    - files: {Dockerfile: "FROM node:24-slim AS build\nWORKDIR /app\nCOPY . .\nRUN npm run build\n\nFROM node:24-slim\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nRUN npm install -g serve\nUSER node\n"}
