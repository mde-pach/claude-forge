id: docker/compose/no-inline-secrets
description: "Secret-like variables under environment or build args (PASSWORD, SECRET, TOKEN, API_KEY, PRIVATE_KEY, CREDENTIALS) hold a ${VAR} reference or nothing, never a value; *_FILE variables are fine."
scope: {language: yaml, files: ["@compose"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      all:
        - inside: {stopBy: end, kind: block_mapping_pair, has: {field: key, regex: "^[\"']?(environment|args)[\"']?$"}}
        - any:
            - all:
                - kind: block_mapping_pair
                - has: {field: key, regex: "(?i)^[\"']?[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|API_?KEY|PRIVATE_KEY|CREDENTIALS)[A-Z0-9_]*[\"']?$"}
                - not: {has: {field: key, regex: "(?i)_FILE[\"']?$"}}
                - has: {field: value, regex: "^.", not: {regex: "^[\"']?\\$\\{[^}]+\\}[\"']?$"}}
            - all:
                - {any: [{kind: string_scalar}, {kind: double_quote_scalar}, {kind: single_quote_scalar}]}
                - regex: "(?i)^[\"']?[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|API_?KEY|PRIVATE_KEY|CREDENTIALS)[A-Z0-9_]*=."
                - not: {regex: "(?i)_FILE="}
                - not: {regex: "=\\$\\{[^}]+\\}[\"']?$"}
examples:
  match:
    - "services:\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_PASSWORD: hunter2\n"
    - "services:\n  api:\n    build:\n      context: .\n      args:\n        - NPM_TOKEN=abc123\n"
  no_match:
    - "services:\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}\n      POSTGRES_PASSWORD_FILE: /run/secrets/db_password\n      POSTGRES_USER: app\n"
    - "services:\n  api:\n    image: acme/api:1.4\n    environment:\n      - API_KEY=${API_KEY}\n      - LOG_LEVEL=info\n"
