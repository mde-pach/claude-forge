id: docker/compose/no-host-root-mounts
description: "No service mounts /, /etc, /root, /home or the home directory from the host."
scope: {language: yaml, files: ["**/compose*.yml", "**/compose*.yaml", "**/docker-compose*.yml", "**/docker-compose*.yaml"]}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      all:
        - inside: {stopBy: end, kind: block_mapping_pair, has: {field: key, regex: "^[\"']?(volumes)[\"']?$"}}
        - any:
            - all:
                - {any: [{kind: string_scalar}, {kind: double_quote_scalar}, {kind: single_quote_scalar}]}
                - regex: "^[\"']?(/|/etc|/root|/home|~|\\$HOME|\\$\\{HOME\\})/?:"
            - all:
                - kind: block_mapping_pair
                - has: {field: key, regex: "^[\"']?(source)[\"']?$"}
                - has: {field: value, regex: "^[\"']?(/|/etc|/root|/home|~|\\$HOME|\\$\\{HOME\\})/?[\"']?$"}
examples:
  match:
    - "services:\n  app:\n    image: alpine:3.22\n    volumes:\n      - /:/host\n"
    - "services:\n  app:\n    image: alpine:3.22\n    volumes:\n      - \"~/:/root\"\n"
    - "services:\n  app:\n    image: alpine:3.22\n    volumes:\n      - type: bind\n        source: /etc\n        target: /host-etc\n"
  no_match:
    - "services:\n  web:\n    image: nginx:1.29\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n      - /etc/localtime:/etc/localtime:ro\n"
