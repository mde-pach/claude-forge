id: sqlalchemy/no-backref
description: No relationship(backref=...). Declare both sides with back_populates.
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule:
      pattern: "relationship($$$)"
      has:
        kind: argument_list
        has: {kind: keyword_argument, has: {field: name, regex: "^backref$"}}
examples:
  match: ["posts = relationship(\"Post\", backref=\"author\")", "x = relationship(\"A\", backref=\"b\", lazy=\"selectin\")"]
  no_match: ["posts: Mapped[list[Post]] = relationship(back_populates=\"author\")"]
