id: sqlalchemy/no-raw-execute
description: No raw SQL strings in execute(). Use select() or text() with bound parameters.
scope: {language: python}
enforce:
  - target: ast-grep
    mode: forbid
    rule: {any: [{pattern: "$X.execute($S)"}, {pattern: "$X.execute($S, $$$R)"}]}
    constraints: {S: {kind: string}}
examples:
  match: ["await session.execute(\"DELETE FROM users\")", "conn.execute('SELECT 1', {})"]
  no_match: ["await session.execute(select(User))", "await session.execute(text(\"SELECT 1\"))"]
