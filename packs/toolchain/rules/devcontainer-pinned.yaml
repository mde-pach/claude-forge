id: toolchain/devcontainer-pinned
description: "devcontainer.json names an image with a version tag (or a digest), never latest or nothing, and its lifecycle commands do not pipe curl or wget into a shell."
scope: {language: any, files: [".devcontainer/devcontainer.json", ".devcontainer/**/devcontainer.json", ".devcontainer.json"]}
enforce:
  - target: grep
    mode: forbid
    pattern: "\"image\"[[:space:]]*:[[:space:]]*\"([^\"@:]*/)*[^\"@:/]+(:latest)?\"|(curl|wget)[^|\"]*\\|[[:space:]]*(sudo[[:space:]]+)?(ba|z)?sh"
examples:
  match:
    - "{\n  \"image\": \"mcr.microsoft.com/devcontainers/python\"\n}\n"
    - "{\n  \"image\": \"node:latest\"\n}\n"
    - "{\n  \"image\": \"mcr.microsoft.com/devcontainers/base:2\",\n  \"postCreateCommand\": \"curl -fsSL https://x.dev/install | bash\"\n}\n"
  no_match:
    - "{\n  \"image\": \"mcr.microsoft.com/devcontainers/python:1-3.13-bookworm\",\n  \"postCreateCommand\": \"uv sync --locked\"\n}\n"
    - "{\n  \"build\": {\"dockerfile\": \"Dockerfile\"}\n}\n"
