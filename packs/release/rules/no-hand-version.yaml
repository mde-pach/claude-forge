id: release/no-hand-version
description: "A changed package.json version or pyproject.toml [project] version, which the release tooling sets; revert it unless the change is the release itself."
scope: {language: any, files: ["**/package.json", "**/pyproject.toml"]}
enforce:
  - {target: check, stage: lint, run: "forge_advise forge_version_changed", when_changed: ["**/package.json", "**/pyproject.toml"]}
examples:
  match:
    - head: {.changeset/config.json: "{\"baseBranch\": \"main\"}\n", package.json: "{\n  \"name\": \"@acme/sdk\",\n  \"version\": \"1.4.0\"\n}\n"}
      files: {package.json: "{\n  \"name\": \"@acme/sdk\",\n  \"version\": \"1.5.0\"\n}\n"}
    - head: {towncrier.toml: "[tool.towncrier]\ndirectory = \"changelog.d\"\n", pyproject.toml: "[project]\nname = \"acme\"\nversion = \"2.0.1\"\n"}
      files: {pyproject.toml: "[project]\nname = \"acme\"\nversion = \"2.1.0\"\n"}
  no_match:
    - head: {.changeset/config.json: "{\"baseBranch\": \"main\"}\n", package.json: "{\n  \"name\": \"@acme/sdk\",\n  \"version\": \"1.4.0\",\n  \"dependencies\": {\"zod\": \"4.1.0\"}\n}\n"}
      files: {package.json: "{\n  \"name\": \"@acme/sdk\",\n  \"version\": \"1.4.0\",\n  \"dependencies\": {\"zod\": \"4.1.12\", \"pkg\": {\"version\": \"2\"}}\n}\n"}
    - files: {package.json: "{\n  \"name\": \"@acme/sdk\",\n  \"version\": \"0.1.0\"\n}\n"}
