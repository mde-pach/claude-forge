id: android
description: Android applications and libraries built with Gradle and the Android Gradle plugin.
level: project
detect:
  files_any: ["**/src/main/AndroidManifest.xml"]
  content_any:
    - {files: ["**/build.gradle", "**/build.gradle.kts"], pattern: "com\\.android\\.(application|library)"}
    - {files: ["**/libs.versions.toml"], pattern: "id\\s*=\\s*\"com\\.android\\.(application|library)\""}
