id: git/generated-files
description: "A changed file marked generated (linguist-generated in .gitattributes, or @generated or \"Code generated ... DO NOT EDIT.\" in its first 15 lines) is regenerated from its source, not edited by hand."
scope: {language: any}
enforce:
  - target: check
    stage: lint
    run: forge_advise forge_generated_edits
examples:
  match:
    - head: {api/client.go: "// Code generated by oapi-codegen. DO NOT EDIT.\npackage api\n\nconst Version = 1\n"}
      files: {api/client.go: "// Code generated by oapi-codegen. DO NOT EDIT.\npackage api\n\nconst Version = 2\n"}
    - head: {.gitattributes: "src/gen/** linguist-generated=true\n", src/gen/routes.ts: "export const routes = [\"/\"];\n"}
      files: {src/gen/routes.ts: "export const routes = [\"/\", \"/about\"];\n"}
  no_match:
    - head: {src/routes.ts: "// Routes are generated from pages/ at build time; this file lists the extra ones.\nexport const routes = [\"/\"];\n"}
      files: {src/routes.ts: "// Routes are generated from pages/ at build time; this file lists the extra ones.\nexport const routes = [\"/\", \"/about\"];\n"}
