id: git/large-files
description: "No file over 1 MiB is added, nor taken past 1 MiB, unless Git LFS stores it (its filter attribute is lfs); lock files are exempt; a larger file is the user's decision: ask them."
scope: {language: any}
enforce:
  - target: check
    stage: lint
    run: forge_large_files 1048576
