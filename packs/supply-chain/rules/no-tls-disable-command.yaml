id: supply-chain/no-tls-disable-command
description: "Commands never turn TLS verification off: no npm / pnpm / yarn config set strict-ssl false or --strict-ssl=false, NODE_TLS_REJECT_UNAUTHORIZED=0, PYTHONHTTPSVERIFY=0, GIT_SSL_NO_VERIFY, git http.sslVerify false, pip --trusted-host / PIP_TRUSTED_HOST, uv --allow-insecure-host / UV_INSECURE_HOST. Every install would then accept an intercepted connection; install the proxy's CA certificate instead."
scope: {language: any}
enforce:
  - target: guard
    decision: deny
    command:
      - {name: [npm, pnpm, yarn], sub: [config, set, strict-ssl, 'false']}
      - {name: [npm, pnpm, yarn], sub: [config, set, 'strict-ssl=false']}
      - {flags_any: ['--strict-ssl=false', --allow-insecure-host, --trusted-host], value_flags: [--strict-ssl]}
      - {env_any: [GIT_SSL_NO_VERIFY, PIP_TRUSTED_HOST, UV_INSECURE_HOST, 'NODE_TLS_REJECT_UNAUTHORIZED=0', 'PYTHONHTTPSVERIFY=0']}
      - {name: git, option_values: {'-c': '(?i)^http\.sslverify=(false|0|no|off)$'}}
      - {name: git, sub: [config, '/(?i)^http\.sslverify$/', '/(?i)^(false|0|no|off)$/']}
      - {name: git, sub: [config, set, '/(?i)^http\.sslverify$/', '/(?i)^(false|0|no|off)$/']}
examples:
  match:
    - "npm config set strict-ssl false"
    - "npm install --strict-ssl=false"
    - "NODE_TLS_REJECT_UNAUTHORIZED=0 node app.js"
    - "export PYTHONHTTPSVERIFY=0"
    - "pip install --trusted-host pypi.org requests"
    - "uv sync --allow-insecure-host pypi.internal"
    - "git config --global http.sslVerify false"
    - "git -c http.sslVerify=false clone https://git.internal/acme/lib.git"
    - "GIT_SSL_NO_VERIFY=1 git clone https://git.internal/acme/lib.git"
  no_match:
    - "npm config set registry https://registry.npmjs.org/"
    - "git config http.sslVerify true"
    - "NODE_TLS_REJECT_UNAUTHORIZED=1 node app.js"
    - "export NODE_EXTRA_CA_CERTS=/etc/ssl/corp-ca.pem"
    - "pip install requests"
