id: supply-chain/vuln-audit
description: "A changed lock file brings in no dependency version with a known vulnerability (OSV, through osv-scanner) that its base version did not already have; osv-scanner.toml ignores do not apply. Needs api.osv.dev: offline, it is reported skipped."
scope: {language: any, files: ["**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/bun.lock", "**/bun.lockb", "**/uv.lock", "**/poetry.lock", "**/requirements*.txt", "**/Pipfile.lock", "**/pdm.lock", "**/Cargo.lock"]}
enforce:
  - target: check
    stage: lint
    run: forge_osv
examples:
  match:
    - head: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.17.21\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.21\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz\"}\n  }\n}\n"}
      files: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.17.20\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.20\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz\"}\n  }\n}\n"}
    - head: {osv-scanner.toml: "[[IgnoredVulns]]\nid = \"GHSA-29mw-wpgm-hmr9\"\nreason = \"not reachable\"\n\n[[IgnoredVulns]]\nid = \"GHSA-35jh-r3h4-6jhm\"\nreason = \"not reachable\"\n", package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.17.21\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.21\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz\"}\n  }\n}\n"}
      files: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.17.20\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.20\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz\"}\n  }\n}\n"}
    - files: {requirements-dev.txt: "requests==2.19.0\n"}
  no_match:
    - head: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.17.20\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.20\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz\"}\n  }\n}\n"}
      files: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.1\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.1\", \"dependencies\": {\"lodash\": \"4.17.20\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.20\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz\"}\n  }\n}\n"}
    - head: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.17.20\"}},\n    \"node_modules/lodash\": {\"version\": \"4.17.20\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.17.20.tgz\"}\n  }\n}\n"}
      files: {package-lock.json: "{\n  \"name\": \"app\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 3,\n  \"requires\": true,\n  \"packages\": {\n    \"\": {\"name\": \"app\", \"version\": \"1.0.0\", \"dependencies\": {\"lodash\": \"4.18.1\"}},\n    \"node_modules/lodash\": {\"version\": \"4.18.1\", \"resolved\": \"https://registry.npmjs.org/lodash/-/lodash-4.18.1.tgz\"}\n  }\n}\n"}
