id: supply-chain/audit-ignore-ratchet
description: "No new advisory ids (GHSA-…, CVE-…, PYSEC-…, RUSTSEC-…) in vulnerability-audit ignore lists (osv-scanner.toml, pnpm auditConfig, .nsprc, audit-ci, .trivyignore, .grype.yaml, --ignore-vuln in CI); a changed file may not have more than it had. Upgrade the dependency instead; an accepted ignore goes through forge.yaml."
scope: {language: any, files: ["**/osv-scanner.toml", "pnpm-workspace.yaml", "**/package.json", ".nsprc", "audit-ci.json", "audit-ci.jsonc", ".trivyignore", ".grype.yaml", ".github/workflows/**", ".gitlab-ci.yml", "Makefile"]}
enforce:
  - target: grep
    mode: no-increase
    pattern: "(GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}|CVE-[0-9]{4}-[0-9]{4,}|PYSEC-[0-9]{4}-[0-9]+|RUSTSEC-[0-9]{4}-[0-9]{4})"
examples:
  match:
    - "[[IgnoredVulns]]\nid = \"GHSA-c2qf-rxjj-qqgw\"\nreason = \"not reachable\"\n"
    - "CVE-2026-12345\n"
    - "      - run: uv run pip-audit --ignore-vuln PYSEC-2024-48\n"
  no_match:
    - "[[PackageOverrides]]\nname = \"lodash\"\nignore = false\n"
    - "      - run: uv run pip-audit --strict\n"
