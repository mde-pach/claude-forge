[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.0-dev"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/mde-pach/claude-forge"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-home = { path = "crates/forge-home" }
forge-launcher = { path = "crates/forge-launcher" }
forge-packs = { path = "crates/forge-packs" }
forge-tools = { path = "crates/forge-tools" }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.19"
include_dir = "0.7"
indexmap = { version = "2", features = ["serde"] }
insta = "1.49"
jsonschema = { version = "0.60", default-features = false }
regex = "1.11"
rmp-serde = "1.3"
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
flate2 = "1.1"
libc = "0.2"
tar = "0.4"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
forge-helpers = { path = "crates/forge-helpers" }
forge-builtins-data = { path = "crates/forge-builtins-data" }
ast-grep-core = "0.51"
ast-grep-language = { version = "0.51", default-features = false }
globset = "0.4"
nodejs-semver = "7"
saphyr = "0.3"
forge-engine = { path = "crates/forge-engine" }
forge-detect = { path = "crates/forge-detect" }
forge-render = { path = "crates/forge-render" }
forge-guard = { path = "crates/forge-guard" }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"

# Dependencies optimised in debug builds: the tests load every pack, which is slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
