name: Docs

# Publishes the site after every CI run on main. The specification pages are
# the test files of that commit and the JUnit results of that run; the pack
# pages come from packs/. Nothing is written by hand twice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # last-updated dates
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Results of the CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: test-results-*
          merge-multiple: true
          path: test-results/
      - name: Results of a fresh run (manual dispatch)
        if: github.event_name != 'workflow_run'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q dash busybox
          curl -LsSf https://astral.sh/uv/install.sh | sh && ~/.local/bin/uv tool install ruff
          PATH="$HOME/.local/bin:$PATH" bun run test:report || true
      - name: Run metadata
        run: |
          mkdir -p test-results
          printf '{"sha":"%s","runUrl":"%s","date":"%s"}\n' \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > test-results/meta.json
      - uses: actions/configure-pages@v5
      - run: bun run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
