name: Upstream drift

# Tests that depend on the outside world, weekly instead of on every pull request: the
# newest releases of the tools Forge drives (a newer minor needs its adapter extended), the
# real downloads of uv and the pinned tools, and the pack examples run with the real pinned
# tools. A failure opens (or comments on) one issue instead of blocking anyone.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  drift:
    name: upstream (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - name: Newest releases against the adapters
        if: runner.os == 'Linux'
        env:
          FORGE_TEST_UPSTREAM: "1"
        run: cargo test --locked -p forge-check --test upstream
      - name: Real downloads of uv and the pinned tools
        if: ${{ !cancelled() }}
        env:
          FORGE_TEST_NETWORK: "1"
          FORGE_TEST_NETWORK_ALL: "1"
        run: cargo test --locked -p forge-tools --test network
      - name: Pack examples with the real pinned tools
        if: ${{ !cancelled() }}
        env:
          FORGE_TEST_INSTALL_TOOLS: "1"
        run: cargo test --locked -p forge-builtins-code -p forge-builtins-data -p forge-builtins-infra

  report:
    name: open an issue on failure
    needs: drift
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the drift issue
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream drift: the weekly checks failed"
          body="The scheduled upstream checks failed: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
