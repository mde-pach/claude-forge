name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v6
      - name: Shells for the guard matrix (dash, BusyBox)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q dash busybox
      - name: ruff on PATH (used by the hook and check.sh specs)
        run: |
          uv tool install ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Biome (format and lint of the TypeScript) and shellcheck (the generated scripts' templates); the same on both systems
      - name: Lint
        if: runner.os == 'Linux'
        run: bun run lint
      # The spec run: its JUnit report (test-results/<platform>.xml) is what the docs show.
      - run: bun run test:report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: error

  # The adapters' real-binary matrix (§16.5): every release each adapter is proven on,
  # installed into one shared store under a disk budget, removed when done.
  adapter-matrix:
    name: adapter matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - name: The version matrix on real releases
        env:
          FORGE_ADAPTER_MATRIX: "1"
        run: bun test --timeout 900000 tests/spec/16-2-adapter-matrix.test.ts

  docs:
    name: docs build (with this run's results)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results/
      - run: bun run docs:build
