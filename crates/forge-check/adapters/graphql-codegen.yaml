# graphql-codegen (@graphql-codegen/cli), the project's own (§16). What changed between its
# releases, for what Forge asks of it (`graphql-codegen --check`, typescript/graphql-codegen/up-to-date):
#
# - 2.11.0 added `--check` (packages/graphql-codegen-cli/CHANGELOG.md, 2.11.0, fd6be805b:
#   "feat(cli): add a dry-run mode with `--check` cli flag"): exit 1 and `The following stale
#   files were detected:` with the files, exit 0 when up to date. Before it the flag is ignored
#   silently and the run WRITES the outputs (verified on 2.9.1 and 2.10.0: exit 0, files
#   regenerated): the check must not run there, so the range before 2.11.0 cannot.
# - The oldest covered release is 2.0.0 (the 2.x line is where `--check` appears; 1.x is
#   not covered). Every later major (3, 4, 5, 6, 7) runs `--check` the same way (verified
#   3.3.1, 5.0.7, 6.3.1, 7.4.6).
# - `--version` prints `unknown` up to 7.1.0 and the version from 7.1.1 (CHANGELOG.md, 7.1.1:
#   "Fix --version flag"; verified 2.x-7.1.0 print `unknown`, 7.1.1 prints `7.1.1`). Before
#   7.1.1 forge_tool_version cannot read the version from the binary (see the notes: the
#   engine needs another source, the package's package.json).
# - No usage-error signature: the CLI's yargs is not strict, an unknown option is ignored
#   (`--definitely-not-an-option` alone exits 0 and generates; with `--check` it exits as
#   `--check` does). usage is null.

tool: "graphql-codegen"
verified: "7.4.6"
package: "@graphql-codegen/cli"
usage: null
ranges:
  - from: "2.0.0"
    to: "2.11.0"
    source: "packages/graphql-codegen-cli/CHANGELOG.md 2.11.0 (fd6be805b): `--check` added; before, it is ignored and the outputs are written"
    ops:
      "codegen-check": null
  - from: "2.11.0"
    source: "packages/graphql-codegen-cli/CHANGELOG.md 2.11.0 (fd6be805b): dry-run mode with `--check`"
    ops:
      "codegen-check": "--check"
