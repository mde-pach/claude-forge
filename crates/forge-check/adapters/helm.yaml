# Helm, from PATH (§16). What Forge asks of it (kubernetes/helm/lint, forge_helm: `helm lint
# --strict <chart>`, then `helm template forge <chart>` piped to kubeconform):
#
# - 3.0.0 is the oldest covered release: Helm 3 takes the release name as `template`'s first
#   argument (`helm template [NAME] [CHART]`; Helm 2's `template` took the chart only, the name
#   was `--name`/`-n`: Helm v3.0.0 release notes, "The changing of the `-n` flag from aliasing
#   `name` to aliasing `--namespace`"; helm.sh/docs/topics/v2_v3_migration). Helm 2 is not
#   covered.
# - Helm 4 (v4.0.0 release notes: "backward incompatible changes including to the flags and
#   output of the Helm CLI") changed neither invocation: `lint --strict` and `template forge`
#   print and exit the same on 3.6.0, 3.22.1, 4.0.0, 4.3.1 (Helm 4 logs a missing `required`
#   value during lint as `level=WARN msg="missing required value"` where Helm 3 printed
#   `[INFO] Missing required value`; neither fails the lint). One range.
# - Helm has no `--version` (cobra: `Error: unknown flag: --version`): `helm version --short`
#   prints `v4.3.1+gc0d08d0`.
# - Exit statuses: lint 0 / 1 (`[ERROR] ...` / `[WARNING] ...` lines, `Error: 1 chart(s)
#   linted, 1 chart(s) failed`); template 0 / 1 (`Error: execution error at (...)`); usage
#   errors 1, `Error: unknown flag: --x` on stderr (cobra).

tool: "helm"
verified: "4.3.1"
runner: path
version_args: "version --short"
usage: {exit: [1], pattern: "^Error: (unknown (shorthand )?flag|invalid argument .+ flag|flag needs an argument)"}
ranges:
  - from: "3.0.0"
    source: "github.com/helm/helm/releases/tag/v3.0.0 (template NAME CHART; -n is --namespace); v4.0.0 release notes (no change to lint/template invocations, verified)"
    ops:
      "lint": "lint --strict"
      "template": "template forge"
