# pytest, the project's own (§16). What changed between its releases, for what Forge asks of it
# (python/pytest/run: `pytest -q`, `pytest -q --testmon`, `pytest -q <files>`):
#
# - 7.0.0 made `--version` write to stdout (changelog.rst, pytest 7.0.0: "#8246: `--version`
#   now writes version information to `stdout` rather than `stderr`"). The engine reads the
#   version from stdout (forge_tool_version_ask: `--version 2>/dev/null`), so 6.x and older
#   cannot say their version to Forge: 7.0.0 is the oldest covered release. (`-q`, file
#   arguments and exit status 4 for usage errors are older: changelog 3.8.0, #3913 "Pytest now
#   returns with correct exit code (EXIT_USAGEERROR, 4) when called with unknown arguments".)
# - Nothing Forge invokes changed since: `-q`, `-q --testmon`, `-q <files>` behave the same on
#   7.0.0, 7.4.4, 8.0.0, 9.0.0, 9.2.0 (9.0.0 #13716 made `x.py[a]` a usage error; 9.0.0
#   #13574 `--version` no longer loads plugins: neither changes Forge's calls).
# - `--testmon` is pytest-testmon's (a plugin, its own release line: 2.2.0 requires
#   pytest>=5,<10). Without the plugin, `--testmon` is an unknown option: a usage error, so the
#   check is skipped, not failed.
# - Exit statuses: 0 passed; 1 failed tests; 5 no tests collected; 4 usage error (unknown option:
#   `ERROR: usage: ...`; on 7.x with pluggy >= 1.5 the same error is printed as
#   `UsageError: usage: ...` after a PluggyTeardownRaisedWarning) and also 4 for a missing file
#   argument (`ERROR: file or directory not found: x.py`), which the ERE deliberately does not
#   match.

tool: "pytest"
verified: "9.2.0"
usage: {exit: [4], pattern: "^(ERROR|UsageError): usage: "}
ranges:
  - from: "7.0.0"
    source: "docs.pytest.org/en/stable/changelog.html pytest 7.0.0 (#8246: --version writes to stdout)"
    ops:
      "test": "-q"
      "test-changed": "-q --testmon"
      "test-files": "-q"
