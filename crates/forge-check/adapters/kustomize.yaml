# kustomize, from PATH (§16), or kubectl's embedded copy: forge_kustomize (tools.sh) runs
# `kustomize <args>` when kustomize is on PATH, else `kubectl kustomize <args>`. As an adapter
# pair: rules name `kustomize`; `pick` (proposed `forge_kustomize_bin`: prints `kustomize` when
# forge_on_path kustomize, else `kubectl`) selects this adapter or kubectl.ts, which give the
# same operation (`build <dir>` here, `kustomize <dir>` there).
#
# No check calls forge_kustomize today (kubernetes/kustomize/no-deprecated-fields is a pattern
# rule); `build` is the one invocation the function exists for (`kustomize build <dir>`,
# kubectl CHANGELOG-1.14: "`kubectl kustomize <somedir>` has the same effect as `kustomize
# build <somedir>`").
#
# - 4.0.0 is the oldest covered release: the major kubectl embeds from 1.21 (kubectl's copy
#   jumped from v2.0.3 to v4.0.5, CHANGELOG-1.21 "Kustomize Updates in Kubectl"), so both
#   binaries render with kustomize >= 4. v3 builds the same way but is not covered (by choice;
#   no darwin_arm64 build before 4.2.0 to verify it).
# - 5.0.0 (kustomize/v5.0.0 release notes; kubectl 1.27 CHANGELOG "a new major release of
#   kustomize, so there are a few backwards-incompatible changes") changed the kustomization
#   fields, not `build`: same invocation, verified on 4.2.0, 4.5.7, 5.0.0, 5.8.3. 5.x later
#   prints `# Warning: 'commonLabels' is deprecated...` on stderr (5.8.3; not 5.0.0), exit 0.
# - No `--version`: `kustomize version` prints `v5.8.3` (5.x) or `{Version:kustomize/v4.5.7
#   GitCommit:...}` (4.x).
# - Exit statuses: 0 rendered (YAML on stdout); 1 build error (`Error: accumulating resources:
#   ...`); usage errors 1 (`Error: unknown flag: --x`, `Error: specify one path to
#   kustomization.yaml`).

tool: "kustomize"
verified: "5.8.3"
runner: path
pick: kustomize-or-kubectl
version_args: "version"
usage: {exit: [1], pattern: "^[Ee]rror: (unknown (shorthand )?flag|invalid argument .+ flag|flag needs an argument|specify one path to kustomization)"}
ranges:
  - from: "4.0.0"
    source: "kubernetes CHANGELOG-1.21 (Kustomize Updates in Kubectl: v2.0.3 -> v4.0.5); github.com/kubernetes-sigs/kustomize/releases/tag/kustomize%2Fv5.0.0"
    ops:
      "build": "build"
