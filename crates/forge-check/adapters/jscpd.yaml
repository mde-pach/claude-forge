# jscpd, the project's own (§16). What changed between its releases, for what Forge asks of it
# (forge_jscpd, code/jscpd/duplicates: `jscpd --reporters json --silent --output <dir>`, read
# as `<dir>/jscpd-report.json`: `duplicates[]` with `firstFile` and `secondFile` (`name`,
# `start`, `end`) and `lines`, and `statistics.total.percentage`):
#
# - 3.0.0, 3.5.10, 4.0.0, 4.3.0 (JavaScript) and 5.0.4, 5.4.3 (the Rust rewrite, same npm
#   package) write the same report (verified); 3.x leaves `tokens` 0, 5.x prints `cpd <version>`
#   for --version (the version is read from the package's package.json). 3.0.0 is the oldest
#   covered release.
# - Forge passes no path: like a bare `jscpd`, every release scans the config's `path`, else
#   the directory it runs in (verified 4.3.0, 5.4.3). 5.0 respects .gitignore by default (4.x
#   only with the config's `gitignore`), so what a release scans is the project's own run.
# - Exit 1 when the duplication goes over the config's `threshold` (`ERROR: jscpd found too
#   many duplicates`) or when the config's `exitCode` asks for it; the report is written either
#   way. Usage errors: commander's `error: unknown option '--x'` (exit 1, 3.x and 4.x), clap's
#   `error: unexpected argument '--x' found` (exit 2, 5.x).

tool: "jscpd"
verified: "5.4.3"
package: "jscpd"
usage: {exit: [1, 2], pattern: "^error: (unknown option|unexpected argument) "}
ranges:
  - from: "3.0.0"
    source: "jscpd 3.0.0, 3.5.10, 4.0.0, 4.3.0, 5.0.4, 5.4.3: the same json report (--reporters json --output)"
    ops:
      "duplicates-json": "--reporters json --silent --output {args}"
