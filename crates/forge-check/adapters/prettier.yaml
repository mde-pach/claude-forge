# Prettier, the project's own (§16). What changed between its releases, for what Forge asks
# of it (`--check`, `--write --ignore-unknown`, `--stdin-filepath`):
#
# - 2.1.0 is the oldest covered: it added `--ignore-unknown` (prettier.io/blog/2020/08/24/
#   2.1.0.html, "Added `--ignore-unknown` (alias `-u`) flag" #8829). 2.0.5 takes it for an
#   unknown option, swallows the next word as its value (`[warn] Ignored unknown option
#   --ignore-unknown=src/cart.ts.`) and fails on the next unknown file (`[error] No parser
#   could be inferred for file: data.xyz`, exit 2), so the changed-files run cannot be
#   expressed; 2.0.5 also lists unformatted files on stdout without the `[warn] ` prefix
#   that Forge's attribution reads (2.1.0+: `[warn] src/cart.ts` on stderr; verified).
# - 3.0.0 (prettier.io/blog/2023/07/05/3.0.0.html: ESM, new defaults, `--loglevel` renamed
#   `--log-level` #13204) keeps every flag Forge passes (verified 3.0.0, 3.9.10).
# - No unknown-option error: Prettier warns `[warn] Ignored unknown option --x.` and runs
#   as if it were absent (exit 0/1 as the check says, every version run). Only a bad value
#   is an error: exit 1 (the same as `--check` finding unformatted files) and `[error]
#   Invalid --<option> value. ...` on stderr; unformatted files are `[warn] <path>` lines,
#   parse errors `[error] <path>: SyntaxError ...` with exit 2.

tool: "prettier"
verified: "3.9.10"
usage: {exit: [1, 2], pattern: "^\\[error\\] Invalid --[a-zA-Z-]+ value"}
ranges:
  - from: "2.1.0"
    source: "prettier CHANGELOG.md 2.1.0 / prettier.io/blog/2020/08/24/2.1.0.html: `--ignore-unknown` (#8829)"
    ops:
      "format": "--write --ignore-unknown"
      "format-check": "--check"
      "format-stdin": "--stdin-filepath {args}"
