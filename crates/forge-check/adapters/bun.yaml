# Bun as the project's package manager and test runner, found on PATH (§16). Forge also runs
# bun as its own JavaScript runtime (`forge_helper bun x.mjs`, `forge_ratchet bun …`,
# `bun --no-install -e '…'`, `bun -e`, `bun <helper>.mjs`, `bunx <pinned tool>`): those stay
# direct, so `direct` matches only bun's package-manager and test subcommands.
#
# What Forge asks of it: `lock-check` and `lock` (typescript/bun/lock-sync: is bun.lock in sync
# with the package.json files, and bring it in sync, without installing) and `test-files`
# (typescript/bun/test: `bun test ./a.test.ts …`, the paths prefixed with ./ so bun takes them
# as files, not name filters). What changed:
#
# - `bun install --frozen-lockfile` fails on a stale lock with `error: lockfile had changes,
#   but lockfile is frozen` (exit 1) from 1.0.0 on, with the binary bun.lockb as with the text
#   bun.lock (bun.com/blog/bun-v1.1.39: "bun.lock is bun's new text-based lockfile", behind
#   `--save-text-lockfile`; bun.com/blog/bun-v1.2: "a new text-based lockfile: bun.lock", the
#   default from 1.2.0, verified): the lock format changes nothing here. But it is a real
#   install: on a lock in sync it writes node_modules and runs the project's lifecycle scripts,
#   which a check must not do.
# - 1.1.43 added `--lockfile-only` (bun.com/blog/bun-v1.1.43: "New: `--lockfile-only` option
#   for bun install", oven-sh/bun#16143): it resolves and writes the lock, and installs nothing.
#   With `--frozen-lockfile` it fails on a stale lock as above and writes nothing (verified on
#   1.3.10: no node_modules, no lifecycle script, the stale lock unchanged; in sync, exit 0).
#   Before 1.1.43 bun ignores the unknown flag and installs, so older releases can neither
#   check nor update the lock without installing. 1.0.0 is the oldest covered release (the
#   first stable one).
# - `bun test ./b.test.ts` ran nothing on 1.0.0 to 1.0.15 (`Ran 0 tests across 0 files.`,
#   exit 0 even for a failing test: a false pass) and runs the file from 1.0.16 (verified
#   1.0.0, 1.0.15 vs 1.0.16, 1.0.17). The 1.0.16 release notes (bun.sh/blog/bun-v1.0.16) do
#   not name the fix: the boundary is the binaries'.
# - 1.4.4 made package-manager commands reject unknown flags (bun.com/blog/bun-v1.4.4:
#   "Package manager commands and bunx used to ignore unknown flags … error: bun install has no
#   --frozen-lockfil flag."): exit 1 and that line. Before, `bun install` ignores them (exit 0,
#   1.0.0–1.4.0 verified); `bun test` still ignores unknown options on 1.4.4, so a mistyped
#   test option is never reported as a usage error.
# - `text-lock` (the setup `forge apply` offers where typescript/bun/text-lockfile is active and
#   the project has a binary bun.lockb, §3.5): `bun install --save-text-lockfile
#   --frozen-lockfile --lockfile-only`, bun's documented migration. `--save-text-lockfile` is from
#   1.1.39 (bun.com/blog/bun-v1.1.39), and without 1.1.43's `--lockfile-only` the command
#   installs, so the operation starts at 1.1.43 like `lock`. Verified on 1.1.43, 1.2.0 and
#   1.3.10: bun.lock written from bun.lockb with the same packages, nothing installed and no
#   lifecycle script run; a bun.lockb that no longer matches package.json fails (`error: lockfile
#   had changes, but lockfile is frozen`, exit 1) and writes nothing. 1.2.0 and 1.3.10 delete
#   bun.lockb, 1.1.43 keeps it (Forge deletes it after).
# - Not an invocation change, noted: with no lock file, `bun install --frozen-lockfile` fails on
#   1.0.0 but creates the lock and installs (exit 0) on 1.1.38 and later.

tool: "bun"
verified: "1.4.4"
runner: path
direct: "(^|[;&|`!{]|\\$\\(|\\b(?:then|do|else|exec|time)\\s)\\s*bun\\s+(?:install|i|add|a|remove|rm|update|upgrade|outdated|link|unlink|pm|test|ci|audit|publish|patch|patch-commit|why|info)(?=$|[\\s;&|)`])"
usage: {exit: [1], pattern: "^error: bun [a-z]+ has no .* flag"}
ranges:
  - from: "1.0.0"
    to: "1.0.16"
    source: "bun 1.0.0–1.0.15 binaries: bun test ./file runs 0 files, exit 0 (release notes silent; fixed in 1.0.16, bun.sh/blog/bun-v1.0.16)"
    ops:
      "lock": null
      "lock-check": null
      "test-files": null
      "text-lock": null
  - from: "1.0.16"
    to: "1.1.43"
    source: "bun 1.0.16 binary (bun test ./file runs it); bun.com/blog/bun-v1.1.43 (--lockfile-only is new: before, bun install installs)"
    ops:
      "lock": null
      "lock-check": null
      "test-files": "test"
      "text-lock": null
  - from: "1.1.43"
    source: "bun.com/blog/bun-v1.1.43 (bun install --lockfile-only, #16143); bun.com/blog/bun-v1.4.4 (unknown flags are errors in package-manager commands)"
    ops:
      "lock": "install --lockfile-only --ignore-scripts"
      "lock-check": "install --frozen-lockfile --lockfile-only"
      "test-files": "test"
      "text-lock": "install --save-text-lockfile --frozen-lockfile --lockfile-only"
