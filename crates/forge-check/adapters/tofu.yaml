# OpenTofu, from PATH (§16): the adapter terraform.ts's `pick` (forge_tf_bin) selects for an
# OpenTofu repository. Same operations as Terraform's, same words.
#
# - 1.6.0 is OpenTofu's first stable release (github.com/opentofu/opentofu/releases/tag/v1.6.0,
#   forked from Terraform 1.6): `fmt` takes several targets from the start, so one range.
# - Since: the usage text of `fmt` changed (1.13.2 prints `Error: Failed to parse command-line
#   options` with the flag error inside its diagnostic box, 1.6.0 and 1.10.0 print the usage
#   text then `Error parsing command-line flags: flag provided but not defined: -x`); the flag
#   line is in both. A bad file argument exits 2 on 1.6.0/1.10.0, 1 on 1.13.2. 1.11 #2905
#   validates non-root modules with configuration_aliases; 1.14 (unreleased) changes `fmt`'s
#   paths under a symlinked working directory (#3879). Verified 1.6.0, 1.10.0, 1.13.2.
# - Exit statuses as Terraform's: fmt -check 0 / 3; validate 0 / 1 (`... automatically by
#   running: tofu init` when providers are missing, which forge_tf_validate reports skipped);
#   usage errors 1: `flag provided but not defined: -x`, `invalid value "foo" for flag -check`.

tool: "tofu"
verified: "1.13.2"
runner: path
usage: {exit: [1], pattern: "flag provided but not defined: |invalid ([a-z]+ )?value .+ for (flag )?-"}
ranges:
  - from: "1.6.0"
    source: "github.com/opentofu/opentofu/releases/tag/v1.6.0 (first stable release); v1.6/CHANGELOG.md"
    ops:
      "format": "fmt"
      "format-check": "fmt -check -recursive"
      "validate": "validate -no-color"
