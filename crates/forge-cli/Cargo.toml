[package]
name = "forge-cli"
description = "Claude Forge's command line: forge (also installed as claude-forge)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "forge"
path = "src/main.rs"

[[bin]]
name = "claude-forge"
path = "src/bin/claude-forge.rs"

[dependencies]
clap.workspace = true
forge-core.workspace = true
forge-detect.workspace = true
forge-home.workspace = true
forge-launcher.workspace = true
forge-packs.workspace = true
forge-render.workspace = true
include_dir.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
toml.workspace = true
