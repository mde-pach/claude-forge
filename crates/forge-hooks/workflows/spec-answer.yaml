id: spec-answer
description: The spec step. A writer maps the request and the project, works the conflicts through on the project's data (running code to measure, in a read-only sandbox) and writes the statements; the open questions outside conflicts are answered from the request and the project; conflicts and undecided questions stay open for the coding agent.
on: first-prompt
inputs: [request]
steps:
  writer:
    tools: [Read, Grep, Glob, Bash]
    max_turns: 120
    output_schema:
      type: object
      additionalProperties: false
      required: [coverage, conflicts, must_hold, must_stay_unchanged, open_questions]
      properties:
        coverage:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, role, used_by_code, status]
            properties:
              item: {type: string}
              role: {type: string}
              used_by_code: {type: boolean}
              status: {type: string, enum: [clear, unclear]}
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rows, case, requirements, resolutions]
            properties:
              rows: {type: array, items: {type: integer}}
              case: {type: string}
              requirements:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [requirement, strictness]
                  properties:
                    requirement: {type: string}
                    strictness: {type: string}
              resolutions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [resolution, gives]
                  properties:
                    resolution: {type: string}
                    gives: {type: string}
        must_hold: {type: array, items: {type: string}}
        must_stay_unchanged: {type: array, items: {type: string}}
        open_questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, question, why]
            properties:
              row: {type: integer}
              question: {type: string}
              why: {type: string}
    prompt: |
      You prepare a specification for a coding agent that will change this project to satisfy the request below and write the tests for it. You can read the project (Read, Grep, Glob) and run commands (Bash) to measure: run the project's program, or a short script of your own, on the project's data. The project's files are read-only to you: put any script you write in $TMPDIR. You never write the fix.

      Work in this order.

      1. coverage: one row for each sentence of the request and for each item the project gives the code (each field of each data file, each configuration value, each parameter), numbered from 1 in the list's order. For each: the item; what it changes in the result on the project's own data, measured by running the current program where you can; whether the current code uses it; status. Status is "clear" only when a single reading of the request and the project gives that result; when another reading of what is provided (another input, or another way to use the same input) gives a different result, the row is "unclear". An item whose role changes nothing on the project's own data is unclear. A sentence that names a category covers every instance of it: name them. For each result the request asks for, try each input provided that could decide it, compute what each gives, and say whether they agree.

      2. conflicts: work the requested result through on the project's own data, far enough to find the cases where two requirements cannot both hold. A requirement can come from the request, the data or the code. For each case: the numbers of the coverage rows it involves; where it happens, with the values; each requirement involved and what in the request or the data shows how strict it is, quoted; and every way to resolve it, including relaxing each requirement as far as the request and the data allow. For each resolution, compute what it gives in that case by running code on the project's data: the value of every output field it changes. A value you could not compute says so, and why. State the values only: no judgement of whether a resolution is acceptable, and do not choose between them.

      3. must_hold: what the result must do, from the clear rows, most important first, at most 12. Each pins a concrete result for a given input: the exact output, value, file or error, computed rather than estimated. Nothing that depends on how a conflict or an unclear row is resolved: a statement never picks between readings.

      4. must_stay_unchanged: only what the request explicitly asks to keep, quoted.

      5. open_questions: one per unclear row that no conflict involves: the row's number; the question, naming the readings and what each gives on the project's own data, computed; why it matters.

      No design and no implementation steps.

      Repository: {{ repo }}

      REQUEST:
      <request>
      {{ request }}
      </request>
  answer:
    if: steps.writer.output.open_questions | length > 0
    tools: [Read, Grep, Glob, Bash]
    max_turns: 60
    output_schema:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [question, evidence, decided, answer]
            properties:
              question: {type: string}
              evidence: {type: string}
              decided: {type: boolean}
              answer: {type: string}
    prompt: |
      A coding agent asks the questions below before it changes anything. Answer each from evidence: the user's request and the project's code and data. You can read the project (Read, Grep, Glob) and run commands (Bash) to check what a reading gives on the project's data; the project's files are read-only to you: put any script you write in $TMPDIR.

      For each question, in this order:
      - evidence: what in the request or the project bears on it, citing the file, field or value, and what each reading gives on the project's data.
      - decided: true when the evidence points to one reading. Weigh only the request and the project: general knowledge of the field does not decide a question. Weigh the request's own words first; then prefer the reading under which everything the request and the project provide has a role: a reading that leaves something provided with no effect on any result is less likely to be the intended one. False when the evidence supports the readings equally, when each reading gives a role to something the other leaves aside, or when you could not compute what the reading you would choose gives on the project's data.
      - answer: when decided, the reading the evidence supports, short; when not decided, empty.

      Answer every question, with its exact text.

      Repository: {{ repo }}

      The user's request:
      <request>
      {{ request }}
      </request>

      The questions:
      {% set conflicts = namespace(rows=[]) %}
      {% for c in steps.writer.output.conflicts %}
      {% set conflicts.rows = conflicts.rows + c.rows %}
      {% endfor %}
      {% for q in steps.writer.output.open_questions if q.row not in conflicts.rows %}
      - {{ q.question }}
      {% endfor %}
result: |
  Details that complete the request above, so its result can be checked; the request comes first where they differ.

  Must hold:
  {% for s in steps.writer.output.must_hold %}
  S{{ loop.index }}. {{ s }}
  {% endfor %}
  {% if steps.writer.output.must_stay_unchanged %}

  Kept, as the request asks:
  {% for s in steps.writer.output.must_stay_unchanged %}
  U{{ loop.index }}. {{ s }}
  {% endfor %}
  {% endif %}
  {% if steps.answer.output %}
  {% set decided = steps.answer.output.answers | selectattr("decided") | list %}
  {% if decided %}

  Settled from the request and the project:
  {% for a in decided %}
  - {{ a.question }} -> {{ a.answer }}
  {% endfor %}
  {% endif %}
  {% endif %}
  {% set open = [] %}
  {% if steps.answer.output %}{% set open = steps.answer.output.answers | rejectattr("decided") | list %}{% endif %}
  {# a question on a row a conflict involves skips the answerer: it is handed over open #}
  {% set conflicts = namespace(rows=[]) %}
  {% for c in steps.writer.output.conflicts %}
  {% set conflicts.rows = conflicts.rows + c.rows %}
  {% endfor %}
  {% set held = steps.writer.output.open_questions | selectattr("row", "in", conflicts.rows) | list %}
  {% if open or held or steps.writer.output.conflicts %}

  Open, to settle while coding (each option with what it gives on the project's data):
  {% for a in open %}
  - {{ a.question }}
  {% endfor %}
  {% for q in held %}
  - {{ q.question }}
  {% endfor %}
  {% for c in steps.writer.output.conflicts %}
  - {{ c.case }}
    Options:
  {% for o in c.resolutions %}
    ({{ loop.index }}) {{ o.resolution }} -> {{ o.gives }}
  {% endfor %}
  {% endfor %}
  {% endif %}
