[project]
name = "fastapi-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "asyncpg>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff.lint]
select = ["E", "F", "ANN401", "E722"]

[tool.pytest.ini_options]
filterwarnings = ["error::pydantic.warnings.PydanticDeprecationWarning"]


[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.9.17"
