# pydantic/logfire. Mirrors `make install` / CI (`uv sync --frozen`, default `dev` group, which
# includes the logfire-api workspace member) on Python 3.12 (in the CI matrix).
logfire:
  url: https://github.com/pydantic/logfire
  mirror: /work/repos/pydantic__logfire
  lang: python
  image: forge-exp/base:v1
  # /cache/uv is a per-container overlay (writable view; repo_env.start_container); fall back to
  # a symlink farm into the image cache when it is a plain read-only bind.
  install: >-
    set -e; if touch /cache/uv/.forge-w 2>/dev/null; then rm -f /cache/uv/.forge-w; else export UV_CACHE_DIR=/opt/forge-cache/uv; uv-cache-overlay /cache/uv; fi;
    uv sync --frozen --offline --python 3.12
  warm: UV_CACHE_DIR=/cache/uv UV_OFFLINE=false uv sync --frozen --python 3.12
  lockfiles: [uv.lock]
  path_prepend: /work/.venv/bin
  test_file_regex: '(^|/)(tests?|testing)/.*\.py$|(^|/)test_[^/]*\.py$|_test\.py$|(^|/)conftest\.py$'
  test_cmd: >-
    pytest -p no:cacheprovider -o junit_family=xunit1 --junitxml={junit}
    --continue-on-collection-errors -q --no-header -rN {targets}
  lint_cmd: ruff check --no-cache --output-format=json {files}
  junit_flavor: pytest
  env:
    UV_PYTHON: "3.12"
    # The agent's own uv/uvx (uv run, Forge's uvx tools) use the same warm cache as the install.
    UV_CACHE_DIR: /cache/uv
