# inngest/inngest-js. pnpm 10.12.1 workspace (packages/*), vitest 3 run per package (no root
# vitest config), Biome 2.1. Mirrors CI (.github/workflows/pr.yml + .github/actions/
# setup-and-build): `pnpm install --frozen-lockfile`, build packages/test (@inngest/test, whose
# dist the inngest tests import), then `vitest run` in packages/inngest (`npm run test`).
# packages/inngest's own `build` is not needed by its unit tests (they import source; the
# generated src/version.ts is produced by its `pb:version` script, as `prebuild` does in CI).
# The package's vitest config is kept as is, including typecheck (tsc on *.test.ts).
# See harness/IMAGES_TS.md for the judgement calls.
inngest-js:
  url: https://github.com/inngest/inngest-js
  mirror: /work/repos/inngest__inngest-js
  lang: typescript
  image: forge-exp/inngest-js:v1
  lockfiles: [pnpm-lock.yaml, pnpm-workspace.yaml, package.json]
  install_timeout: 1800
  # --ignore-scripts: the root and eslint-plugin-internal `preinstall` is `npx only-allow pnpm`,
  # which downloads `only-allow` from the registry (fails offline). The only dependency builds
  # allowed (onlyBuiltDependencies: aws-sdk, core-js, protobufjs) are notices/version checks.
  warm: >-
    set -e;
    if [ -n "${NODE_EXTRA_CA_CERTS:-}" ]; then export npm_config_cafile="$NODE_EXTRA_CA_CERTS" pnpm_config_cafile="$NODE_EXTRA_CA_CERTS"; fi;
    pnpm install --frozen-lockfile --ignore-scripts --store-dir /cache/pnpm --package-import-method copy
  install: |
    set -e
    W=/tmp/pnpm-store
    for d in /cache/pnpm/v*; do
      [ -d "$d" ] || continue
      v=$(basename "$d"); mkdir -p "$W/$v"
      for e in "$d"/*; do
        n=$(basename "$e")
        if [ "$n" = files ]; then ln -sfn "$e" "$W/$v/files"; else cp -a "$e" "$W/$v/"; fi
      done
    done
    pnpm install --frozen-lockfile --offline --ignore-scripts --store-dir "$W" --package-import-method copy
    (cd packages/test && pnpm run build)
    (cd packages/inngest && pnpm run pb:version)
  path_prepend: /work/node_modules/.bin:/work/packages/inngest/node_modules/.bin
  test_file_regex: '(^|/)(tests?|__tests__|testing)/|(^|/)test_[^/]*\.py$|_test\.py$|(^|/)conftest\.py$|\.(test|spec)\.(m?[jt]sx?|cts)$'
  # Targets are grouped by their workspace package (nearest package.json); vitest runs in each
  # package directory with that package's config (as CI does), one JUnit per package; the
  # JUnit files are merged into {junit} with classnames made repo-relative.
  test_cmd: |
    cd /work
    J=$(mktemp -d /tmp/fx-junit.XXXXXX)
    for t in {targets}; do
      d=$(dirname "$t")
      while [ "$d" != "." ] && [ ! -f "$d/package.json" ]; do d=$(dirname "$d"); done
      printf '%s\t%s\n' "$d" "${t#$d/}"
    done > "$J/map"
    rc=0; i=0
    for d in $(cut -f1 "$J/map" | sort -u); do
      i=$((i+1))
      files=$(awk -F'\t' -v d="$d" '$1==d {print $2}' "$J/map" | tr '\n' ' ')
      echo "[forge-exp] vitest in $d: $files"
      v=vitest; [ -x "$d/node_modules/.bin/vitest" ] && v=./node_modules/.bin/vitest
      (cd "$d" && NO_COLOR=1 $v run $files --reporter=default --reporter=junit --outputFile.junit="$J/$i.xml") || rc=$?
      printf '%s\t%s\n' "$J/$i.xml" "$d" >> "$J/parts"
    done
    python3 - "$J/parts" {junit} <<'PY'
    import sys, os, xml.etree.ElementTree as ET
    out = ET.Element("testsuites", name="vitest tests")
    for line in open(sys.argv[1]):
        path, pkg = line.rstrip("\n").split("\t")
        if not os.path.exists(path):
            continue
        pre = "" if pkg == "." else pkg + "/"
        root = ET.parse(path).getroot()
        for ts in root.iter("testsuite"):
            ts.set("name", pre + ts.get("name", ""))
            for tc in ts.iter("testcase"):
                cls, nm = tc.get("classname", ""), tc.get("name", "")
                if nm == cls:
                    tc.set("name", pre + nm)
                tc.set("classname", pre + cls)
            out.append(ts)
    if len(out):
        ET.ElementTree(out).write(sys.argv[2], encoding="utf-8", xml_declaration=True)
    PY
    rm -rf "$J"
    exit $rc
  # Only files that still exist are linted (a deleted file would otherwise yield a biome
  # internalError/io "finding"); with no file left, biome is not run (it would lint the repo).
  lint_cmd: |
    set --
    for f in {files}; do [ -f "$f" ] && set -- "$@" "$f"; done
    [ $# -eq 0 ] && { echo '{"diagnostics":[]}'; exit 0; }
    biome lint --reporter=json --no-errors-on-unmatched --files-ignore-unknown=true "$@"
  junit_flavor: vitest
  env:
    pnpm_config_store_dir: /tmp/pnpm-store
    npm_config_store_dir: /tmp/pnpm-store
    pnpm_config_package_import_method: copy
    npm_config_package_import_method: copy
